name: Pruebas
on:
  push:
    paths: ['fuente/**', '.github/workflows/pruebas.yml']
  workflow_dispatch:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - name: Pasar todas las pruebas
        run: cd fuente && python pruebas/todas.py
