name: Copia de seguridad
on:
  schedule:
    - cron: '17 3 * * *'   # cada noche (hora UTC)
  workflow_dispatch:        # y cuando quieras, con el botón «Run workflow»
permissions:
  contents: read
jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copiar la base de datos (cifrada)
        run: node fuente/copias/copia.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          BACKUP_PASS: ${{ secrets.BACKUP_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: copia-${{ github.run_number }}
          path: copia-*.bin
          retention-days: 90
