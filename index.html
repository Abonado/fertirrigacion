<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abonado">
<meta name="application-name" content="Abonado-Fertirrigación">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Abonado-Fertirrigación</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: herramienta de campo, móvil primero. Cabecera fija con día + cabezal + pestañas; tarjetas por depósito; barra de guardado inferior. */
:root{
  --bg:#eef2ef; --surface:#ffffff; --surface-2:#f6f8f6; --ink:#15222c; --muted:#5a6a70; --line:#d6dfda;
  --accent:#1d6b47; --accent-ink:#ffffff; --navy:#1b2f4a;
  --ok:#23704a; --ok-bg:#dcefe3; --warn:#8a5a0c; --warn-bg:#f8e8c8; --bad:#a3271b; --bad-bg:#f7d9d4;
  --bar:#cfe0d6;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;text-transform:uppercase}
button,input,select,textarea,label{text-transform:inherit}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
.num,td,.stat b,.inp input{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 0;display:grid;gap:10px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
h1{font-size:28px;line-height:1;color:var(--navy);font-weight:700}
.date{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.date input{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.scroller::-webkit-scrollbar{display:none}
.scroller.drag{cursor:grabbing;user-select:none}
@media (hover:hover) and (pointer:fine){.scroller{flex-wrap:wrap;overflow:visible;row-gap:2px}}
.chip{flex:none;font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.tabs .tab{flex:none;font:600 15px var(--f-display);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:8px 10px 10px;border-bottom:3px solid transparent;cursor:pointer}
.tabs .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:16px 120px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px;min-width:0}
.card h3{font-size:20px;font-weight:600}
.sub{font-size:13px;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px}
.banner b{color:var(--warn)}
.note{font-size:13px;color:var(--muted)}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.summary .wide{grid-column:1/-1}
.summary td b{white-space:nowrap;font-size:18px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.stat>span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.stat b{font:600 24px var(--f-display)}
.stat small{font-size:12px;color:var(--muted)}

.tank-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.field{display:grid;gap:4px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.inp{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.inp input{font:600 18px var(--f-body);color:var(--ink);background:transparent;border:0;padding:7px 8px;width:7.5ch;text-align:right}
.inp input.wide{width:14ch;text-align:left;font-size:16px}
.nmf .inp input.wide{width:100%;min-width:0}
.inp .u{font-size:13px;color:var(--muted);padding-right:9px}
.field.big .inp input{font-size:24px;width:6ch}
.inp.sm input{font-size:15px;width:6ch;padding:5px 6px}

.tbl{overflow-x:auto}
.lvlbtn{all:unset;display:grid;gap:4px;cursor:pointer;border-radius:10px;padding:4px;margin:-4px}.lvlbtn:hover{background:var(--bg)}.lvlbtn:focus-visible{outline:2px solid var(--accent)}
.lvlmas{margin-left:auto;font-size:11px;color:var(--muted)}
.tq{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;align-items:start;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface,#fff);animation:tqin .25s ease-out}
@keyframes tqin{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
@media (max-width:480px){.tq{grid-template-columns:132px minmax(0,1fr)}}
.tqsvg{width:100%;height:auto;display:block}.tqliq{transition:y .6s ease,height .6s ease}.tqola{animation:tqola 3s ease-in-out infinite alternate}@keyframes tqola{to{transform:translateX(-12px)}}
.tqi{display:grid;gap:10px}.tqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}.tqs>div{background:var(--bg);border-radius:10px;padding:7px 9px;display:grid}.tqs span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}.tqs b{font-size:17px}.tqs small{font-size:11px;color:var(--muted);text-transform:none}
.tqb{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;height:64px;align-items:end}.tqb>div{display:grid;grid-template-rows:1fr auto;height:100%;text-align:center}.tqb i{align-self:end;display:block;background:var(--accent);border-radius:4px 4px 0 0;min-height:0}.tqb small{font-size:10px;color:var(--muted)}
.ev.auto{opacity:.8}

.edc{border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}.edch{display:flex;gap:10px;align-items:center;width:100%;background:var(--bg);border:0;padding:12px;font:inherit;color:inherit;cursor:pointer;text-align:left}
.edch b{font-size:16px}.edch small{flex:1;color:var(--muted);font-size:12px;text-transform:none}.edcb{padding:12px;display:grid;gap:10px}.edcb h4{margin:6px 0 0;font-size:14px;text-transform:uppercase;color:var(--muted)}
.eds,.edd{border-left:3px solid var(--accent);padding:4px 0 4px 10px;display:grid;gap:8px}.edb{display:grid;grid-template-columns:minmax(0,1fr) 140px auto;gap:6px;align-items:center}.edb .inp{width:100%;min-width:0}.edb .inp input{width:100%;min-width:0}
.edcb .inp input[style*="text-transform:none"],.edf .inp input[style*="text-transform:none"]{text-align:left!important;width:100%}.edcb .field .inp,.edf .field .inp{width:100%}
.edx{border:0;background:none;color:var(--bad);font-weight:800;cursor:pointer;padding:0 0 0 4px}.edf .inp input{width:100%}

.mapwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:78vh;background:#f7f3e8;-webkit-overflow-scrolling:touch}
.mapin{min-width:100%}.mapsvg{display:block;width:100%;height:auto;cursor:crosshair;user-select:none;-webkit-user-select:none}
.mapsvg .nave{cursor:crosshair}.mapsvg .mpin{cursor:pointer}.mapsvg .mpulse{animation:mpuls 1.6s ease-out infinite;transform-origin:0 -30px}
@keyframes mpuls{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(1.6)}}
.mley{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}.mley i,.mdot{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#fff;font:800 11px/1 var(--f-body,inherit);font-style:normal;margin-right:5px;vertical-align:-5px}
.mlist{display:grid}.mrow{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 4px;cursor:pointer;font:inherit;color:inherit;width:100%}
.mrow:first-child{border-top:0}.mrow.on{background:var(--bg);border-radius:10px}.mrow .mt{flex:1;min-width:0}.mrow .mt b{display:block}.mrow .mt small{display:block;color:var(--muted);font-size:12.5px;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mr{display:grid;justify-items:end;gap:3px}.mrow .mr small{font-size:11px;color:var(--muted)}
.cohor{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;margin:4px 0 6px}
.cohor .inp input[type=time],.coper .inp input[type=time]{width:auto;font-size:16px;text-align:left}.cofe .inp input[type=date]{width:auto;font-size:15px;text-align:left}.coper .inp select{width:auto}
.coper{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.coper .nm b{display:block;font-size:15px;text-transform:none}.coper .nm small{color:var(--muted);font-size:12px}
.coper .hrs{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.coper.fal .nm b{color:var(--bad)}.coper.jus .nm b{color:var(--warn)}.coper.baja .nm b,.coper.vac .nm b{color:var(--muted)}
.coadd{margin-top:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}@media (max-width:520px){.coadd{grid-template-columns:1fr}}.coadd .inp{min-width:0}.coadd .inp input{width:100%}
.cotr{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;display:grid;gap:8px}
.cotr-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.cotr-h b{font-size:15px}.cotr-h small{flex:1;color:var(--muted);font-size:12.5px;text-transform:none}.cotr-h small b{font-size:12.5px;color:var(--ink)}
.copas{display:flex;flex-wrap:wrap;gap:6px}.copas .chip{min-width:38px;text-transform:none}
.coqp{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.coqp label{text-transform:none}
.coge{display:grid;gap:6px}.coge .row{flex-wrap:nowrap}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px}

.cvwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:640px){.cvwrap{grid-template-columns:1fr}}
.cvplant{background:linear-gradient(#e8f3fb,#f5f9f6 70%);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.cvsvg{display:block;width:100%;height:auto}
.cvinfo{display:grid;gap:10px}
.cvdia{display:grid;gap:2px}.cvdia b{font-size:16px}.cvdia span{font-size:13px;color:var(--muted)}
.cvst{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.cvst>div{background:var(--bg);border-radius:10px;padding:8px 10px;display:grid;gap:1px}
.cvst span{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}.cvst b{font-size:20px}.cvst.sm b{font-size:16px}.cvst small{font-size:11.5px;color:var(--muted);text-transform:none}
.cvslide input{width:100%;accent-color:var(--accent)}.cvslide .t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.cvgraf{display:block;width:100%;height:auto}.cvley{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.cvley i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.salida{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.salida>div{background:var(--bg);border-radius:10px;padding:10px 12px;display:grid;gap:2px}.salida span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}.salida b{font-size:22px}.salida small{font-size:12px;color:var(--muted)}
.ev .evc{display:block;color:var(--muted);font-size:12px;margin-top:2px;text-transform:none}
.ptbody{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.u{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.nd{background:var(--surface-2);color:var(--muted)}
.line{font-size:14px;color:var(--muted)}
.line b{color:var(--ink)}

.sector-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bj{display:grid;grid-template-columns:minmax(70px,1fr) auto minmax(90px,1.2fr);gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.bj .nm b{display:block;font-size:15px}
.bj .nm small{color:var(--muted);font-size:12px}
.bj,.bjh{grid-template-columns:minmax(70px,1fr) 100px 164px minmax(90px,1.2fr)}
.bjce{display:flex;gap:6px}
.meter .vt{font-size:14px;color:var(--ink);margin-left:2px}
.bjce .inp{flex:1}.bjce .inp input{width:100%;min-width:0}
.bjh{display:grid;gap:10px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding-top:6px}
.meter{display:grid;gap:3px;min-width:0}
.meter .bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent)}
.meter .bar i.bad{background:var(--bad)}
.meter .t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:6px}
.meter .t b{font-size:15px;color:var(--ink)}

.pick{display:flex;flex-wrap:wrap;gap:6px}
.steps{display:grid;gap:0}
.step{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.step:first-child{border-top:0}
.step b{font:600 20px var(--f-display);white-space:nowrap}
.step.water{background:var(--surface-2);margin:0 -14px;padding:10px 14px;border-radius:0 0 10px 10px}

.btn{font:600 15px var(--f-body);border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.hist{display:grid;gap:0}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .d{font:600 17px var(--f-display);white-space:nowrap}
.hrow .cs{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.mini{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.chg{padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.chg:first-child{border-top:0}
.chg ul{margin:4px 0 0;padding-left:18px}

.cfgrow{display:grid;grid-template-columns:1fr repeat(3,auto);gap:10px;align-items:end;padding-block:8px;border-top:1px solid var(--line)}
.cfgrow:first-of-type{border-top:0}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--navy);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{padding-block:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.savebar .btn{border-color:transparent}
.savebar .msg{font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:7;max-width:calc(100% - 32px)}
.foot{padding-block:0 24px;font-size:12px;color:var(--muted)}
.card>*{min-width:0}
.inp select{font:600 16px var(--f-body);color:var(--ink);background:transparent;border:0;padding:7px 8px;width:100%}
textarea{width:100%;font:500 16px var(--f-body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;min-height:84px}
.msgbar{border:0;width:100%;text-align:left;font:inherit;cursor:pointer;font-weight:600}
.msgs{display:grid}
.msg{display:grid;gap:5px;padding:12px 0;border-top:1px solid var(--line)}
.msg:first-child{border-top:0}
.msg.done{opacity:.6}
.msg .h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.msg .h b{color:var(--ink);font-size:14px}
.tareas{display:grid}
.tarea{display:grid;gap:6px;padding:12px 0 12px 12px;border-top:1px solid var(--line);border-left:3px solid var(--line)}
.tarea:first-child{border-top:0}
.tarea.hoy{border-left-color:var(--warn)}.tarea.atrasada,.tarea.urg{border-left-color:var(--bad)}.tarea.hecha{border-left-color:var(--ok);opacity:.85}
.tarea .tt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tarea .tt b{font-size:16px}
.tarea .tm{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.tarea .tm b{color:var(--accent)}.tarea .tm .de{opacity:.8}
.tarea p{margin:0}
.tarea .hecho{background:var(--ok-bg);border-radius:8px;padding:8px 10px;font-size:13px}
.almh{margin:4px 0 10px}
.cleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.cleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.crows{display:grid}.crow{display:grid;gap:5px;padding:10px 0;border-top:1px solid var(--line)}.crow:first-child{border-top:0}
.crow .cn{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}.crow .cn span{font-size:12px;color:var(--muted)}.crow .cn span b{color:var(--ink)}
.cbar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--surface-2)}.cbar i{display:block;height:100%}
.crow .cv{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.crow .cv b{color:var(--ink)}.almh h2{font:700 24px var(--f-display);color:var(--navy);margin:0}

/* ---------- Utilidades ---------- */

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const fmt=(n,d=1)=>n==null||!isFinite(n)?'—':n.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});

/* ---------- Almacenamiento: nube del artifact (db) o, si no hay, este navegador ---------- */
const SYNC=new Set(['incidencias','almacen','llenados','tareas','material','mensajes','crecimiento','partes','registros','cambios','collas','jornadas']);
const ahoraISO=()=>new Date().toISOString();
const Store={db:null,mode:'local',
  /* En la nube: la primera vez descarga todo y lo guarda en el móvil; las siguientes solo pide lo cambiado (campo «mod»).
     Una vez a la semana, o si la caché del móvil está incompleta, vuelve a descargar todo. */
  async sync(n){const col=this.db.collection(n),u=(window.NUBE&&NUBE.user&&NUBE.user.email)||'',key='abono.sync.'+n+'.'+u,meta=this.lsGet(key)||{},inicio=ahoraISO();let docs=null;
    const semana=!meta.full||Date.now()-Date.parse(meta.full)>7*864e5;
    if(meta.last&&!semana&&window.NUBE&&NUBE.persist){try{const c=await col.get({source:'cache'});if(c.docs.length>=(meta.n||0))docs=new Map(c.docs.map(d=>[d.id,{...d.data(),id:d.id}]))}catch(e){docs=null}}
    if(docs){const desde=new Date(Date.parse(meta.last)-30*60e3).toISOString(),q=await col.where('mod','>',desde).get();for(const d of q.docs)docs.set(d.id,{...d.data(),id:d.id});this.lsSet(key,{...meta,last:inicio,n:docs.size})}
    else{const q=await col.get();docs=new Map(q.docs.map(d=>[d.id,{...d.data(),id:d.id}]));this.lsSet(key,{last:inicio,full:inicio,n:docs.size})}
    return [...docs.values()].filter(x=>!x.borrado)},
  async listado(n,lim,orden){orden=orden||'ts';const l=(await this.sync(n)).sort((a,b)=>(a[orden]||'')<(b[orden]||'')?1:-1);return lim?l.slice(0,lim):l},
  async init(){if(window.NUBE&&NUBE.db){this.db=NUBE.db;this.mode='fb';return}try{if(window.claude&&typeof window.claude.use==='function'){const db=await window.claude.use('db');if(db){this.db=db;this.mode='db'}}}catch(e){}},
  lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
  lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  async getConfig(){if(this.db){const s=await this.db.doc('config/finca').get();return s.exists?s.data():null}return this.lsGet('abono.config')},
  async setConfig(c){if(this.db)return this.db.doc('config/finca').set(c);this.lsSet('abono.config',c)},
  async getReg(f){if(this.db){const s=await this.db.doc('registros/'+f).get();return s.exists?s.data():null}return this.lsGet('abono.reg.'+f)},
  async setReg(f,r){if(this.db)return this.db.doc('registros/'+f).set({...r,mod:ahoraISO()});this.lsSet('abono.reg.'+f,r);const i=new Set(this.lsGet('abono.regs')||[]);i.add(f);this.lsSet('abono.regs',[...i])},
  /* Guarda solo los campos que ha cambiado esta persona (no pisa lo que hayan apuntado otros ese día) */
  async mergeReg(f,parcial){if(this.mode==='fb')return this.db.doc('registros/'+f).merge({...parcial,mod:ahoraISO()});const r=this.lsGet('abono.reg.'+f)||{fecha:f};for(const[k,v]of Object.entries(parcial))r[k]=v&&typeof v==='object'&&!Array.isArray(v)?{...(r[k]||{}),...v}:v;return this.setReg(f,r)},
  async listRegs(){if(this.mode==='fb')return this.listado('registros',0,'fecha');if(this.db){const q=await this.db.collection('registros').orderBy('fecha','desc').limit(120).get();return q.docs.map(d=>d.data())}return(this.lsGet('abono.regs')||[]).sort().reverse().slice(0,120).map(f=>this.lsGet('abono.reg.'+f)).filter(Boolean)},
  async addCambio(c){if(this.db)return this.db.collection('cambios').add({...c,mod:ahoraISO()});const l=this.lsGet('abono.cambios')||[];l.unshift(c);this.lsSet('abono.cambios',l.slice(0,200))},
  async listCambios(){if(this.mode==='fb')return this.listado('cambios',200);if(this.db){const q=await this.db.collection('cambios').orderBy('ts','desc').limit(60).get();return q.docs.map(d=>d.data())}return this.lsGet('abono.cambios')||[]},
  async listMsgs(){if(this.mode==='fb')return this.listado('mensajes',300);if(this.db){const q=await this.db.collection('mensajes').orderBy('ts','desc').limit(200).get();return q.docs.map(d=>({...d.data(),id:d.id}))}return this.lsGet('abono.msgs')||[]},
  async addMsg(m){if(this.db){const r=await this.db.collection('mensajes').add({...m,mod:ahoraISO()});return r.id}const id='m'+Date.now();const l=this.lsGet('abono.msgs')||[];l.unshift({...m,id});this.lsSet('abono.msgs',l.slice(0,500));return id},
  async updCol(n,id,patch){if(this.db)return this.db.collection(n).doc(id).update({...patch,mod:ahoraISO()});this.lsSet('abono.'+n,(this.lsGet('abono.'+n)||[]).map(x=>x.id===id?{...x,...patch}:x))},
  async updMsg(id,patch){if(this.db)return this.db.collection('mensajes').doc(id).update({...patch,mod:ahoraISO()});this.lsSet('abono.msgs',(this.lsGet('abono.msgs')||[]).map(x=>x.id===id?{...x,...patch}:x))},
  async delMsg(id){if(this.mode==='fb')return this.db.collection('mensajes').doc(id).update({borrado:true,mod:ahoraISO()});if(this.db)return this.db.collection('mensajes').doc(id).delete();this.lsSet('abono.msgs',(this.lsGet('abono.msgs')||[]).filter(x=>x.id!==id))},
  async listCol(n,lim){if(this.mode==='fb'&&SYNC.has(n))return this.listado(n,lim);if(this.db){const q=await this.db.collection(n).orderBy('ts','desc').limit(lim===0?10000:(lim||500)).get();return q.docs.map(d=>({...d.data(),id:d.id}))}return this.lsGet('abono.'+n)||[]},
  async setCol(n,id,doc){if(this.db)return this.db.collection(n).doc(id).set({...doc,mod:ahoraISO()});const l=(this.lsGet('abono.'+n)||[]).filter(x=>x.id!==id);l.unshift({...doc,id});this.lsSet('abono.'+n,l.slice(0,3000))},
  async addCol(n,doc){if(this.db){const r=await this.db.collection(n).add({...doc,mod:ahoraISO()});return r.id}const id=n[0]+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const l=this.lsGet('abono.'+n)||[];l.unshift({...doc,id});this.lsSet('abono.'+n,l.slice(0,3000));return id},
  /* Mensajes privados: solo los ven quien envía y quien recibe (reglas de Firestore) */
  async listPriv(me){if(Store.mode!=='fb'||!me)return [];const q=await this.db.collection('privados').where('miembros','array-contains',me).get();return q.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>a.ts<b.ts?1:-1)},
  async addPriv(m){const r=await this.db.collection('privados').add(m);return r.id},
  async updPriv(id,p){return this.db.collection('privados').doc(id).update(p)},
  async delPriv(id){return this.db.collection('privados').doc(id).delete()},
  async delCol(n,id){if(this.mode==='fb'&&SYNC.has(n))return this.db.collection(n).doc(id).update({borrado:true,mod:ahoraISO()});if(this.db)return this.db.collection(n).doc(id).delete();this.lsSet('abono.'+n,(this.lsGet('abono.'+n)||[]).filter(x=>x.id!==id))}
};

/* ---------- Estado ---------- */
const st={cfg:clone(DEFAULT_CONFIG),savedCfg:clone(DEFAULT_CONFIG),reg:null,fecha:hoy(),cab:'gas',tab:'cuentas',
  dirtyReg:false,dirtyCfg:false,fill:{},fillB:{},hist:null,cambios:null,ready:false,saving:false,confirmReset:false,

  ent:{p:'kno3',qty:null,fecha:hoy(),prov:'',alb:'',adj:[]},aj:{p:'kno3',real:null},msgs:null,msgCab:null,msgF:'todos',msgDraft:'',msgAdj:[],confirmDel:null,autor:(()=>{try{return localStorage.getItem('abono.autor')||''}catch(e){return ''}})()};

function ejemploReg(f){return{fecha:f,ejemplo:true,m3:{},cm:{},niv:{},min:{},rie:{},dren:{},ceE:{},phE:{},ceD:{},phD:{},ceB:{},ceR:{},inc:{},phS:{},sug:null}}
/* Lo del último día guardado se ofrece como sugerencia (gris), nunca se guarda solo */
const sugDe=(g,id)=>{const s=st.reg&&st.reg.sug;return s&&s[g]&&s[g][id]!=null?s[g][id]:null};
const sugPh=(g,id)=>{const v=sugDe(g,id);return v==null?'':` placeholder="${esc(fCorta(st.reg.sug.fecha))}: ${esc(inVal(v))}"`};
st.regMod=new Set();
const marcaReg=k=>{st.regMod.add(k);st.dirtyReg=true};
function normReg(r,f){return{fecha:f,...(r.resumen?{resumen:r.resumen}:{}),...(r.receta?{receta:r.receta}:{}),m3:{...(r.m3||{})},cm:{...(r.cm||{})},min:{...(r.min||{})},rie:{...(r.rie||{})},ceB:{...(r.ceB||{})},ceR:{...(r.ceR||{})},inc:{...(r.inc||{})},phS:{...(r.phS||{})},dren:{...(r.dren||{})},niv:{...(r.niv||{})},ceE:{...(r.ceE||{})},phE:{...(r.phE||{})},ceD:{...(r.ceD||{})},phD:{...(r.phD||{})},guardado:r.guardado||null}}

/* ---------- Cálculos ---------- */
const prod=id=>st.cfg.productos[id]||{n:id,liq:false,ce:0,un:0};
const cabById=id=>st.cfg.cabezales.find(c=>c.id===id);
const bidonesDe=cab=>st.cfg.bidones.filter(b=>b.cabezales.includes(cab));
const uDosis=p=>prod(p).liq?'cc/hL':'g/hL';
const uCant=p=>prod(p).liq?'L':'kg';
const SACO_DEF={fe:10,trad:5};
function sacoDe(p){if(prod(p).liq)return 0;const c=st.cfg&&st.cfg.saco&&st.cfg.saco[p];return c>0?c:(SACO_DEF[p]||25)}
const nSac=n=>n+(n===1?' saco':' sacos');
function sacosTxt(p,kg){const z=sacoDe(p);if(!z||!(kg>0.001))return '';const n=Math.floor(kg/z+1e-6),r=kg-n*z;return (n?nSac(n):'')+(r>0.05?(n?' + ':'')+fmt(r,1)+' kg':'')}
const sacIn=(p,kg)=>{const z=sacoDe(p);return kg==null||!z?'':inVal(+(kg/z).toFixed(2))};
// kg (o L) del producto principal por 1000 L ÷ su salida deseada = dilución del depósito
function factor(b){const pp=b.productos.find(x=>x.p===b.principal);return pp&&pp.dosis>0&&b.kgPrincipal?b.kgPrincipal/pp.dosis:0}
const conc=(b,x)=>(x.dosis||0)*factor(b);                     // kg o L por 1000 L de depósito
function m3Total(b){let s=0;for(const c of b.cabezales){const v=st.reg.m3[c];if(v==null)return null;s+=v}return s}
// Depósito compartido: a cada cabezal le toca lo esperado por sus m³ y la receta,
// y la diferencia con lo gastado de verdad se reparte a partes iguales
function cmCab(b,cab){const cm=st.reg.cm[b.id];if(cm==null)return null;if(b.cabezales.length<2)return cm;
  const pp=b.productos.find(x=>x.p===b.principal);if(!pp||!pp.dosis||!b.kgPrincipal||!b.lpcm)return null;
  const esp=c=>{const m=st.reg.m3[c];return m==null?null:pp.dosis*(1000/b.kgPrincipal)*m/100/b.lpcm};
  const es=b.cabezales.map(esp);if(es.some(v=>v==null))return null;
  return esp(cab)+(cm-es.reduce((a,v)=>a+v,0))/b.cabezales.length}
function litros(b,cab){const cm=cmCab(b,cab);return cm==null?null:cm*b.lpcm}
// Dosis real (g/hL) = litros gastados × concentración ÷ 10 ÷ m³ regados por ese cabezal
function dosisReal(b,x,cab){const L=litros(b,cab),m=st.reg.m3[cab];if(L==null||!m)return null;return L*conc(b,x)/10/m}
function estado(real,des){if(real==null||!des)return{c:'nd',t:'—'};const d=(real-des)/des;const a=Math.abs(d);
  return{c:a<=0.10?'ok':a<=0.20?'warn':'bad',t:(d>0?'+':d<0?'−':'')+fmt(Math.abs(d*100),0)+'%',d}}
function ceEstimada(cab){let s=0;for(const b of bidonesDe(cab))for(const x of b.productos)s+=(x.dosis||0)*(prod(x.p).ce||0);return s/0.9*10}
function reparto(cab){const bs=bidonesDe(cab).filter(b=>b.reparto);const v=bs.map(b=>{const f=factor(b);return f?1000/f:0});const t=v.reduce((a,c)=>a+c,0);return bs.map((b,i)=>({b,pct:t?v[i]*100/t:0}))}
function drenPct(s,bj){const min=st.reg.min[s.id],ml=st.reg.dren[bj.id];if(min==null||ml==null||!min||!bj.caudal)return null;return ml*100/(min*bj.caudal)}
function unidades(cab){let real=0,des=0,ok=true,any=false;for(const b of bidonesDe(cab))for(const x of b.productos){const u=prod(x.p).un;if(!u||!x.dosis)continue;any=true;des+=x.dosis*u;const r=dosisReal(b,x,cab);if(r==null)ok=false;else real+=r*u}return{real:ok&&any?real:null,des:any?des:null}}
function resumen(cab){let fuera=0,total=0;for(const b of bidonesDe(cab))for(const x of b.productos){if(!x.dosis)continue;const r=dosisReal(b,x,cab);if(r==null)continue;total++;if(Math.abs((r-x.dosis)/x.dosis)>0.10)fuera++}
  const ps=[];for(const s of cabById(cab).sectores)for(const bj of s.bandejas){const p=drenPct(s,bj);if(p!=null)ps.push(p)}
  return{m3:st.reg.m3[cab]??null,drenaje:ps.length?ps.reduce((a,c)=>a+c,0)/ps.length:null,fuera,total,dosis:dosisPrincipales(cab),kg:kgDia(cab),
    ceE:mediaSect(st.reg,cab,'ceE'),phE:mediaSect(st.reg,cab,'phE'),ceD:mediaSect(st.reg,cab,'ceD'),phD:mediaSect(st.reg,cab,'phD')}}

const porRiego=s=>{const m=st.reg.min[s.id],n=(st.reg.rie||{})[s.id];return m!=null&&n>0?m/n:null};
function valSect(r,s,k){const m=r[k]||{},v=s.bandejas.map(bj=>m[bj.id]).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:(m[s.id]??null)}
function mediaSect(r,cab,k){const v=cabById(cab).sectores.map(s=>valSect(r,s,k)).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}

function fincaAvisos(f){const out=[],cabs=f.cabezales||[];if(!cabs.length)return [['nd','Todavía sin cabezales ni datos']];
  if(st.hist===null||st.llen===null)return [['nd','Cargando avisos…']];
  const d=new Date();d.setDate(d.getDate()-1);const ayer=isoD(d),ra=(st.hist||[]).find(r=>r.fecha===ayer);
  if(!ra||!cabs.some(c=>ra.m3&&ra.m3[c]!=null))out.push(['bad','Faltan las cuentas de ayer']);
  const deps=st.cfg.bidones.filter(b=>b.cabezales.some(c=>cabs.includes(c))&&bajoUmbral(nivel(b)));
  if(deps.length)out.push(['warn','Rellenar: '+deps.map(b=>b.nombre.replace(/^Depósito /,'')+' ('+b.cabezales.map(cabNombre).join(' y ')+')').join(', ')]);
  const mpf=(st.mat||[]).filter(m=>m.finca===f.id&&m.estado==='pedido').length;if(mpf)out.push(['warn',mpf===1?'1 pedido de material pendiente':mpf+' pedidos de material pendientes']);
  const ta=(st.tareas||[]).filter(t=>t.finca===f.id&&!t.hecha&&t.fecha<hoy()).length;if(ta)out.push(['bad',ta===1?'1 tarea atrasada':ta+' tareas atrasadas']);
  const pmi=pendParaMi().filter(m=>cabs.includes(m.cab)).length;if(pmi)out.push(['bad',pmi===1?'1 mensaje para ti':pmi+' mensajes para ti']);
  const pend=(st.msgs||[]).filter(m=>!m.resuelto&&cabs.includes(m.cab)).length;if(pend)out.push(['warn',pend===1?'1 mensaje pendiente':pend+' mensajes pendientes']);
  const ult=(st.hist||[]).find(r=>r.resumen&&cabs.some(c=>r.resumen[c]&&(r.resumen[c].ceD!=null||r.resumen[c].phD!=null)));
  if(ult){const a=st.cfg.alertas;for(const c of cabs){const z=ult.resumen[c];if(!z)continue;if(z.ceD!=null&&z.ceD>a.ceMax)out.push(['bad',`CE de drenaje alta en ${cabNombre(c)}: ${fmt(z.ceD,2)} mS`]);if(z.phD!=null&&(z.phD<a.phMin||z.phD>a.phMax))out.push(['bad',`pH de drenaje fuera de rango en ${cabNombre(c)}: ${fmt(z.phD,1)}`])}}
  const w=fwxDe(f);if(w&&w.daily){const sub={};for(const k in w.daily)sub[k]=w.daily[k].slice(0,2);for(const a of avisosWx(sub))out.push(a)}
  if(!out.length)out.push(['ok','Todo en orden']);return out}

/* Menús desplazables con ratón: rueda y arrastrar */
function scrollRaton(el){if(!el)return;
  el.addEventListener('wheel',e=>{if(el.scrollWidth<=el.clientWidth)return;if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){el.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
  let x0=null,l0=0,mov=false;
  el.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||el.scrollWidth<=el.clientWidth)return;x0=e.clientX;l0=el.scrollLeft;mov=false});
  window.addEventListener('pointermove',e=>{if(x0==null)return;const dx=e.clientX-x0;if(Math.abs(dx)>5){mov=true;el.classList.add('drag')}if(mov)el.scrollLeft=l0-dx});
  window.addEventListener('pointerup',()=>{if(x0==null)return;x0=null;el.classList.remove('drag');if(mov)setTimeout(()=>mov=false,0)});
  el.addEventListener('click',e=>{if(mov){e.stopPropagation();e.preventDefault()}},true)}

const ASSET_TYPES=['audio/webm','audio/mp4','audio/ogg','audio/mpeg','image/png','image/jpeg','image/gif','image/webp','video/mp4','video/webm','application/pdf','text/plain','text/csv'];
const EXT_TYPES={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',mp4:'video/mp4',webm:'video/webm',txt:'text/plain',csv:'text/csv'};
const fSize=b=>b<1048576?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(1).replace('.',',')+' MB';
const CLIP='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.5l-8.5 8.5a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7l-9 9a2 2 0 0 1-2.8-2.8l8.3-8.3"/></svg>';
async function compressImg(file){const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
  const M=1600,s=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(img.src);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('img')),'image/jpeg',0.8))}
const Adj={assets:null,downloads:null,idb:null,urls:{},
  async init(){if(Store.mode!=='db')return;try{this.assets=await window.claude.use('assets')}catch(e){}try{this.downloads=await window.claude.use('downloads')}catch(e){}},
  can(){return Store.mode==='db'?!!this.assets:typeof indexedDB!=='undefined'},
  async open_(){if(this.idb)return this.idb;this.idb=await new Promise((res,rej)=>{const r=indexedDB.open('abonado',1);r.onupgradeneeded=()=>r.result.createObjectStore('adjuntos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return this.idb},
  async tx(mode,fn){const d=await this.open_();return new Promise((res,rej)=>{const t=d.transaction('adjuntos',mode);const q=fn(t.objectStore('adjuntos'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
  idbPut(id,b){return this.tx('readwrite',s=>s.put(b,id))},idbGet(id){return this.tx('readonly',s=>s.get(id))},idbDel(id){return this.tx('readwrite',s=>s.delete(id))},
  async put(file){let blob=file,type=file.type||'',name=file.name||'archivo';const ext=(name.split('.').pop()||'').toLowerCase();if(!type&&EXT_TYPES[ext])type=EXT_TYPES[ext];
    if(/^image\/(jpeg|png|webp|heic|heif)$/.test(type)||/^(heic|heif)$/.test(ext)){try{blob=await compressImg(file);type='image/jpeg';name=name.replace(/\.[^.]+$/,'')+'.jpg'}catch(e){}}
    const img=type.startsWith('image/');
    if(Store.mode==='db'){if(!ASSET_TYPES.includes(type))throw{code:'tipo'};if(blob.size>20*1048576)throw{code:'too_large'};
      const r=await this.assets.upload(blob,{type});this.urls[r.id]=r.url;return{id:r.id,name,type,size:r.sizeBytes,img}}
    if(Store.mode==='fb'){if(blob.size>8*1048576)throw{code:'too_large'};const id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);await this.idbPut(id,blob).catch(()=>{});await NUBE.putBlob(id,blob,type);return{id,name,type,size:blob.size,img,fb:true}}
    if(blob.size>25*1048576)throw{code:'too_large'};
    const id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);await this.idbPut(id,blob);return{id,name,type,size:blob.size,img,local:true}},
  src(a){return a.local||a.fb?(this.urls[a.id]||''):(this.urls[a.id]||'/_blob/'+a.id)},
  async url(a){if(this.urls[a.id])return this.urls[a.id];if(!a.local&&!a.fb)return '/_blob/'+a.id;let b=await this.idbGet(a.id).catch(()=>null);if(!b&&window.NUBE&&NUBE.db){b=await NUBE.getBlob(a.id).catch(()=>null);if(b)this.idbPut(a.id,b).catch(()=>{})}if(!b)return null;return this.urls[a.id]=URL.createObjectURL(b)},
  async save(a){if(a.local||a.fb){const u=await this.url(a);if(!u){toast('Archivo no encontrado en este dispositivo');return}const l=document.createElement('a');l.href=u;l.download=a.name;document.body.appendChild(l);l.click();l.remove();return}
    if(!this.downloads){toast('Descarga no disponible aquí');return}
    try{const r=await fetch(this.src(a));const b=await r.blob();await this.downloads.save({filename:a.name,data:b})}catch(e){if(!e||e.code!=='declined')toast('No se pudo descargar')}},
  async del(a){try{if(a.local)await this.idbDel(a.id);else if(a.fb){await this.idbDel(a.id).catch(()=>{});await NUBE.delBlob(a.id)}else if(this.assets)await this.assets.delete(a.id)}catch(e){}}
};

const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let opsLoading=false;

/* Medida del depósito: «gaste» = cm que ha bajado desde lleno (regla desde arriba); «nivel» = cm de líquido desde el fondo.
   Por dentro todo se calcula en nivel (lo que queda). */
/* Cada depósito se apunta de una forma:
   diario  = se llena hasta arriba cada día después de medir; se apuntan los cm gastados y el llenado se deduce solo
   vacio   = se llena cuando hace falta; se apunta el vacío (cm desde arriba); si el vacío baja, se deduce que se llenó
   manual  = como antes: solo cuentan los llenados que se apuntan a mano */
const MODOS={diario:['Se llena cada día','Se apuntan los cm gastados; al apuntarlos se entiende que después se llenó hasta arriba'],vacio:['Se llena cuando hace falta','Se apunta el vacío del depósito (cm desde arriba); si baja, se entiende que se llenó'],manual:['Solo llenados apuntados','Los cm gastados no llenan el depósito; hay que apuntar cada llenado']};
const modoDep=b=>b&&MODOS[b.modo]?b.modo:(st.cfg.medida==='gaste'||st.cfg.medida==='nivel'?'vacio':'manual');
const esDirecto=b=>modoDep(b)!=='vacio';
const esGaste=b=>modoDep(b)==='vacio';
const maxCm=b=>b.capacidad/b.lpcm;
const aNivel=(b,raw)=>raw==null?null:maxCm(b)-raw;
const aLectura=(b,lv)=>lv==null?null:+(maxCm(b)-lv).toFixed(1);
const txtMed=()=>'Vacío';
const prevD=f=>{const d=new Date(f+'T12:00:00');d.setDate(d.getDate()-1);return isoD(d)};
/* Llenados: los apuntados y, en los depósitos «diario», los deducidos de los cm gastados (al día siguiente, antes de regar) */
function llenadosDe(b){const ex=(st.llen||[]).filter(e=>e.bidon===b.id);if(modoDep(b)!=='diario')return ex;const dias=new Set();
  for(const r of st.hist||[])if(r.fecha!==st.fecha&&(r.cm||{})[b.id]>0)dias.add(r.fecha);if(st.reg&&st.reg.cm&&st.reg.cm[b.id]>0)dias.add(st.fecha);
  const imp=[];for(const L of dias){const F=sigD(L);if(ex.some(e=>e.tipo==='llenado'&&e.fecha===F))continue;imp.push({id:'imp_'+L,fecha:F,hora:'00:00',ts:F+'T00:00:00.000Z',bidon:b.id,tipo:'llenado',cmFinal:maxCm(b),cmAdd:(st.fecha===L?st.reg.cm[b.id]:cmDe(b,L)),auto:true,de:L})}
  return [...ex,...imp]}
function lecturaAnt(b,conHoy){if(esDirecto(b))return null;if(conHoy&&st.reg.niv&&st.reg.niv[b.id]!=null)return{fecha:st.fecha,raw:st.reg.niv[b.id],v:aNivel(b,st.reg.niv[b.id])};let best=null;
  for(const r of st.hist||[]){if(r.fecha>=st.fecha)continue;const v=(r.niv||{})[b.id];if(v!=null&&(!best||r.fecha>best.fecha))best={fecha:r.fecha,raw:v,v:aNivel(b,v)}}return best}
/* Gasto diario: el que pongas a mano o, si no, la media real de los últimos 7 días con dato */
/* Gasto diario del depósito: 1) el que pongas a mano; 2) la media real de los últimos 7 días con dato; 3) el teórico según la receta y los m³ medios de cada cabezal */
function m3Medio(cab){const vs=(st.hist||[]).map(r=>(r.m3||{})[cab]).filter(v=>v!=null&&v>0).slice(0,7);return vs.length?vs.reduce((a,c)=>a+c,0)/vs.length:(cabById(cab).ejM3||null)}
function gastoTeorico(b){const pp=b.productos.find(x=>x.p===b.principal);if(!pp||!pp.dosis||!b.kgPrincipal||!b.lpcm)return null;let t=0;
  for(const c of b.cabezales){const m=m3Medio(c);if(m==null)return null;t+=pp.dosis*(1000/b.kgPrincipal)*m/100/b.lpcm}return t>0?t:null}
function gastoDia(b){const vs=(st.hist||[]).map(r=>(r.cm||{})[b.id]).filter(v=>v!=null&&v>=0).slice(0,7),med=vs.length?vs.reduce((a,c)=>a+c,0)/vs.length:null,man=b.consumoDia>0?b.consumoDia:null,teo=gastoTeorico(b);return{man,med,teo,v:man??med??teo}}
/* Parte del gasto de un día ya hecha: hoy va de 0 a 1 durante el horario de riego; los días pasados cuentan enteros */
const minDe=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?+m[1]*60+ +m[2]:null};
function fracDia(f){const h=hoy();if(f<h)return 1;if(f>h)return 0;const r=st.cfg.riego||{},a=minDe(r.ini)??510,b=minDe(r.fin)??1110,d=new Date(),m=d.getHours()*60+d.getMinutes();
  if(b<=a)return 1;return Math.max(0,Math.min(1,(m-a)/(b-a)))}
const hhmm=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const horaAhora=()=>hhmm(Date.now());
/* Orden real de llenados y medidas: fecha y hora del llenado (si no la hay, la hora en que se apuntó) */
const llKey=e=>e.fecha+'T'+(e.hora||hhmm(e.ts))+'|'+e.ts;
/* Parte del gasto del día que ocurre después de una hora concreta, según el horario de riego */
function fracTras(h){const r=st.cfg.riego||{},a=minDe(r.ini)??510,z=minDe(r.fin)??1110,m=minDe(h);if(m==null||z<=a)return 1;if(m<=a)return 1;if(m>=z)return 0;return (z-m)/(z-a)}
const sigD=f=>{const d=new Date(f+'T12:00:00');d.setDate(d.getDate()+1);return isoD(d)};
function cmDe(b,f){if(f===st.fecha){const v=st.reg.cm[b.id];return v??null}const r=(st.hist||[]).find(x=>x.fecha===f);const v=r&&(r.cm||{})[b.id];return v??null}
/* Nivel: parte de la última medida o llenado y resta lo gastado cada día; los días sin dato resta el gasto diario estimado */
function nivel(b){let ev=null;for(const e of llenadosDe(b))if(e.fecha<=st.fecha&&(!ev||llKey(e)>llKey(ev)))ev=e;const lec=lecturaAnt(b,true);if(!ev&&!lec)return null;
  const g=gastoDia(b);let rest,est=0,n=0;
  if(lec&&(!ev||lec.fecha>ev.fecha)){rest=lec.v;
    for(let d=sigD(lec.fecha);d<=st.fecha&&n<180;d=sigD(d),n++){const c=cmDe(b,d);if(c!=null)rest-=c;else if(g.v>0){const fr=fracDia(d);rest-=g.v*fr;if(fr>0)est++}}
    for(const e of st.llen||[])if(e.bidon===b.id&&e.tipo==='llenado'&&e.fecha>lec.fecha&&e.fecha<=st.fecha)rest+=e.cmAdd||0}
  else{rest=ev.cmFinal;const tras=(lec&&lec.fecha===ev.fecha)||esDirecto(b);for(let d=ev.fecha;d<=st.fecha&&n<180;d=sigD(d),n++){if(d===ev.fecha&&ev.hora&&esDirecto(b)){const fa=fracTras(ev.hora);if(fa>0){const c=cmDe(b,d);if(c!=null)rest-=c*fa;else if(g.v>0){const fr=Math.max(0,fracDia(d)-(1-fa));rest-=g.v*fr;if(fr>0)est++}}continue}if(tras&&d===ev.fecha)continue;const c=cmDe(b,d);if(c!=null)rest-=c;else if(d>ev.fecha&&g.v>0){const fr=fracDia(d);rest-=g.v*fr;if(fr>0)est++}}}
  return{rest,dias:g.v>0?Math.max(0,rest)/g.v:null,ev,max:b.capacidad/b.lpcm,est,g}}
/* Almacén: cuando el llenado se deduce de las cuentas, se descuenta solo (un movimiento por producto, con id fijo para no duplicar) */
async function autoAlmacen(b,L){const mods=[],borrar=[];const alm=almDeCab(b.cabezales[0]),ya=(st.alm||[]).filter(m=>m.auto&&m.origen===b.id&&m.autoDe===L);
  let cm=null,F=null;
  if(modoDep(b)==='diario'){cm=st.reg.cm[b.id];F=sigD(L);if((st.llen||[]).some(e=>e.bidon===b.id&&e.tipo==='llenado'&&e.fecha===F))cm=null}

function drenDia(r,cab){const z=r.resumen&&r.resumen[cab];if(z&&z.drenaje!=null)return z.drenaje;const ps=[];for(const s of cabById(cab).sectores)for(const bj of s.bandejas){const min=(r.min||{})[s.id],ml=(r.dren||{})[bj.id];if(min&&ml!=null&&bj.caudal)ps.push(ml*100/(min*bj.caudal))}return ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null}

function informeData(mes){const regs=(st.hist||[]).filter(r=>r.fecha.slice(0,7)===mes).sort((a,b)=>a.fecha<b.fecha?-1:1);

  const cabs=cabsVis().map(c=>{const rs=regs.filter(r=>r.m3&&r.m3[c.id]!=null),kg={},dr=[],ce=[],cd=[],ph=[];let m3=0;
    for(const r of rs){m3+=r.m3[c.id]||0;const k=kgCab(r,c.id);for(const p in k)kg[p]=(kg[p]||0)+k[p];const d=drenDia(r,c.id);if(d!=null)dr.push(d);
      for(const[arr,key]of[[ce,'ceE'],[cd,'ceD'],[ph,'phD']]){const v=mediaSect(r,c.id,key);if(v!=null)arr.push(v)}}
    return{c,dias:rs.length,m3,kg,dren:av(dr),ceE:av(ce),ceD:av(cd),phD:av(ph)}});
  const alm=(st.alm||[]).filter(m=>(m.fecha||'').slice(0,7)===mes),ent={},sal={};for(const m of alm){if(m.tipo==='entrada')ent[m.p]=(ent[m.p]||0)+m.qty;else if(m.tipo==='salida')sal[m.p]=(sal[m.p]||0)-m.qty}
  const tot={};for(const x of cabs)for(const p in x.kg)tot[p]=(tot[p]||0)+x.kg[p];

function edBorrar(k){const cfg=st.cfg,[t,id,extra]=k.split(':');

  else if(t==='cab'){if(cfg.cabezales.length<2)return toast('Tiene que quedar al menos un cabezal');cfg.cabezales=cfg.cabezales.filter(c=>c.id!==id);for(const f of cfg.fincas)f.cabezales=f.cabezales.filter(x=>x!==id);
    for(const a of almacenes())a.cabezales=a.cabezales.filter(x=>x!==id);for(const b of cfg.bidones)b.cabezales=b.cabezales.filter(x=>x!==id);cfg.bidones=cfg.bidones.filter(b=>b.cabezales.length);if(cfg.cultivo)delete cfg.cultivo[id];edArreglarCab()}
  else if(t==='sec'){for(const c of cfg.cabezales)c.sectores=c.sectores.filter(s=>s.id!==id)}
  else if(t==='bj'){for(const c of cfg.cabezales)for(const s of c.sectores)s.bandejas=s.bandejas.filter(b=>b.id!==id)}
  else if(t==='dep'){const b=bid(id);if(b){b.cabezales=b.cabezales.filter(x=>x!==extra);if(!b.cabezales.length)cfg.bidones=cfg.bidones.filter(x=>x.id!==id)}}
  else if(t==='alm'){cfg.almacenes=almacenes().filter(a=>a.id!==id||a.cabezales.length)}
  else if(t==='prod'){if(!PRODUCTOS[id])delete cfg.productos[id]}
  st.edConf=null;edMarca();renderAll()}

function onEdInput(e){const t=e.target,k=t.dataset&&t.dataset.edv;if(!k)return;const id=t.dataset.id,cfg=st.cfg,v=t.type==='checkbox'?t.checked:t.value,txt=String(v).trim(),n=num(String(v));
  const cab=cabById(id),dep=bid(id),f=cfg.fincas.find(x=>x.id===id);let rerender=false;
  if(k==='finca.nombre'){if(!txt)return;f.nombre=txt}
  else if(k==='cab.nombre'){if(!txt)return;cab.nombre=txt}
  else if(k==='cab.finca'){if(e.type!=='change')return;for(const x of cfg.fincas)x.cabezales=x.cabezales.filter(c=>c!==id);cfg.fincas.find(x=>x.id===v).cabezales.push(id);rerender=true}
  else if(k==='cab.alm'){if(e.type!=='change')return;for(const a of almacenes())a.cabezales=a.cabezales.filter(c=>c!==id);almacenes().find(a=>a.id===v).cabezales.push(id);if(!cfg.almacenes)cfg.almacenes=almacenes();rerender=true}
  else if(k==='sec.nombre'){if(!txt)return;for(const c of cfg.cabezales)for(const s of c.sectores)if(s.id===id)s.nombre=txt}
  else if(k==='bj.nombre'||k==='bj.caudal'){for(const c of cfg.cabezales)for(const s of c.sectores)for(const b of s.bandejas)if(b.id===id){if(k==='bj.nombre'){if(!txt)return;b.nombre=txt}else{if(!(n>0))return;b.caudal=n}}}
  else if(k==='dep.nombre'){if(!txt)return;dep.nombre=txt}
  else if(k==='dep.cap'){if(!(n>0))return;dep.capacidad=n}
  else if(k==='dep.lpcm'){if(!(n>0))return;dep.lpcm=n}
  else if(k==='dep.principal'){if(e.type!=='change')return;dep.principal=v}
  else if(k==='dep.addprod'){if(e.type!=='change'||!v)return;dep.productos.push({p:v,dosis:0});rerender=true}
  else if(k==='dep.comp'){if(e.type!=='change')return;const c=t.dataset.c;dep.cabezales=t.checked?[...new Set([...dep.cabezales,c])]:dep.cabezales.filter(x=>x!==c);if(!dep.cabezales.length)dep.cabezales=[c];rerender=true}
  else if(k==='alm.nombre'){if(!txt)return;almacenes().find(a=>a.id===id).nombre=txt;if(!cfg.almacenes)cfg.almacenes=almacenes()}
  else if(k.startsWith('prod.')){const p=cfg.productos[id];const q=k.slice(5);if(q==='n'){if(!txt)return;p.n=txt}else if(q==='liq'){if(e.type!=='change')return;p.liq=!!v}else p[q]=n??0}

function bandeja(id){for(const c of st.cfg.cabezales)for(const s of c.sectores)for(const b of s.bandejas)if(b.id===id)return b}
function applyCfg(p,v){const b=bid(p[2]);switch(p[1]){
  case 'kg':b.kgPrincipal=v;break;case 'dosis':b.productos[+p[3]].dosis=v??0;break;case 'lpcm':if(v)b.lpcm=v;break;
  case 'cap':if(v)b.capacidad=v;break;case 'vent':b.venturis=v?Math.max(1,Math.round(v)):1;break;case 'rep':b.reparto=!!v;break;
  case 'al':if(v!=null)st.cfg.alertas[p[2]]=v;break;case 'ub':st.cfg.ubic={...(st.cfg.ubic||{}),[p[2]]:v};st.wx=null;break;case 'min':if(v==null)delete st.cfg.stockMin[p[2]];else st.cfg.stockMin[p[2]]=v;break;case 'saco':if(!(v>0))delete st.cfg.saco[p[2]];else st.cfg.saco[p[2]]=v;break;
  case 'bname':b.nombre=v||b.nombre;break;case 'ia':{const u=(v||'').trim();if(!u)delete st.cfg.iaUrl;else if(/^https:\/\/\S+$/.test(u))st.cfg.iaUrl=u;break}case 'avisos':{const u=(v||'').trim().replace(/\/+$/,'');if(!u)delete st.cfg.avisosUrl;else if(/^https:\/\/\S+$/.test(u))st.cfg.avisosUrl=u;break}case 'medida':if(v==='gaste'||v==='nivel'||v==='cm'){st.cfg.medida=v;st.cfg.medidaV=2}break;case 'modo':if(MODOS[v])b.modo=v;break;case 'cons':if(v>0)b.consumoDia=v;else delete b.consumoDia;break;case 'riego':if(/^\d{1,2}:\d{2}$/.test(v||''))st.cfg.riego={...(st.cfg.riego||{}),[p[2]]:v};break;case 'caudal':{const bj=bandeja(p[2]);if(bj&&v)bj.caudal=v;break}}}

  if(p[0]==='reg'){if(!st.reg[p[1]])st.reg[p[1]]={};st.reg[p[1]][p[2]]=v;marcaReg(p[1]+'.'+p[2]);if(p[1]==='niv')autoCm(p[2])}else if(p[0]==='fill'){st.fill[p[1]]=v}else if(p[0]==='cfg'){applyCfg(p,v);st.dirtyCfg=true}

function diffCfg(a,b){const L=[];for(const nb of b.bidones){const ob=a.bidones.find(x=>x.id===nb.id);if(!ob)continue;const cabs=nb.cabezales.map(x=>(b.cabezales.find(c=>c.id===x)||{}).nombre).join(' + ');
  if(ob.kgPrincipal!==nb.kgPrincipal)L.push(`${cabs} · ${nb.nombre}: ${prod(nb.principal).n} por 1000 L ${fmt(ob.kgPrincipal,2)} → ${fmt(nb.kgPrincipal,2)}`);
  nb.productos.forEach((x,i)=>{const o=ob.productos[i];if(o&&o.dosis!==x.dosis)L.push(`${cabs} · ${prod(x.p).n}: ${fmt(o.dosis,2)} → ${fmt(x.dosis,2)} ${uDosis(x.p)}`)})}
  const nom=(l,id)=>(l.find(x=>x.id===id)||{}).nombre;
  for(const[k,t,o]of[['fincas','Finca','a'],['cabezales','Cabezal','o'],['bidones','Depósito','o']]){const ia=new Set(a[k].map(x=>x.id)),ib=new Set(b[k].map(x=>x.id));
    for(const x of b[k])if(!ia.has(x.id))L.push(`${t} nuev${o}: ${x.nombre}`);for(const x of a[k])if(!ib.has(x.id))L.push(`${t} quitad${o}: ${x.nombre}`);
    for(const x of b[k])if(ia.has(x.id)&&nom(a[k],x.id)!==x.nombre)L.push(`${t} renombrad${o}: ${nom(a[k],x.id)} → ${x.nombre}`)}
  const sa=a.cabezales.flatMap(c=>c.sectores.map(s=>[c,s])),sb=b.cabezales.flatMap(c=>c.sectores.map(s=>[c,s]));
  for(const[c,s]of sb)if(!sa.some(x=>x[1].id===s.id))L.push(`${c.nombre}: sector nuevo ${s.nombre}`);for(const[c,s]of sa)if(!sb.some(x=>x[1].id===s.id)&&b.cabezales.some(x=>x.id===c.id))L.push(`${c.nombre}: sector quitado ${s.nombre}`);
  return L}

function cabsDeCampo(k){const[g,id]=k.split('.');if(['m3','ceB','ceR','inc','phS'].includes(g))return [id];if(g==='cm'||g==='niv'){const b=bid(id);return b?b.cabezales:[]}

async function saveReg(){if(st.saving)return;st.saving=true;renderSave();try{const f=st.fecha,mods=[...st.regMod],ahora=new Date().toISOString();
  let srv=null;try{srv=await Store.getReg(f)}catch(e){}
  const base=normReg(srv||st.reg||{},f);const rb=(srv||st.reg||{}).receta;if(rb)base.receta=rb;
  for(const k of mods){const[g,id]=k.split('.');base[g]={...(base[g]||{})};base[g][id]=(st.reg[g]||{})[id]??null}
  const sug=st.reg.sug;st.reg={...base,sug};
  const parcial={fecha:f,guardado:ahora};for(const k of mods){const[g,id]=k.split('.');parcial[g]={...(parcial[g]||{}),[id]:base[g][id]}}
  const afect=new Set(mods.flatMap(cabsDeCampo));for(const b of st.cfg.bidones)if(b.cabezales.some(c=>afect.has(c)))b.cabezales.forEach(c=>afect.add(c));
  parcial.resumen={};for(const c of st.cfg.cabezales)if(afect.has(c.id)||!srv)parcial.resumen[c.id]=resumen(c.id);
  if(f>=hoy()||(!base.receta&&f>=isoD(new Date(Date.now()-86400000))))parcial.receta=fotoReceta();
  st.reg.receta=parcial.receta||base.receta;st.reg.guardado=ahora;
  await Store.mergeReg(f,parcial);const tocados=new Set(mods.filter(k=>/^(cm|niv)\./.test(k)).map(k=>k.split('.')[1]));st.regMod=new Set();
  for(const id of tocados){const b=bid(id);if(b&&modoDep(b)!=='manual')autoAlmacen(b,f).catch(e=>console.warn(e))}st.reg.ejemplo=false;st.dirtyReg=false;enviarPartes();st.hist=null;loadHist();toast('Día '+fCorta(st.fecha)+' guardado');if(st.tab!=='historial')softUpdate();else renderMain()}catch(e){toast(errMsg(e))}
  st.saving=false;renderSave();if(st.tab==='cuentas'||st.tab==='drenaje'){const bn=$('.banner');if(bn&&!st.reg.ejemplo)bn.remove()}}
async function saveCfg(){if(st.saving)return;if(!esGestor()){const n=clone(st.savedCfg);for(const b of n.bidones){const x=bid(b.id);if(!x)continue;b.kgPrincipal=x.kgPrincipal;b.productos.forEach((p,i)=>{const q=x.productos.find(y=>y.p===p.p);if(q)p.dosis=q.dosis})}st.cfg=n}st.saving=true;renderSave();try{const lineas=diffCfg(st.savedCfg,st.cfg);await Store.setConfig(st.cfg);
  if(lineas.length)await Store.addCambio({ts:new Date().toISOString(),fecha:hoy(),lineas,por:yoNombre(),porEmail:miEmail()});st.savedCfg=clone(st.cfg);st.dirtyCfg=false;st.cambios=null;st.hist=null;loadHist();toast(lineas.length?'Receta guardada y anotada en el historial':'Ajustes guardados')}catch(e){toast(errMsg(e))}
  st.saving=false;renderSave()}

/* ---------- Collas: asistencia por persona y rendimiento de las labores en las matas ---------- */
/* Cada colla tiene un jefe (usuario de la app) y su gente (solo el nombre, no necesitan la app).
   El jefe apunta cada día quién ha venido, a qué hora entra y sale, y qué trabajos se han hecho:
   labor, cabezal, nave y pasillos, matas / kilos / cajas. El gestor (encargado o administrador) lo ve todo. */
const LABORES=[['destallar','Destallar / deshojar'],['hoja','Quitar hoja'],['entutorar','Entutorar / liar / bajar planta'],['recolectar','Recolectar'],['otras','Plantar / limpiar / otras']];
const LAB=Object.fromEntries(LABORES);
const COEST={pre:['ok','Presente'],fal:['bad','Falta'],jus:['warn','Falta justificada'],baja:['nd','Baja'],vac:['nd','Vacaciones / libre']};
const CO_UD={matas:'matas',kg:'kg',cajas:'cajas'};
const udsLabor=l=>l==='recolectar'?['kg','cajas']:['matas'];
st.collas=null;st.jor={};st.jorDias=0;st.co={vista:null,colla:null,fecha:hoy(),ed:null,dirty:false,per:'30',fil:'',lab:null,ge:null,confirm:null,nuevo:''};
const coId=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const hm=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?+m[1]*60+ +m[2]:null};
function horasP(j,pid){const g=(j.gente||{})[pid];if(!g||g.e!=='pre')return 0;const a=hm(g.ent),b=hm(g.sal);if(a==null||b==null)return 0;let d=b-a;if(d<0)d+=1440;return Math.max(0,(d-(+j.pau||0))/60)}
const presentes=j=>Object.keys(j.gente||{}).filter(p=>j.gente[p].e==='pre');
const enTrabajo=(j,t)=>presentes(j).filter(p=>!(t.fuera||[]).includes(p));
/* Horas de una persona en un trabajo: las que ponga el jefe o, si lo deja en blanco, lo que le quede de la jornada repartido */
function horasEn(j,t,pid){if(t.h!=null)return t.h;const ts=(j.trabajos||[]).filter(x=>enTrabajo(j,x).includes(pid));const fijas=ts.filter(x=>x.h!=null).reduce((s,x)=>s+x.h,0),libres=ts.filter(x=>x.h==null).length;return libres?Math.max(0,horasP(j,pid)-fijas)/libres:0}
const horasTrab=(j,t)=>enTrabajo(j,t).reduce((s,p)=>s+horasEn(j,t,p),0);
const cantT=(t,u)=>{if(t.pp&&t.ud===u){const v=Object.values(t.qp||{}).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0):null}return t[u]??null};
const misCollas=()=>(st.collas||[]).filter(c=>c.activa!==false&&miEmail()&&c.jefeEmail===miEmail());
const collasVis=()=>(st.collas||[]).filter(c=>c.activa!==false&&(esGestor()||(miEmail()&&c.jefeEmail===miEmail())));
const puedeCollas=()=>esGestor()||misCollas().length>0;
const collaDe=id=>(st.collas||[]).find(c=>c.id===id);
const jorKey=(c,f)=>c+'_'+f;
const nomP=(j,pid)=>((j.gente||{})[pid]||{}).n||(((collaDe(j.colla)||{}).miembros||[]).find(m=>m.id===pid)||{}).n||'¿?';

let coLoading=false;
async function loadCollas(){if(coLoading)return;coLoading=true;try{st.collas=await Store.listCol('collas',0)}catch(e){st.collas=st.collas||[]}coLoading=false;
  if(!esGestor()&&misCollas().length&&st.jorDias<2)loadJor(2);try{renderTabs()}catch(e){}if(st.tab==='collas')renderMain()}
let jorLoading=false;
/* El gestor descarga todas (con caché y solo lo cambiado). El jefe pide uno a uno los días de sus collas: las reglas no le dejan ver las demás */
async function loadJor(dias){if(jorLoading)return;jorLoading=true;dias=dias||(esGestor()?0:35);
  try{if(esGestor()||Store.mode!=='fb'){const l=await Store.listCol('jornadas',0);st.jor=Object.fromEntries(l.map(j=>[j.id,j]));st.jorDias=9999}
    else{const fs=[];for(let i=0;i<dias;i++){const d=new Date();d.setDate(d.getDate()-i);fs.push(isoD(d))}
      const vistos=st.jorVistos||(st.jorVistos=new Set()),ids=misCollas().flatMap(c=>fs.filter((f,i)=>i<2||!vistos.has(c.id+'_'+f)).map(f=>jorKey(c.id,f)));
      const r=await Promise.all(ids.map(id=>Store.db.doc('jornadas/'+id).get().then(s=>[id,s.exists?{...s.data(),id}:null]).catch(()=>[id,undefined])));
      for(const[id,d]of r){if(d===undefined)continue;vistos.add(id);if(d&&!d.borrado)st.jor[id]=d;else delete st.jor[id]}
      st.jorDias=Math.max(st.jorDias,dias)}}
  catch(e){console.warn(e)}jorLoading=false;try{renderGrupos()}catch(e){}if(st.tab==='collas')renderMain()}
const jornadas=()=>Object.values(st.jor).filter(j=>j&&!j.borrado);
/* Aviso al jefe: a partir de las 13:00, si no ha guardado el parte de hoy */
function coSinParte(){if(new Date().getHours()<13||!st.jorDias)return [];return misCollas().filter(c=>!st.jor[jorKey(c.id,hoy())])}

/* ---------- Borrador del parte de la colla ---------- */
function nuevaJor(c,f){const g={};for(const m of (c.miembros||[]).filter(m=>m.activo!==false))g[m.id]={n:m.n,e:'pre',ent:c.ent||'07:00',sal:c.sal||'14:30'};
  return{id:jorKey(c.id,f),colla:c.id,collaNombre:c.nombre,fecha:f,finca:c.finca||'',jefeEmail:c.jefeEmail||'',jefeNombre:c.jefeNombre||'',pau:c.pau??30,gente:g,trabajos:[],notas:''}}
const draftKey=k=>'abono.codraft.'+k;
function coAbrir(){const c=collaDe(st.co.colla);if(!c){st.co.ed=null;return}const k=jorKey(c.id,st.co.fecha);if(st.co.ed&&st.co.ed.id===k)return;
  const base=st.jor[k]?clone(st.jor[k]):nuevaJor(c,st.co.fecha),dr=Store.lsGet(draftKey(k));
  if(dr&&dr.ed&&(!st.jor[k]||(dr.base||'')===(st.jor[k].mod||''))){st.co.ed=dr.ed;st.co.dirty=true}else{st.co.ed=base;st.co.dirty=false}
  // gente nueva de la colla que aún no está en el parte
  if(!st.jor[k])for(const m of (c.miembros||[]).filter(m=>m.activo!==false))if(!st.co.ed.gente[m.id])st.co.ed.gente[m.id]={n:m.n,e:'pre',ent:c.ent||'07:00',sal:c.sal||'14:30'}}
function coSucio(){st.co.dirty=true;const e=st.co.ed;if(e)Store.lsSet(draftKey(e.id),{ed:e,base:(st.jor[e.id]||{}).mod||''})}
const puedeEditarDia=f=>{if(f>hoy())return false;if(esGestor())return true;const d=new Date();d.setDate(d.getDate()-7);return f>=isoD(d)};

/* ---------- Vistas ---------- */
function vCollas(){if(st.collas===null){loadCollas();return '<section class="card"><div class="note">Cargando collas…</div></section>'}
  const vis=collasVis(),ges=esGestor();
  if(!st.co.vista)st.co.vista=misCollas().length?'parte':ges?'rend':'parte';
  if(!vis.length&&st.co.vista!=='gestion'){if(ges)st.co.vista='gestion';else return '<section class="card"><div class="note">No eres jefe de ninguna colla. Si debes serlo, díselo al encargado.</div></section>'}
  const ops=[['parte','Parte del día'],['rend','Rendimiento y asistencia'],...(ges?[['gestion','Collas y gente']]:[])];
  let h=`<div class="pick">${ops.map(([k,t])=>`<button class="chip" data-co-v="${k}" aria-pressed="${st.co.vista===k}">${t}</button>`).join('')}</div>`;
  if(st.co.vista==='gestion')return h+coGestionHTML();
  const nd=esGestor()?1:st.co.vista==='rend'&&st.co.per==='ant'?62:35;if(st.jorDias<nd&&!jorLoading)loadJor(nd);
  if(st.co.vista==='rend')return h+coRendHTML();
  return h+coParteHTML()}

    <div class="field cofe"><label for="co_fecha">Día</label><div class="inp"><input type="date" id="co_fecha" data-co-f="fecha" value="${j.fecha}" max="${hoy()}"></div></div></div>

    ${edit?'':`<div class="banner">${j.fecha>hoy()?'No se puede apuntar un día que no ha llegado.':'Solo se pueden corregir los últimos 7 días. Para días anteriores, habla con el encargado.'}</div>`}

  // Asistencia

      <div class="field"><label for="co_sal">Salida</label><div class="inp"><input type="time" id="co_sal" data-co-f="hsal" value="${esc(c.sal||'14:30')}"></div></div>

      <button class="btn" data-act="co-todos">Todos presentes con este horario</button></div>`:''}
    <div class="coper-l">${ids.map(p=>{const g=j.gente[p],[k]=COEST[g.e]||COEST.pre;return `<div class="coper ${g.e}"><div class="nm"><b>${esc(g.n)}</b><small id="coh_${p}">${g.e==='pre'?fmt(horasP(j,p),2)+' h':''}</small></div>
      <div class="inp"><select data-co-p="${p}" data-c="e" aria-label="Estado de ${esc(g.n)}" ${edit?'':'disabled'}>${Object.entries(COEST).map(([e,[,t]])=>`<option value="${e}" ${g.e===e?'selected':''}>${t}</option>`).join('')}</select></div>
      ${g.e==='pre'?`<div class="hrs"><div class="inp"><input type="time" data-co-p="${p}" data-c="ent" aria-label="Entrada de ${esc(g.n)}" value="${esc(g.ent||'')}" ${edit?'':'disabled'}></div><span>a</span><div class="inp"><input type="time" data-co-p="${p}" data-c="sal" aria-label="Salida de ${esc(g.n)}" value="${esc(g.sal||'')}" ${edit?'':'disabled'}></div></div>`:''}</div>`}).join('')}</div>
    ${edit?`<div class="row coadd"><div class="inp"><input class="wide" id="co_nuevo" data-co-f="nuevo" placeholder="Nombre y apellido" style="text-transform:none" value="${esc(st.co.nuevo)}" autocomplete="off"></div><button class="btn" data-act="co-addp">+ Añadir persona a la colla</button></div>`:''}</section>`;
  // Trabajos
  h+=`<section class="card"><div class="sector-h"><div><h3>Trabajos</h3><div class="sub">Qué se ha hecho, dónde y cuánto. Si un trabajo no ocupa toda la jornada, pon las horas.</div></div></div>

    <div class="row"><button class="btn" data-act="co-mp-save">Guardar matas por pasillo</button></div></section>`;

/* ---------- Guardar ---------- */
async function coGuardar(){const j=st.co.ed;if(!j)return;if(!puedeEditarDia(j.fecha)){toast('Ese día ya no se puede cambiar');return}
  const c=collaDe(j.colla);if(!Object.keys(j.gente).length){toast('La colla no tiene gente');return}
  for(const p of presentes(j)){const g=j.gente[p];if(hm(g.ent)==null||hm(g.sal)==null){toast('Falta la hora de entrada o salida de '+g.n);return}}
  const ahora=new Date().toISOString(),ant=st.jor[j.id],doc={...clone(j),collaNombre:c?c.nombre:j.collaNombre,jefeEmail:c?c.jefeEmail:j.jefeEmail,jefeNombre:c?c.jefeNombre:j.jefeNombre,finca:c?c.finca||'':j.finca,
    ts:(ant&&ant.ts)||ahora,por:yoNombre(),porEmail:miEmail(),cambios:[...((ant&&ant.cambios)||[]),{ts:ahora,por:yoNombre()}].slice(-30)};
  delete doc.id;delete doc.mod;
  if(!esGestor()&&Store.mode==='fb'&&doc.jefeEmail!==miEmail()){toast('Solo el jefe de esta colla puede guardar su parte');return}
  try{await Store.setCol('jornadas',j.id,doc);st.jor[j.id]={...doc,id:j.id,mod:ahora};try{localStorage.removeItem(draftKey(j.id))}catch(e){}st.co.ed=null;st.co.dirty=false;renderGrupos();renderMain();toast('Parte de la colla guardado')}catch(e){toast(errMsg(e))}}
async function coGuardarColla(){const g=st.co.ge,nombre=(g.nombre||'').trim();if(!nombre){toast('Ponle un nombre a la colla');return}
  if((g.nuevo||'').trim())g.miembros.push({id:coId(),n:g.nuevo.trim(),activo:true,alta:hoy()});
  const jefe=personas().find(u=>u.email===g.jefeEmail),doc={nombre,jefeEmail:g.jefeEmail||'',jefeNombre:jefe?jefe.nombre.replace(/ \(yo\)$/,''):'',finca:g.finca||'',ent:g.ent||'07:00',sal:g.sal||'14:30',pau:num(g.pau)??30,
    miembros:g.miembros.filter(m=>m.n.trim()).map(m=>({...m,n:m.n.trim()})),activa:true,ts:g.ts||new Date().toISOString()};
  try{if(g.id){await Store.setCol('collas',g.id,doc);const i=st.collas.findIndex(c=>c.id===g.id);st.collas[i]={...doc,id:g.id}}else{const id=await Store.addCol('collas',doc);st.collas.unshift({...doc,id})}
    st.co.ge=null;st.co.confirm=null;renderTabs();renderMain();toast('Colla guardada')}catch(e){toast(errMsg(e))}}
async function coAddPersona(){const n=(st.co.nuevo||'').trim(),c=collaDe(st.co.colla);if(!n||!c){toast('Escribe el nombre');return}
  const m={id:coId(),n,activo:true,alta:hoy()},mi=[...(c.miembros||[]),m];
  try{await Store.updCol('collas',c.id,{miembros:mi});c.miembros=mi;st.co.ed.gente[m.id]={n,e:'pre',ent:c.ent||'07:00',sal:c.sal||'14:30'};st.co.nuevo='';coSucio();renderMain();toast(n+' añadido a la colla')}catch(e){toast(errMsg(e))}}
async function coGuardarMP(){const mp={};for(const i of document.querySelectorAll('[data-co-mp]')){const[k,n]=i.dataset.coMp.split('|'),v=num(i.value);if(v>0){mp[k]=mp[k]||{};mp[k][n]=v}}
  for(const c of [st.cfg,st.savedCfg])c.matasPas=mp;try{await Store.setConfig(st.savedCfg);toast('Matas por pasillo guardadas')}catch(e){toast(errMsg(e))}}
function coUltimo(){const j=st.co.ed;return jornadas().filter(x=>x.colla===j.colla&&x.fecha<j.fecha&&(x.trabajos||[]).length).sort((a,b)=>a.fecha<b.fecha?1:-1)[0]}

/* ---------- Eventos ---------- */
document.addEventListener('click',async e=>{if(st.tab!=='collas')return;const b=e.target.closest('button');if(!b)return;const d=b.dataset,j=st.co.ed;
  if(d.coV){st.co.vista=d.coV;st.co.confirm=null;renderMain();return}
  if(d.coColla){st.co.colla=d.coColla;st.co.ed=null;renderMain();return}
  if(d.coPer){st.co.per=d.coPer;renderMain();return}
  if(d.coFil!=null){st.co.fil=d.coFil;renderMain();return}
  if(d.coLab){st.co.lab=d.coLab;renderMain();return}
  if(d.coOpen){const x=st.jor[d.coOpen];if(x){st.co.vista='parte';st.co.colla=x.colla;st.co.fecha=x.fecha;st.co.ed=null;renderMain();window.scrollTo(0,0)}return}
  if(d.coEd){const c=collaDe(d.coEd);st.co.ge={...clone(c),miembros:clone(c.miembros||[]),nuevo:''};st.co.confirm=null;renderMain();window.scrollTo(0,0);return}
  if(d.coPas!=null&&j){const t=j.trabajos[+d.coPas],n=+d.n;t.pas=t.pas||[];t.pas=t.pas.includes(n)?t.pas.filter(x=>x!==n):[...t.pas,n].sort((a,b)=>a-b);if(t.mAuto&&!t.pas.length){t.matas=null}coAutoMatas(t);coSucio();renderMain();return}
  if(d.coQ!=null&&j){const t=j.trabajos[+d.coQ],p=d.p;t.fuera=t.fuera||[];t.fuera=t.fuera.includes(p)?t.fuera.filter(x=>x!==p):[...t.fuera,p];coSucio();renderMain();return}
  const a=d.act;if(!a||!a.startsWith('co-'))return;
  if(a==='co-todos'&&j){const c=collaDe(j.colla),ent=($('#co_ent')||{}).value||c.ent,sal=($('#co_sal')||{}).value||c.sal;for(const p in j.gente)Object.assign(j.gente[p],{e:'pre',ent,sal});coSucio();renderMain()}
  else if(a==='co-addp')coAddPersona();
  else if(a==='co-addt'&&j){const u=j.trabajos[j.trabajos.length-1];j.trabajos.push({id:coId(),labor:u?u.labor:'destallar',cab:u?u.cab:(collaDe(j.colla)&&collaDe(j.colla).finca?(((st.cfg.fincas||[]).find(f=>f.id===collaDe(j.colla).finca)||{}).cabezales||[])[0]||'':''),nave:null,pas:[],matas:null,kg:null,cajas:null,h:null,fuera:[],pp:false,ud:'matas',qp:{}});coSucio();renderMain()}
  else if(a==='co-copiar'&&j){const u=coUltimo();if(!u){toast('No hay partes anteriores con trabajos');return}j.trabajos=u.trabajos.map(t=>({id:coId(),labor:t.labor,txt:t.txt||'',cab:t.cab||'',nave:t.nave??null,pas:[],matas:null,kg:null,cajas:null,h:t.h??null,fuera:[],pp:!!t.pp,ud:t.ud||'matas',qp:{}}));coSucio();renderMain();toast('Copiados los trabajos del '+fFecha(u.fecha)+': pon las cantidades de hoy')}
  else if(a==='co-delt'&&j){j.trabajos.splice(+d.i,1);coSucio();renderMain()}
  else if(a==='co-save')coGuardar();
  else if(a==='co-descartar'&&j){try{localStorage.removeItem(draftKey(j.id))}catch(_){}st.co.ed=null;st.co.dirty=false;renderMain()}
  else if(a==='co-del'){st.co.confirm='del';renderMain()}
  else if(a==='co-no'){st.co.confirm=null;renderMain()}
  else if(a==='co-del-yes'&&j){try{await Store.delCol('jornadas',j.id);delete st.jor[j.id];try{localStorage.removeItem(draftKey(j.id))}catch(_){}st.co.ed=null;st.co.dirty=false;st.co.confirm=null;renderMain();toast('Parte borrado')}catch(err){toast(errMsg(err))}}
  else if(a==='co-xlsx')coXlsx();
  else if(a==='co-nueva'){st.co.ge={id:null,nombre:'',jefeEmail:'',finca:fincaAct()?fincaAct().id:'',ent:'07:00',sal:'14:30',pau:30,miembros:[],nuevo:''};renderMain()}
  else if(a==='co-ge-no'){st.co.ge=null;st.co.confirm=null;renderMain()}
  else if(a==='co-gm-add'){const g=st.co.ge,n=(g.nuevo||'').trim();if(!n){toast('Escribe el nombre');return}g.miembros.push({id:coId(),n,activo:true,alta:hoy()});g.nuevo='';renderMain();const i=$('#ge_nuevo');if(i)i.focus()}
  else if(a==='co-gm-baja'){const m=st.co.ge.miembros[+d.i];m.activo=false;m.baja=hoy();renderMain()}
  else if(a==='co-gm-alta'){const m=st.co.ge.miembros[+d.i];m.activo=true;delete m.baja;renderMain()}
  else if(a==='co-ge-save')coGuardarColla();
  else if(a==='co-ge-arch'){st.co.confirm='arch';renderMain()}
  else if(a==='co-ge-arch-yes'){const g=st.co.ge;try{await Store.updCol('collas',g.id,{activa:false});const c=collaDe(g.id);if(c)c.activa=false;st.co.ge=null;st.co.confirm=null;renderTabs();renderMain();toast('Colla quitada')}catch(err){toast(errMsg(err))}}
  else if(a==='co-mp-save')coGuardarMP()});
function onCoInput(e){if(st.tab!=='collas')return;const t=e.target,d=t.dataset,j=st.co.ed,ch=e.type==='change';
  if(d.coF){const k=d.coF;if(k==='fecha'){if(!ch||!t.value)return;st.co.fecha=t.value>hoy()?hoy():t.value;st.co.ed=null;renderMain();return}
    if(k==='nuevo'){st.co.nuevo=t.value;return}if(!j)return;
    if(k==='pau'){j.pau=num(t.value)??0;coSucio();coCalc();return}if(k==='notas'){j.notas=t.value;coSucio();return}return}
  if(d.coP&&j){const g=j.gente[d.coP];if(!g)return;g[d.c]=t.value;coSucio();if(d.c==='e'){if(ch)renderMain()}else coCalc();return}
  if(d.coT!=null&&j){const x=j.trabajos[+d.coT],c=d.c;if(!x)return;
    if(c==='pp'){x.pp=t.checked;if(x.pp&&!udsLabor(x.labor).concat('matas').includes(x.ud))x.ud=udsLabor(x.labor)[0];coSucio();renderMain();return}
    if(['labor','cab','ud'].includes(c)){if(!ch)return;x[c]=t.value;if(c==='cab'){x.nave=null;x.pas=[]}if(c==='labor'&&x.pp&&!udsLabor(x.labor).concat('matas').includes(x.ud))x.ud=udsLabor(x.labor)[0];coSucio();renderMain();return}
    if(c==='nave'){if(t.tagName==='SELECT'&&!ch)return;x.nave=t.value===''?null:+t.value;x.pas=[];if(x.mAuto)x.matas=null;coSucio();if(t.tagName==='SELECT')renderMain();return}
    if(c==='txt'){x.txt=t.value;coSucio();return}
    x[c]=num(t.value);if(c==='matas')x.mAuto=false;coSucio();coCalc();return}
  if(d.coQp!=null&&j){const x=j.trabajos[+d.coQp];x.qp=x.qp||{};x.qp[d.p]=num(t.value);coSucio();coCalc();return}
  if(d.coGe&&st.co.ge){st.co.ge[d.coGe]=t.value;return}
  if(d.coGm!=null&&st.co.ge){st.co.ge.miembros[+d.coGm].n=t.value;return}}
$('#main').addEventListener('input',onCoInput);$('#main').addEventListener('change',onCoInput);

/* ---------- Copia de seguridad ---------- */
async function backup(){toast('Preparando copia…');if(Store.mode==='fb'){try{const x=await NUBE.exportAll();await saveBlob(new Blob([JSON.stringify({app:'abonado-pinta-santos',v:2,exportado:new Date().toISOString(),ls:x.ls,adjuntos:x.adjuntos})],{type:'application/json'}),'abonado-copia-'+hoy()+'.json');toast('Copia descargada: '+x.dias+' días y '+Object.keys(x.adjuntos).length+' adjuntos')}catch(e){toast('Necesitas conexión para descargar la copia')}return}
  const ls={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('abono.'))ls[k]=localStorage.getItem(k)}}catch(e){}
  const data={app:'abonado-pinta-santos',v:2,exportado:new Date().toISOString(),ls,adjuntos:{}};
  const docs=[...(Store.lsGet('abono.msgs')||[]),...(Store.lsGet('abono.almacen')||[]),...(Store.lsGet('abono.diagnosticos')||[])];
  for(const m of docs)for(const a of m.adjuntos||[]){if(!a.local)continue;const bl=await Adj.idbGet(a.id).catch(()=>null);if(bl)data.adjuntos[a.id]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(bl)})}
  const regs=Object.keys(ls).filter(k=>k.startsWith('abono.reg.')).length;
  await saveBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),'abonado-copia-'+hoy()+'.json');
  toast('Copia descargada: '+regs+' días y '+Object.keys(data.adjuntos).length+' adjuntos')}
document.addEventListener('change',e=>{if(e.target.id!=='restore'||!e.target.files[0])return;const fr=new FileReader();fr.onload=async()=>{try{const d=JSON.parse(fr.result);if(d.app!=='abonado-pinta-santos')throw 0;
  if(d.ls){for(const[k,v]of Object.entries(d.ls))if(k.startsWith('abono.'))localStorage.setItem(k,v)}
  else{if(d.config)Store.lsSet('abono.config',d.config);for(const r of d.registros||[])if(r&&r.fecha)await Store.setReg(r.fecha,r);if(Array.isArray(d.cambios))Store.lsSet('abono.cambios',d.cambios);if(Array.isArray(d.mensajes))Store.lsSet('abono.msgs',d.mensajes)}
  for(const[id,u]of Object.entries(d.adjuntos||{})){try{const bl=await (await fetch(u)).blob();await Adj.idbPut(id,bl)}catch(_){}}
  if(window.NUBE&&NUBE.user){toast('Subiendo la copia a la nube…');await NUBE.subirLocal(true)}
  toast('Copia restaurada');setTimeout(()=>location.reload(),900)}catch(err){toast('Ese archivo no es una copia de esta app')}};fr.readAsText(e.target.files[0]);e.target.value=''});
