<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abonado">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Abonado Pinta Santos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: herramienta de campo, móvil primero. Cabecera fija con día + cabezal + pestañas; tarjetas por depósito; barra de guardado inferior. */
:root{
  --bg:#eef2ef; --surface:#ffffff; --surface-2:#f6f8f6; --ink:#15222c; --muted:#5a6a70; --line:#d6dfda;
  --accent:#1d6b47; --accent-ink:#ffffff; --navy:#1b2f4a;
  --ok:#23704a; --ok-bg:#dcefe3; --warn:#8a5a0c; --warn-bg:#f8e8c8; --bad:#a3271b; --bad-bg:#f7d9d4;
  --bar:#cfe0d6;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;text-transform:uppercase}
button,input,select,textarea,label{text-transform:inherit}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
.num,td,.stat b,.inp input{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 0;display:grid;gap:10px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
h1{font-size:28px;line-height:1;color:var(--navy);font-weight:700}
.date{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.date input{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.scroller::-webkit-scrollbar{display:none}
.scroller.drag{cursor:grabbing;user-select:none}
@media (hover:hover) and (pointer:fine){.scroller{flex-wrap:wrap;overflow:visible;row-gap:2px}}
.chip{flex:none;font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.tabs .tab{flex:none;font:600 15px var(--f-display);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:8px 10px 10px;border-bottom:3px solid transparent;cursor:pointer}
.tabs .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:16px 120px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px;min-width:0}
.card h3{font-size:20px;font-weight:600}
.sub{font-size:13px;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px}
.banner b{color:var(--warn)}
.note{font-size:13px;color:var(--muted)}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.summary .wide{grid-column:1/-1}
.summary td b{white-space:nowrap;font-size:18px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.stat>span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.stat b{font:600 24px var(--f-display)}
.stat small{font-size:12px;color:var(--muted)}

.tank-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.field{display:grid;gap:4px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.inp{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.inp input{font:600 18px var(--f-body);color:var(--ink);background:transparent;border:0;padding:7px 8px;width:7.5ch;text-align:right}
.inp input.wide{width:14ch;text-align:left;font-size:16px}
.nmf .inp input.wide{width:100%;min-width:0}
.inp .u{font-size:13px;color:var(--muted);padding-right:9px}
.field.big .inp input{font-size:24px;width:6ch}
.inp.sm input{font-size:15px;width:6ch;padding:5px 6px}

.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.u{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.nd{background:var(--surface-2);color:var(--muted)}
.line{font-size:14px;color:var(--muted)}
.line b{color:var(--ink)}

.sector-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bj{display:grid;grid-template-columns:minmax(70px,1fr) auto minmax(90px,1.2fr);gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.bj .nm b{display:block;font-size:15px}
.bj .nm small{color:var(--muted);font-size:12px}
.bj,.bjh{grid-template-columns:minmax(70px,1fr) 100px 164px minmax(90px,1.2fr)}
.bjce{display:flex;gap:6px}
.meter .vt{font-size:14px;color:var(--ink);margin-left:2px}
.bjce .inp{flex:1}.bjce .inp input{width:100%;min-width:0}
.bjh{display:grid;gap:10px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding-top:6px}
.meter{display:grid;gap:3px;min-width:0}
.meter .bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent)}
.meter .bar i.bad{background:var(--bad)}
.meter .t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:6px}
.meter .t b{font-size:15px;color:var(--ink)}

.pick{display:flex;flex-wrap:wrap;gap:6px}
.steps{display:grid;gap:0}
.step{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.step:first-child{border-top:0}
.step b{font:600 20px var(--f-display);white-space:nowrap}
.step.water{background:var(--surface-2);margin:0 -14px;padding:10px 14px;border-radius:0 0 10px 10px}

.btn{font:600 15px var(--f-body);border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.hist{display:grid;gap:0}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .d{font:600 17px var(--f-display);white-space:nowrap}
.hrow .cs{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.mini{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.chg{padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.chg:first-child{border-top:0}
.chg ul{margin:4px 0 0;padding-left:18px}

.cfgrow{display:grid;grid-template-columns:1fr repeat(3,auto);gap:10px;align-items:end;padding-block:8px;border-top:1px solid var(--line)}
.cfgrow:first-of-type{border-top:0}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--navy);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{padding-block:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.savebar .btn{border-color:transparent}
.savebar .msg{font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:7;max-width:calc(100% - 32px)}
.foot{padding-block:0 24px;font-size:12px;color:var(--muted)}
.card>*{min-width:0}
.inp select{font:600 16px var(--f-body);color:var(--ink);background:transparent;border:0;padding:7px 8px;width:100%}
textarea{width:100%;font:500 16px var(--f-body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;min-height:84px}
.msgbar{border:0;width:100%;text-align:left;font:inherit;cursor:pointer;font-weight:600}
.msgs{display:grid}
.msg{display:grid;gap:5px;padding:12px 0;border-top:1px solid var(--line)}
.msg:first-child{border-top:0}
.msg.done{opacity:.6}
.msg .h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.msg .h b{color:var(--ink);font-size:14px}
.msg.parami{border-left:3px solid var(--accent);padding-left:10px;background:linear-gradient(90deg,var(--ok-bg),transparent 60%)}
.pill.para{background:var(--accent);color:#fff}
.msg p{margin:0;white-space:pre-wrap;font-size:15px;overflow-wrap:anywhere}
.msg .row .btn{padding:5px 10px;font-size:13px}
.adjs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:84px;height:84px;background:var(--surface-2);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.fchip{display:inline-flex;gap:6px;align-items:center;font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer;max-width:100%;text-align:left}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.fchip small{color:var(--muted);font-weight:500}
.adjwrap{position:relative;display:inline-flex}
.rm{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font:700 14px/24px var(--f-body);cursor:pointer;padding:0}
.up{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.lb{position:fixed;inset:0;z-index:9;background:rgba(12,18,24,.9);display:flex;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lb[hidden],.savebar[hidden],.toast[hidden],.tip[hidden]{display:none}
.chart{position:relative;min-height:220px}
.chart svg{display:block;touch-action:pan-y}
.ax{font:500 11px var(--f-body);fill:var(--muted)}
.dl{font:600 11px var(--f-body);fill:var(--ink)}
.bar.on{opacity:.7}
.tip{position:absolute;top:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 4px 14px rgba(20,30,40,.14);font-size:12px;pointer-events:none;min-width:140px;z-index:2;display:grid;gap:3px}
.tip .th{color:var(--muted);font-weight:600}
.tip .tr{display:flex;gap:6px;align-items:center;white-space:nowrap}
.tip .tr i{width:12px;height:2px;flex:none}
.tip .tr b{font-size:14px;color:var(--ink);text-transform:none}
.nt{text-transform:none}
.tip .tr span{color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:2px;display:inline-block}
.legend i.dash{height:0;border-top:2px dashed var(--muted)}
.legend i.band{height:10px;background:var(--ok-bg)}
details.tv summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
details.tv .tbl{margin-top:8px;max-height:300px;overflow:auto}
.cerow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-width:420px}
.cerow .inp input{width:100%}
.lvl{display:grid;gap:4px}
.lvl .bar{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
.lvl .bar .mk{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);opacity:.45}
.lvl .bar i{display:block;height:100%;background:var(--accent)}
.lvl .bar i.warn{background:var(--warn)}
.lvl .bar i.bad{background:var(--bad)}
.lvl .t{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.lvl .t b{color:var(--ink)}
.lrow{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:12px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lect.lsim{grid-template-columns:repeat(2,minmax(0,1fr))}
.lrow .lnm{display:grid;gap:4px}
.lrow .gd{display:flex;align-items:center;gap:8px}
.lrow .lnm small{color:var(--muted);font-size:12px}
.lvl .bar i.est{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px)}
.srow{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.yo{min-height:42px;display:flex;align-items:center;padding:0 12px;border-radius:8px;background:var(--ok-bg);color:var(--ok);font-size:16px}
.srow .nm b{display:block}
.srow .nm small{color:var(--muted);font-size:12px}
.srow .sv{white-space:nowrap}
.srow .sv b{font:600 20px var(--f-display)}
.srow .sv small{display:block;color:var(--muted);font-size:12px}
.srow .flds{display:flex;gap:10px;flex-wrap:wrap}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.frm .inp input,.frm .inp select{width:100%}
.panel{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.inp input[type=date],.inp input[type=month]{font:600 15px var(--f-body);width:100%;text-align:left}
.ev{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-block:7px;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.ev:first-child{border-top:0}
.ev .btn{padding:4px 10px;font-size:13px}
.lect{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.lect .inp input{width:100%}
.lbox{display:grid;gap:2px;align-content:start;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.lbox span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.lbox b{font:600 22px var(--f-display);white-space:nowrap}
.lbox b small{font:500 12px var(--f-body);color:var(--muted)}
.lbox>small{font-size:11px;color:var(--muted)}
.lbox.res{background:var(--ok-bg);border-color:var(--accent)}
.lbox.res b{color:var(--accent)}
.lbox.res b.neg{color:var(--bad)}
.radar{position:relative;height:340px;overflow:hidden;border-radius:8px;background:#dfe7e3;border:1px solid var(--line);touch-action:pan-y}
.radar img{position:absolute;width:256px;height:256px;max-width:none;user-select:none;-webkit-user-drag:none}
.rvbase,.rvf{position:absolute;inset:0}
.rvf img{opacity:.8}
.rvf[hidden]{display:none}
.radar .pin{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--bad);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.radar .attr{position:absolute;right:4px;bottom:4px;font-size:10px;background:rgba(255,255,255,.85);color:#333;padding:1px 5px;border-radius:3px;text-transform:none}
.radar .nodata{position:absolute;inset:auto 8px 8px 8px;font-size:12px;background:rgba(255,255,255,.9);padding:6px 8px;border-radius:6px}
.rvctl input[type=range]{flex:1 1 140px;min-width:120px;accent-color:var(--accent)}
.rvctl .t{font-weight:600;min-width:46px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font:600 13px var(--f-body);color:var(--navy);border:1px solid var(--line);border-radius:8px;padding:7px 10px;text-decoration:none;background:var(--surface)}
.avisos{display:flex;flex-wrap:wrap;gap:6px}
.suma{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:center;border-radius:10px;padding:10px 12px;border:1px solid}
.suma>div{display:grid;gap:2px;min-width:0}
.suma span{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.suma b{font:700 24px var(--f-display)}
.suma small{font-size:12px;color:var(--muted)}
.suma.ok{background:var(--ok-bg);border-color:var(--ok)}
.suma.ok>div:first-child b{color:var(--ok)}
.suma.bad{background:var(--bad-bg);border-color:var(--bad)}
.suma.bad>div:first-child b{color:var(--bad)}
@media (max-width:520px){.suma{grid-template-columns:1fr 1fr}.suma .btn{grid-column:1/-1}}
.splash{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.splash[hidden]{display:none}
.fincas{position:fixed;inset:0;z-index:28;background:var(--bg);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.fincas[hidden]{display:none}
.fincas .in{max-width:1120px;margin:0 auto;display:grid;gap:20px}
.fhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.fhead h2{font:700 clamp(32px,7vw,46px)/1 var(--f-display);color:var(--navy);margin-top:4px}
.fhead .fecha{font-size:13px;color:var(--muted);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(20,30,40,.04),0 8px 24px rgba(20,30,40,.06)}
.fcard .ph{position:relative;aspect-ratio:16/9;background:#2c4a3a;overflow:hidden}
.fcard .ph>img,.fcard .ph>svg.paisaje{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

function sec(cab,n,min,bjs){return{id:cab+'_s'+n,nombre:'Sector '+n,ejMin:min,bandejas:bjs.map(b=>({id:cab+'_b'+b[0].replace('.','_'),nombre:'Bandeja '+b[0],caudal:b[1],ejDren:b[2]}))}}

const $=s=>document.querySelector(s);

const fFecha=f=>new Date(f+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
const fCorta=f=>{const p=f.split('-');return p[2]+'/'+p[1]};

/* ---------- Almacenamiento: nube del artifact (db) o, si no hay, este navegador ---------- */
const Store={db:null,mode:'local',
  async init(){if(window.NUBE&&NUBE.db){this.db=NUBE.db;this.mode='fb';return}try{if(window.claude&&typeof window.claude.use==='function'){const db=await window.claude.use('db');if(db){this.db=db;this.mode='db'}}}catch(e){}},
  lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},

  async setReg(f,r){if(this.db)return this.db.doc('registros/'+f).set(r);this.lsSet('abono.reg.'+f,r);const i=new Set(this.lsGet('abono.regs')||[]);i.add(f);this.lsSet('abono.regs',[...i])},
  async listRegs(){if(this.db){const q=await this.db.collection('registros').orderBy('fecha','desc').limit(120).get();return q.docs.map(d=>d.data())}return(this.lsGet('abono.regs')||[]).sort().reverse().slice(0,120).map(f=>this.lsGet('abono.reg.'+f)).filter(Boolean)},
  async addCambio(c){if(this.db)return this.db.collection('cambios').add(c);const l=this.lsGet('abono.cambios')||[];l.unshift(c);this.lsSet('abono.cambios',l.slice(0,200))},
  async listCambios(){if(this.db){const q=await this.db.collection('cambios').orderBy('ts','desc').limit(60).get();return q.docs.map(d=>d.data())}return this.lsGet('abono.cambios')||[]},
  async listMsgs(){if(this.db){const q=await this.db.collection('mensajes').orderBy('ts','desc').limit(200).get();return q.docs.map(d=>({...d.data(),id:d.id}))}return this.lsGet('abono.msgs')||[]},
  async addMsg(m){if(this.db){const r=await this.db.collection('mensajes').add(m);return r.id}const id='m'+Date.now();const l=this.lsGet('abono.msgs')||[];l.unshift({...m,id});this.lsSet('abono.msgs',l.slice(0,500));return id},
  async updMsg(id,patch){if(this.db)return this.db.collection('mensajes').doc(id).update(patch);this.lsSet('abono.msgs',(this.lsGet('abono.msgs')||[]).map(x=>x.id===id?{...x,...patch}:x))},

function factor(b){const pp=b.productos.find(x=>x.p===b.principal);return pp&&pp.dosis>0&&b.kgPrincipal?b.kgPrincipal/pp.dosis:0}

// Depósito compartido: a cada cabezal le toca lo esperado por sus m³ y la receta,
// y la diferencia con lo gastado de verdad se reparte a partes iguales
function cmCab(b,cab){const cm=st.reg.cm[b.id];if(cm==null)return null;if(b.cabezales.length<2)return cm;
  const pp=b.productos.find(x=>x.p===b.principal);if(!pp||!pp.dosis||!b.kgPrincipal||!b.lpcm)return null;
  const esp=c=>{const m=st.reg.m3[c];return m==null?null:pp.dosis*(1000/b.kgPrincipal)*m/100/b.lpcm};
  const es=b.cabezales.map(esp);if(es.some(v=>v==null))return null;
  return esp(cab)+(cm-es.reduce((a,v)=>a+v,0))/b.cabezales.length}

function dosisReal(b,x,cab){const L=litros(b,cab),m=st.reg.m3[cab];if(L==null||!m)return null;return L*conc(b,x)/10/m}

  const ps=[];for(const s of cabById(cab).sectores)for(const bj of s.bandejas){const p=drenPct(s,bj);if(p!=null)ps.push(p)}
  return{m3:st.reg.m3[cab]??null,drenaje:ps.length?ps.reduce((a,c)=>a+c,0)/ps.length:null,fuera,total,dosis:dosisPrincipales(cab),kg:kgDia(cab),

/* Menús desplazables con ratón: rueda y arrastrar */
function scrollRaton(el){if(!el)return;
  el.addEventListener('wheel',e=>{if(el.scrollWidth<=el.clientWidth)return;if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){el.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
  let x0=null,l0=0,mov=false;
  el.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||el.scrollWidth<=el.clientWidth)return;x0=e.clientX;l0=el.scrollLeft;mov=false});
  window.addEventListener('pointermove',e=>{if(x0==null)return;const dx=e.clientX-x0;if(Math.abs(dx)>5){mov=true;el.classList.add('drag')}if(mov)el.scrollLeft=l0-dx});
  window.addEventListener('pointerup',()=>{if(x0==null)return;x0=null;el.classList.remove('drag');if(mov)setTimeout(()=>mov=false,0)});
  el.addEventListener('click',e=>{if(mov){e.stopPropagation();e.preventDefault()}},true)}
scrollRaton($('#tabs'));scrollRaton($('#cabs'));

  return `<div class="stat"><span>En dosis (±10 %)</span><b>${tot?ok+' de '+tot:'—'}</b><small>productos de la receta</small></div>

function cePill(cd,ph,pre){const a=st.cfg.alertas,out=[];

  if(ph!=null){const c=ph<a.phMin||ph>a.phMax?'bad':'ok';out.push(`<span class="pill ${c}">${pre||''}pH ${fmt(ph,1)}${c==='bad'?' fuera':''}</span>`)}return out}
function meter(s,bj){const p=drenPct(s,bj),min=st.reg.min[s.id];const ap=min!=null?min*bj.caudal/1000:null;const bad=p!=null&&p>100;const pl=cePill(st.reg.ceD[bj.id],st.reg.phD[bj.id]).filter(x=>!x.includes('pill ok'));
  return `<div class="t"><span>Volumen total <b class="vt">${fmt(ap,2)} L</b></span><b>${fmt(p,1)} %</b></div><div class="bar"><i class="${bad?'bad':''}" style="width:${p==null?0:Math.min(100,p)}%"></i></div>${bad?'<div class="t" style="color:var(--bad)">Más drenaje que volumen total: revisa minutos o ml</div>':''}${pl.length?`<div class="row" style="gap:4px;margin-top:4px">${pl.join('')}</div>`:''}`}
function ceOut(s){const out=cePill(valSect(st.reg,s,'ceD'),valSect(st.reg,s,'phD'),'Media ');return out.length?`<div class="row">${out.join('')}</div>`:''}
function sumDren(c){const r=resumen(c.id);const per=c.sectores.map(s=>{const ps=s.bandejas.map(bj=>drenPct(s,bj)).filter(p=>p!=null);return{s,m:ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null}});
  return `<div class="stat"><span>Media del cabezal</span><b>${fmt(r.drenaje,1)} %</b><small>${esc(c.nombre)}</small></div>`+(r.ceD!=null?`<div class="stat"><span>CE drenaje</span><b>${fmt(r.ceD,2)}</b><small class="nt">mS/cm</small></div>`:'')+per.map(p=>`<div class="stat"><span>${esc(p.s.nombre)}</span><b>${fmt(p.m,1)} %</b><small>${fmt(st.reg.min[p.s.id],0)} min</small></div>`).join('')}

/* Lo que falta para llenar hasta arriba (= gaste actual); si no se sabe el nivel, los cm habituales */
function cmLlenar(b){const n=nivel(b);if(n&&n.max>0)return +Math.max(0,Math.min(n.max,n.max-Math.max(0,n.rest))).toFixed(1);return b.cmHabitual}
function fillOut(b){const cm=st.fill[b.id]!==undefined?st.fill[b.id]:cmLlenar(b);if(cm==null)return '';const L=cm*b.lpcm;let liqCm=0;
  let h=`<div class="line">Volumen a preparar: <b>${fmt(L,0)} L</b></div><div class="steps">`;
  for(const x of b.productos){if(!x.dosis)continue;const q=L*conc(b,x)/1000;let extra='';if(prod(x.p).liq){const c=q/b.lpcm;liqCm+=c;extra=` <span class="note">≈ ${fmt(c,1)} cm</span>`}
    h+=`<div class="step"><span>${esc(prod(x.p).n)}${extra}</span><b>${fmt(q,1)} ${uCant(x.p)}</b></div>`}
  if(cm*b.lpcm>b.capacidad*1.05)h+=`<div class="step" style="color:var(--bad)"><span>Pasas de la capacidad del depósito</span><b></b></div>`;
  return h+`<div class="step water"><span>Agua (cm de depósito)</span><b>${fmt(cm-liqCm,1)} cm</b></div></div>`}

const SUMA_MIN=505,SUMA_MAX=515;
function sumaPotHTML(b){const pp=b.productos.find(x=>x.p===b.principal);if(!pp||!pp.dosis)return '';let r=0;for(const x of b.productos)if(x.dosis&&!prod(x.p).liq)r+=x.dosis/pp.dosis;
  const k=r*b.capacidad/1000;if(!k)return '';const s=(b.kgPrincipal||0)*k,ok=s>=SUMA_MIN&&s<=SUMA_MAX,rec=Math.round((SUMA_MIN+SUMA_MAX)/2/k),sr=rec*k;
  return `<div class="suma ${ok?'ok':'bad'}"><div><span>Suma de kg en ${fmt(b.capacidad,0)} L</span><b>${fmt(s,1)} kg</b><small>${ok?'Dentro':'Fuera'} de ${SUMA_MIN}–${SUMA_MAX} kg</small></div>
    <div><span>Cantidad recomendada</span><b>${fmt(rec,0)} kg</b><small>${esc(pn(b.principal))} por 1000 L · la suma queda en ${fmt(sr,1)} kg</small></div>
           ${Math.abs(rec-(b.kgPrincipal||0))>0.001?`<button class="btn" data-act="usar-rec" data-id="${b.id}" data-v="${rec}">Usar ${fmt(rec,0)} kg</button>`:''}</div>`}

const ASSET_TYPES=['image/png','image/jpeg','image/gif','image/webp','video/mp4','video/webm','application/pdf','text/plain','text/csv'];
const EXT_TYPES={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',mp4:'video/mp4',webm:'video/webm',txt:'text/plain',csv:'text/csv'};
const fSize=b=>b<1048576?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(1).replace('.',',')+' MB';
const CLIP='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.5l-8.5 8.5a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7l-9 9a2 2 0 0 1-2.8-2.8l8.3-8.3"/></svg>';
async function compressImg(file){const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
  const M=1600,s=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(img.src);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('img')),'image/jpeg',0.8))}
const Adj={assets:null,downloads:null,idb:null,urls:{},
  async init(){if(Store.mode!=='db')return;try{this.assets=await window.claude.use('assets')}catch(e){}try{this.downloads=await window.claude.use('downloads')}catch(e){}},
  can(){return Store.mode==='db'?!!this.assets:typeof indexedDB!=='undefined'},
  async open_(){if(this.idb)return this.idb;this.idb=await new Promise((res,rej)=>{const r=indexedDB.open('abonado',1);r.onupgradeneeded=()=>r.result.createObjectStore('adjuntos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return this.idb},
  async tx(mode,fn){const d=await this.open_();return new Promise((res,rej)=>{const t=d.transaction('adjuntos',mode);const q=fn(t.objectStore('adjuntos'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
  idbPut(id,b){return this.tx('readwrite',s=>s.put(b,id))},idbGet(id){return this.tx('readonly',s=>s.get(id))},idbDel(id){return this.tx('readwrite',s=>s.delete(id))},
  async put(file){let blob=file,type=file.type||'',name=file.name||'archivo';const ext=(name.split('.').pop()||'').toLowerCase();if(!type&&EXT_TYPES[ext])type=EXT_TYPES[ext];
    if(/^image\/(jpeg|png|webp|heic|heif)$/.test(type)||/^(heic|heif)$/.test(ext)){try{blob=await compressImg(file);type='image/jpeg';name=name.replace(/\.[^.]+$/,'')+'.jpg'}catch(e){}}
    const img=type.startsWith('image/');
    if(Store.mode==='db'){if(!ASSET_TYPES.includes(type))throw{code:'tipo'};if(blob.size>20*1048576)throw{code:'too_large'};
      const r=await this.assets.upload(blob,{type});this.urls[r.id]=r.url;return{id:r.id,name,type,size:r.sizeBytes,img}}
    if(Store.mode==='fb'){if(blob.size>8*1048576)throw{code:'too_large'};const id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);await this.idbPut(id,blob).catch(()=>{});await NUBE.putBlob(id,blob,type);return{id,name,type,size:blob.size,img,fb:true}}
    if(blob.size>25*1048576)throw{code:'too_large'};
    const id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);await this.idbPut(id,blob);return{id,name,type,size:blob.size,img,local:true}},
  src(a){return a.local||a.fb?(this.urls[a.id]||''):(this.urls[a.id]||'/_blob/'+a.id)},
  async url(a){if(this.urls[a.id])return this.urls[a.id];if(!a.local&&!a.fb)return '/_blob/'+a.id;let b=await this.idbGet(a.id).catch(()=>null);if(!b&&window.NUBE&&NUBE.db){b=await NUBE.getBlob(a.id).catch(()=>null);if(b)this.idbPut(a.id,b).catch(()=>{})}if(!b)return null;return this.urls[a.id]=URL.createObjectURL(b)},
  async save(a){if(a.local||a.fb){const u=await this.url(a);if(!u){toast('Archivo no encontrado en este dispositivo');return}const l=document.createElement('a');l.href=u;l.download=a.name;document.body.appendChild(l);l.click();l.remove();return}
    if(!this.downloads){toast('Descarga no disponible aquí');return}
    try{const r=await fetch(this.src(a));const b=await r.blob();await this.downloads.save({filename:a.name,data:b})}catch(e){if(!e||e.code!=='declined')toast('No se pudo descargar')}},
  async del(a){try{if(a.local)await this.idbDel(a.id);else if(a.fb){await this.idbDel(a.id).catch(()=>{});await NUBE.delBlob(a.id)}else if(this.assets)await this.assets.delete(a.id)}catch(e){}}
};

/* Medida del depósito: «gaste» = cm que ha bajado desde lleno (regla desde arriba); «nivel» = cm de líquido desde el fondo.
   Por dentro todo se calcula en nivel (lo que queda). */
const esDirecto=()=>(st.cfg.medida||'cm')==='cm';
const esGaste=()=>st.cfg.medida==='gaste';
const maxCm=b=>b.capacidad/b.lpcm;
const aNivel=(b,raw)=>raw==null?null:esGaste()?maxCm(b)-raw:raw;
const aLectura=(b,lv)=>lv==null?null:+(esGaste()?maxCm(b)-lv:lv).toFixed(1);
const txtMed=()=>esGaste()?'Gaste':'Nivel';
function lecturaAnt(b,conHoy){if(esDirecto())return null;if(conHoy&&st.reg.niv&&st.reg.niv[b.id]!=null)return{fecha:st.fecha,raw:st.reg.niv[b.id],v:aNivel(b,st.reg.niv[b.id])};let best=null;
  for(const r of st.hist||[]){if(r.fecha>=st.fecha)continue;const v=(r.niv||{})[b.id];if(v!=null&&(!best||r.fecha>best.fecha))best={fecha:r.fecha,raw:v,v:aNivel(b,v)}}return best}
/* Gasto diario: el que pongas a mano o, si no, la media real de los últimos 7 días con dato */
/* Gasto diario del depósito: 1) el que pongas a mano; 2) la media real de los últimos 7 días con dato; 3) el teórico según la receta y los m³ medios de cada cabezal */
function m3Medio(cab){const vs=(st.hist||[]).map(r=>(r.m3||{})[cab]).filter(v=>v!=null&&v>0).slice(0,7);return vs.length?vs.reduce((a,c)=>a+c,0)/vs.length:(cabById(cab).ejM3||null)}
function gastoTeorico(b){const pp=b.productos.find(x=>x.p===b.principal);if(!pp||!pp.dosis||!b.kgPrincipal||!b.lpcm)return null;let t=0;
  for(const c of b.cabezales){const m=m3Medio(c);if(m==null)return null;t+=pp.dosis*(1000/b.kgPrincipal)*m/100/b.lpcm}return t>0?t:null}
function gastoDia(b){const vs=(st.hist||[]).map(r=>(r.cm||{})[b.id]).filter(v=>v!=null&&v>=0).slice(0,7),med=vs.length?vs.reduce((a,c)=>a+c,0)/vs.length:null,man=b.consumoDia>0?b.consumoDia:null,teo=gastoTeorico(b);return{man,med,teo,v:man??med??teo}}
/* Parte del gasto de un día ya hecha: hoy va de 0 a 1 durante el horario de riego; los días pasados cuentan enteros */
const minDe=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?+m[1]*60+ +m[2]:null};
function fracDia(f){const h=hoy();if(f<h)return 1;if(f>h)return 0;const r=st.cfg.riego||{},a=minDe(r.ini)??510,b=minDe(r.fin)??1110,d=new Date(),m=d.getHours()*60+d.getMinutes();
  if(b<=a)return 1;return Math.max(0,Math.min(1,(m-a)/(b-a)))}
const sigD=f=>{const d=new Date(f+'T12:00:00');d.setDate(d.getDate()+1);return isoD(d)};
function cmDe(b,f){if(f===st.fecha){const v=st.reg.cm[b.id];return v??null}const r=(st.hist||[]).find(x=>x.fecha===f);const v=r&&(r.cm||{})[b.id];return v??null}
/* Nivel: parte de la última medida o llenado y resta lo gastado cada día; los días sin dato resta el gasto diario estimado */
function nivel(b){let ev=null;for(const e of st.llen||[])if(e.bidon===b.id&&e.fecha<=st.fecha&&(!ev||e.ts>ev.ts))ev=e;const lec=lecturaAnt(b,true);if(!ev&&!lec)return null;
  const g=gastoDia(b);let rest,est=0,n=0;
  if(lec&&(!ev||lec.fecha>ev.fecha)){rest=lec.v;
    for(let d=sigD(lec.fecha);d<=st.fecha&&n<180;d=sigD(d),n++){const c=cmDe(b,d);if(c!=null)rest-=c;else if(g.v>0){const fr=fracDia(d);rest-=g.v*fr;if(fr>0)est++}}
    for(const e of st.llen||[])if(e.bidon===b.id&&e.tipo==='llenado'&&e.fecha>lec.fecha&&e.fecha<=st.fecha)rest+=e.cmAdd||0}
  else{rest=ev.cmFinal;const tras=(lec&&lec.fecha===ev.fecha)||esDirecto();for(let d=ev.fecha;d<=st.fecha&&n<180;d=sigD(d),n++){if(tras&&d===ev.fecha)continue;const c=cmDe(b,d);if(c!=null)rest-=c;else if(d>ev.fecha&&g.v>0){const fr=fracDia(d);rest-=g.v*fr;if(fr>0)est++}}}
  return{rest,dias:g.v>0?Math.max(0,rest)/g.v:null,ev,max:b.capacidad/b.lpcm,est,g}}
/* cm gastados hoy = nivel de partida − nivel de hoy. La partida es la lectura anterior o, si después hubo un llenado o una medida
   (el mismo día de la lectura se entiende que fue después de leer), lo que quedó tras ese llenado/medida. Lo de hoy se entiende después de leer. */
function cmAuto(b){const p=lecturaAnt(b,false),hr=st.reg.niv&&st.reg.niv[b.id];if(!p||hr==null)return null;const h=aNivel(b,hr);let base={fecha:p.fecha,v:p.v,raw:p.raw,tras:null},ul=null;
  for(const e of st.llen||[])if(e.bidon===b.id&&e.fecha>=p.fecha&&e.fecha<st.fecha&&e.cmFinal!=null&&(!ul||e.ts>ul.ts))ul=e;
  if(ul)base={fecha:ul.fecha,v:ul.cmFinal,raw:aLectura(b,ul.cmFinal),tras:ul.tipo};
  let g=+(base.v-h).toFixed(1),relleno=false;if(g<0){relleno=true;g=+Math.max(0,maxCm(b)-h).toFixed(1)}
  return{prev:base,add:0,g,relleno}}

function drawRadar(){const el=document.getElementById('radar');if(!el||!ubicOk())return;const u=st.cfg.ubic,z=st.rvZ,W=el.clientWidth,H=el.clientHeight,c=lonLatPx(u.lat,u.lon,z),x0=c.x-W/2,y0=c.y-H/2,n=Math.pow(2,z),tiles=[];

    `<span class="pin" style="left:${Math.round(W/2)}px;top:${Math.round(H/2)}px"></span><span class="attr">© OpenStreetMap · radar RainViewer</span>`+(st.rv&&!fr.length?'<div class="nodata">Radar no disponible ahora mismo</div>':'')}

function avisosWx(d){const out=[],nom=i=>i===0?'hoy':i===1?'mañana':new Date(d.time[i]+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long'});
  d.time.forEach((_,i)=>{if((d.precipitation_probability_max[i]??0)>=60||(d.precipitation_sum[i]??0)>=5)out.push(['warn',`Lluvia ${nom(i)}: ${fmt(d.precipitation_sum[i],1)} mm`]);
    if((d.wind_gusts_10m_max[i]??0)>=50)out.push(['bad',`Rachas de ${fmt(d.wind_gusts_10m_max[i],0)} km/h ${nom(i)}`]);
    if((d.temperature_2m_min[i]??99)<=3)out.push(['bad',`Riesgo de helada ${nom(i)}: ${fmt(d.temperature_2m_min[i],0)} °C`]);
    if((d.temperature_2m_max[i]??0)>=35)out.push(['warn',`Calor ${nom(i)}: ${fmt(d.temperature_2m_max[i],0)} °C`])});return out}

  const lim=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const regs=(st.hist||[]).filter(r=>r.fecha>=lim&&r.m3&&r.m3[cab]!=null).sort((a,b)=>a.fecha<b.fecha?-1:1);
  const fechas=regs.map(r=>r.fecha),m3=regs.map(r=>r.m3[cab]);
  const dren=c.sectores.map((s,i)=>({name:s.nombre.replace('Sector ','S'),full:s.nombre,color:SERIE[i%4],values:regs.map(r=>{
    const ps=s.bandejas.map(bj=>{const min=(r.min||{})[s.id],ml=(r.dren||{})[bj.id];return min&&ml!=null&&bj.caudal?ml*100/(min*bj.caudal):null}).filter(v=>v!=null);
    return ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null})}));

function niceTicks(lo,hi){if(lo===hi){lo-=1;hi+=1}const s0=(hi-lo)/4,mag=Math.pow(10,Math.floor(Math.log10(s0))),e=s0/mag;const st_=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;
  const a=Math.floor(lo/st_)*st_,b=Math.ceil(hi/st_)*st_,t=[];for(let v=a;v<=b+st_*1e-6;v+=st_)t.push(+v.toFixed(6));return t}

function drawChart(el,sp){const W=Math.max(260,el.clientWidth),H=220,L=40,R=sp.bars?10:88,T=12,B=26,iw=W-L-R,ih=H-T-B,n=sp.fechas.length;

  const y=v=>T+ih-(v-lo)/(hi-lo)*ih,step=sp.bars?iw/n:iw/Math.max(1,n-1),x=i=>sp.bars?L+step*(i+.5):L+step*i;

  if(sp.ref!=null)s+=`<line x1="${L}" x2="${L+iw}" y1="${y(sp.ref)}" y2="${y(sp.ref)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  const every=Math.ceil(n/Math.max(2,Math.floor(iw/64)));for(let i=0;i<n;i+=every)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" class="ax">${(sp.xlab||fCorta)(sp.fechas[i])}</text>`;
  if(sp.bars){const bw=Math.max(3,Math.min(28,step*.7)),base=y(lo);sp.values.forEach((v,i)=>{if(v==null)return;const x0=x(i)-bw/2,y0=y(v),r=Math.min(4,bw/2,base-y0);

  else{const labs=[];for(const se of sp.series){let d='',pen=false;se.values.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1);pen=true});
      s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      se.values.forEach((v,i)=>{if(v!=null&&se.values[i-1]==null&&se.values[i+1]==null)s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${se.color}"/>`});
      let li=-1;for(let i=n-1;i>=0;i--)if(se.values[i]!=null){li=i;break}

    labs.sort((a,b)=>a.y-b.y);for(let i=1;i<labs.length;i++)if(labs[i].y-labs[i-1].y<15)labs[i].y=labs[i-1].y+15;
    for(const l of labs)s+=`<line x1="${L+iw+8}" x2="${L+iw+16}" y1="${l.y}" y2="${l.y}" stroke="${l.c}" stroke-width="2"/><text x="${L+iw+20}" y="${l.y+4}" class="dl">${esc(l.t)}</text>`}

  svg.addEventListener('pointerleave',hide)}
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(st.tab==='graficas'||st.tab==='tiempo')drawCharts();if(st.tab==='tiempo')drawRadar()},150)});

const VIEWS={cuentas:vCuentas,drenaje:vDrenaje,rellenar:vRellenar,receta:vReceta,historial:vHistorial,graficas:vGraficas,mensajes:vMensajes,almacen:vAlmacen,informe:vInforme,tiempo:vTiempo,diagnostico:vDiagnostico,ajustes:vAjustes};
function renderMain(){$('#main').innerHTML=VIEWS[st.tab]();hydrate();if(st.tab==='graficas'||st.tab==='tiempo')drawCharts();if(st.tab==='tiempo')drawRadar()}
function softUpdate(){const tmp=document.createElement('div');tmp.innerHTML=VIEWS[st.tab]();const n=tmp.querySelectorAll('[data-out]'),o=$('#main').querySelectorAll('[data-out]');
  if(n.length!==o.length){renderMain();return}n.forEach((el,i)=>{if(o[i].innerHTML!==el.innerHTML)o[i].innerHTML=el.innerHTML})}
function renderSave(){const bar=$('#savebar');const show=st.dirtyReg||st.dirtyCfg;bar.hidden=!show;if(!show)return;
  $('#savemsg').textContent=st.saving?'Guardando…':'Cambios sin guardar';
  $('#savebtns').innerHTML=(st.dirtyCfg?`<button class="btn" data-act="save-cfg" ${st.saving?'disabled':''}>Guardar receta y ajustes</button>`:'')+(st.dirtyReg?`<button class="btn pri" data-act="save-reg" ${st.saving?'disabled':''}>Guardar día ${fCorta(st.fecha)}</button>`:'')}
function renderFoot(){}
function renderAll(){$('#fecha').value=st.fecha;renderCabs();renderTabs();renderMain();renderSave();renderFoot()}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2600)}

/* ---------- Edición ---------- */
const bid=id=>st.cfg.bidones.find(b=>b.id===id);
function bandeja(id){for(const c of st.cfg.cabezales)for(const s of c.sectores)for(const b of s.bandejas)if(b.id===id)return b}
function applyCfg(p,v){const b=bid(p[2]);switch(p[1]){
  case 'kg':b.kgPrincipal=v;break;case 'dosis':b.productos[+p[3]].dosis=v??0;break;case 'lpcm':if(v)b.lpcm=v;break;
  case 'cap':if(v)b.capacidad=v;break;case 'vent':b.venturis=v?Math.max(1,Math.round(v)):1;break;case 'rep':b.reparto=!!v;break;
  case 'al':if(v!=null)st.cfg.alertas[p[2]]=v;break;case 'ub':st.cfg.ubic={...(st.cfg.ubic||{}),[p[2]]:v};st.wx=null;break;case 'min':if(v==null)delete st.cfg.stockMin[p[2]];else st.cfg.stockMin[p[2]]=v;break;case 'saco':if(!(v>0))delete st.cfg.saco[p[2]];else st.cfg.saco[p[2]]=v;break;
  case 'bname':b.nombre=v||b.nombre;break;case 'ia':{const u=(v||'').trim();if(!u)delete st.cfg.iaUrl;else if(/^https:\/\/\S+$/.test(u))st.cfg.iaUrl=u;break}case 'medida':if(v==='gaste'||v==='nivel'||v==='cm'){st.cfg.medida=v;st.cfg.medidaV=2}break;case 'cons':if(v>0)b.consumoDia=v;else delete b.consumoDia;break;case 'riego':if(/^\d{1,2}:\d{2}$/.test(v||''))st.cfg.riego={...(st.cfg.riego||{}),[p[2]]:v};break;case 'caudal':{const bj=bandeja(p[2]);if(bj&&v)bj.caudal=v;break}}}
function onInput(e){const t=e.target,k=t.dataset.k;if(!k)return;const p=k.split('.');const v=t.type==='checkbox'?t.checked:(t.dataset.text?t.value.trim():num(t.value));
  if(p[0]==='reg'){if(!st.reg[p[1]])st.reg[p[1]]={};st.reg[p[1]][p[2]]=v;st.dirtyReg=true;if(p[1]==='niv')autoCm(p[2])}else if(p[0]==='fill'){st.fill[p[1]]=v}else if(p[0]==='cfg'){applyCfg(p,v);st.dirtyCfg=true}
  softUpdate();renderSave()}
$('#main').addEventListener('input',onInput);
$('#main').addEventListener('change',e=>{if(e.target.type==='checkbox')onInput(e)});

function diffCfg(a,b){const L=[];for(const nb of b.bidones){const ob=a.bidones.find(x=>x.id===nb.id);if(!ob)continue;const cabs=nb.cabezales.map(x=>(b.cabezales.find(c=>c.id===x)||{}).nombre).join(' + ');
  if(ob.kgPrincipal!==nb.kgPrincipal)L.push(`${cabs} · ${nb.nombre}: ${prod(nb.principal).n} por 1000 L ${fmt(ob.kgPrincipal,2)} → ${fmt(nb.kgPrincipal,2)}`);
  nb.productos.forEach((x,i)=>{const o=ob.productos[i];if(o&&o.dosis!==x.dosis)L.push(`${cabs} · ${prod(x.p).n}: ${fmt(o.dosis,2)} → ${fmt(x.dosis,2)} ${uDosis(x.p)}`)})}
  return L}
function errMsg(e){return e&&e.code==='quota_exceeded'?'No queda espacio en la base de datos de la página.':'No se pudo guardar'+(e&&e.code?' ('+e.code+')':'')+'. Prueba otra vez.'}
async function saveReg(){if(st.saving)return;st.saving=true;renderSave();try{const r=normReg(st.reg,st.fecha);r.resumen={};for(const c of st.cfg.cabezales)r.resumen[c.id]=resumen(c.id);r.guardado=new Date().toISOString();
  await Store.setReg(st.fecha,r);st.reg.ejemplo=false;st.dirtyReg=false;st.hist=null;loadHist();toast('Día '+fCorta(st.fecha)+' guardado');if(st.tab!=='historial')softUpdate();else renderMain()}catch(e){toast(errMsg(e))}
  st.saving=false;renderSave();if(st.tab==='cuentas'||st.tab==='drenaje'){const bn=$('.banner');if(bn&&!st.reg.ejemplo)bn.remove()}}
async function saveCfg(){if(st.saving)return;st.saving=true;renderSave();try{const lineas=diffCfg(st.savedCfg,st.cfg);await Store.setConfig(st.cfg);
  if(lineas.length)await Store.addCambio({ts:new Date().toISOString(),fecha:hoy(),lineas});st.savedCfg=clone(st.cfg);st.dirtyCfg=false;st.cambios=null;st.hist=null;loadHist();toast(lineas.length?'Receta guardada y anotada en el historial':'Ajustes guardados')}catch(e){toast(errMsg(e))}
  st.saving=false;renderSave()}

async function loadFecha(f){st.fecha=f;let r=null;try{r=await Store.getReg(f)}catch(e){}
  if(r){st.reg=normReg(r,f)}else{let last=null;try{last=(await Store.listRegs()).find(x=>x.fecha<f)}catch(e){}
    st.reg=last?{fecha:f,m3:{...last.m3},cm:{},niv:{},min:{...last.min},dren:{},ceE:{},phE:{},ceD:{},phD:{}}:ejemploReg(f)}
  st.dirtyReg=false;renderAll()}

document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.cab){st.cab=t.dataset.cab;renderCabs();renderMain()}
  else if(t.dataset.rvz){st.rvZ=+t.dataset.rvz;renderMain()}
  else if(t.dataset.tab){rvStop();st.tab=t.dataset.tab;st.confirmReset=false;renderCabs();renderTabs();renderMain();window.scrollTo(0,0)}
  else if(t.dataset.fill){st.fillB[st.cab]=t.dataset.fill;st.lf=null;renderMain()}
  else if(t.dataset.open){if(st.dirtyReg)await saveReg();st.tab='cuentas';await loadFecha(t.dataset.open)}
  else if(t.dataset.img){openImg(t.dataset.img)}
  else if(t.dataset.file){const a=findAdj(t.dataset.file);if(a)Adj.save(a)}
  else if(t.dataset.rmadj){for(const L of [st.msgAdj,st.ent.adj]){const i=L.findIndex(x=>x.id===t.dataset.rmadj);if(i>=0){Adj.del(L[i]);L.splice(i,1)}}renderMain()}
  else if(t.dataset.gr){st.gRange=+t.dataset.gr;renderMain()}
  else if(t.dataset.mf!==undefined){st.msgF=t.dataset.mf;st.confirmDel=null;renderMain()}
  else if(t.dataset.act==='msg-send')sendMsg();
  else if(t.dataset.act==='msg-done')toggleMsg(t.dataset.id);
  else if(t.dataset.act==='msg-del'){st.confirmDel=t.dataset.id;renderMain()}
  else if(t.dataset.act==='msg-del-no'){st.confirmDel=null;renderMain()}
  else if(t.dataset.act==='msg-del-yes')delMsg(t.dataset.id);
  else if(t.dataset.act==='priv-resp'){st.msgPara=t.dataset.em;renderMain();window.scrollTo(0,0);const x=$('#msg_txt');if(x)x.focus()}
  else if(t.dataset.act==='priv-del'){st.confirmDel=t.dataset.id;renderMain()}
  else if(t.dataset.act==='priv-del-yes'){const id=t.dataset.id,m=(st.priv||[]).find(x=>x.id===id);try{await Store.delPriv(id);for(const a of (m&&m.adjuntos)||[])await Adj.del(a);st.priv=st.priv.filter(x=>x.id!==id);st.confirmDel=null;renderMain();toast('Mensaje borrado')}catch(e){toast(errMsg(e))}}
  else if(t.dataset.act==='lf-open')lfOpen(t.dataset.t);
  else if(t.dataset.act==='llenar-arriba'||t.dataset.act==='ll-inferido'){const id=t.dataset.id;st.fillB[st.cab]=id;st.tab='rellenar';const o={bidon:id};if(t.dataset.f){o.fecha=t.dataset.f;o.add=+t.dataset.add}renderAll();lfOpen('llenado',o);window.scrollTo(0,0)}
  else if(t.dataset.act==='lf-save')lfSave();
  else if(t.dataset.act==='lf-cancel'){st.lf=null;renderMain()}
  else if(t.dataset.act==='ll-del'){st.confirmLl=t.dataset.id;renderMain()}
  else if(t.dataset.act==='ll-del-no'){st.confirmLl=null;renderMain()}
  else if(t.dataset.act==='ll-del-yes')llDel(t.dataset.id);
  else if(t.dataset.act==='ent-save')entSave();
  else if(t.dataset.act==='aj-save')ajSave();
  else if(t.dataset.act==='mv-del'){st.confirmMv=t.dataset.id;renderMain()}
  else if(t.dataset.act==='mv-del-no'){st.confirmMv=null;renderMain()}
  else if(t.dataset.act==='mv-del-yes')mvDel(t.dataset.id);
  else if(t.dataset.act==='inf-xlsx')exportXlsx();
  else if(t.dataset.act==='inf-pdf'){t.disabled=true;exportPdf().finally(()=>{t.disabled=false})}
  else if(t.dataset.act==='rv-play')rvToggle();
  else if(t.dataset.act==='wx-reload'){st.wx=null;st.rv=null;renderMain()}
  else if(t.dataset.act==='geo')geoUbic();
  else if(t.dataset.act==='ia-save'){const u=($('#ia_url')||{}).value||'',k=($('#ia_pin')||{}).value||'';if(!/^https:\/\//.test(u.trim())||!k.trim()){toast('Pon la dirección (https://…) y la clave');}else{try{localStorage.setItem('abono.ia',JSON.stringify({url:u.trim(),pin:k.trim()}))}catch(e){}toast('Servidor de IA guardado');renderMain()}}
  else if(t.dataset.act==='ia-del'){try{localStorage.removeItem('abono.ia')}catch(e){}renderMain()}
  else if(t.dataset.act==='dg-run')dgRun();
  else if(t.dataset.act==='dg-stop'){if(st.dg.ctl)st.dg.ctl.abort()}
  else if(t.dataset.rmfoto!==undefined){const f=st.dg.fotos.splice(+t.dataset.rmfoto,1)[0];if(f)URL.revokeObjectURL(f.url);renderMain()}
  else if(t.dataset.act==='dg-msg')dgMsg(t.dataset.id);
  else if(t.dataset.act==='dg-del'){st.confirmDg=t.dataset.id;renderMain()}
  else if(t.dataset.act==='dg-del-no'){st.confirmDg=null;renderMain()}
  else if(t.dataset.act==='dg-del-yes')dgDel(t.dataset.id);
  else if(t.dataset.act==='entrar'){cerrarSplash();abrirFincas()}
  else if(t.dataset.act==='fincas')abrirFincas();
  else if(t.dataset.act==='finca-go')elegirFinca(t.dataset.id);
  else if(t.dataset.act==='fu-open'){st.fUbic=t.dataset.id;renderFincas();const i=$('#fu_'+t.dataset.id);if(i)i.focus()}
  else if(t.dataset.act==='fu-no'){st.fUbic=null;renderFincas()}
  else if(t.dataset.act==='fu-save'){const u=coordsDe(($('#fu_'+t.dataset.id)||{}).value);if(!u){toast('No reconozco las coordenadas. Ejemplo: 37.4334, -1.6304');return}guardarUbic(t.dataset.id,u)}
  else if(t.dataset.act==='fu-gps'){if(!navigator.geolocation){toast('Este móvil no da la ubicación');return}toast('Buscando tu ubicación…');const id=t.dataset.id;
    navigator.geolocation.getCurrentPosition(p=>guardarUbic(id,{lat:p.coords.latitude,lon:p.coords.longitude}),()=>toast('No se pudo obtener la ubicación: revisa el permiso'),{enableHighAccuracy:true,timeout:15000})}
  else if(t.dataset.go){const g=t.dataset.go;cerrarSplash();st.tab=g.startsWith('rellenar:')?'rellenar':g.startsWith('cuentas')?'cuentas':g.startsWith('mensajes')?'mensajes':g;if(g==='mensajes-mios')st.msgF='mios';if(g==='mensajes-priv')st.msgF='priv';if(g.startsWith('rellenar:'))st.cab=g.split(':')[1];
    if(g==='cuentas-ayer'){const d=new Date();d.setDate(d.getDate()-1);if(st.dirtyReg)await saveReg();await loadFecha(isoD(d))}else renderAll()}
  else if(t.dataset.act==='notif-on'){Notification.requestPermission().then(()=>{softUpdate();avisosLlenado()})}
  else if(t.dataset.act==='notif-test'){notificar('Abonado Pinta Santos','Las notificaciones funcionan en este dispositivo','prueba')}
  else if(t.dataset.act==='usar-rec'){const b=bid(t.dataset.id);if(b){b.kgPrincipal=+t.dataset.v;st.dirtyCfg=true;renderMain();renderSave();toast('Cantidad aplicada: pulsa «Guardar receta y ajustes»')}}
  else if(t.dataset.act==='backup')backup();
  else if(t.dataset.act==='save-reg')saveReg();
  else if(t.dataset.act==='save-cfg')saveCfg();
  else if(t.dataset.act==='reset'){st.confirmReset=true;renderMain()}
  else if(t.dataset.act==='reset-no'){st.confirmReset=false;renderMain()}
  else if(t.dataset.act==='reset-yes'){st.cfg=clone(DEFAULT_CONFIG);st.dirtyCfg=true;st.confirmReset=false;renderAll();toast('Valores iniciales cargados: pulsa «Guardar receta y ajustes»')}});
$('#fecha').addEventListener('change',async e=>{const f=e.target.value;if(!f||f===st.fecha)return;if(st.dirtyReg)await saveReg();await loadFecha(f)});

/* ---------- Copia de seguridad ---------- */
async function backup(){toast('Preparando copia…');if(Store.mode==='fb'){try{const x=await NUBE.exportAll();await saveBlob(new Blob([JSON.stringify({app:'abonado-pinta-santos',v:2,exportado:new Date().toISOString(),ls:x.ls,adjuntos:x.adjuntos})],{type:'application/json'}),'abonado-copia-'+hoy()+'.json');toast('Copia descargada: '+x.dias+' días y '+Object.keys(x.adjuntos).length+' adjuntos')}catch(e){toast('Necesitas conexión para descargar la copia')}return}
  const ls={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('abono.'))ls[k]=localStorage.getItem(k)}}catch(e){}
  const data={app:'abonado-pinta-santos',v:2,exportado:new Date().toISOString(),ls,adjuntos:{}};
  const docs=[...(Store.lsGet('abono.msgs')||[]),...(Store.lsGet('abono.almacen')||[]),...(Store.lsGet('abono.diagnosticos')||[])];
  for(const m of docs)for(const a of m.adjuntos||[]){if(!a.local)continue;const bl=await Adj.idbGet(a.id).catch(()=>null);if(bl)data.adjuntos[a.id]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(bl)})}
  const regs=Object.keys(ls).filter(k=>k.startsWith('abono.reg.')).length;
  await saveBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),'abonado-copia-'+hoy()+'.json');
  toast('Copia descargada: '+regs+' días y '+Object.keys(data.adjuntos).length+' adjuntos')}
document.addEventListener('change',e=>{if(e.target.id!=='restore'||!e.target.files[0])return;const fr=new FileReader();fr.onload=async()=>{try{const d=JSON.parse(fr.result);if(d.app!=='abonado-pinta-santos')throw 0;
  if(d.ls){for(const[k,v]of Object.entries(d.ls))if(k.startsWith('abono.'))localStorage.setItem(k,v)}
  else{if(d.config)Store.lsSet('abono.config',d.config);for(const r of d.registros||[])if(r&&r.fecha)await Store.setReg(r.fecha,r);if(Array.isArray(d.cambios))Store.lsSet('abono.cambios',d.cambios);if(Array.isArray(d.mensajes))Store.lsSet('abono.msgs',d.mensajes)}
  for(const[id,u]of Object.entries(d.adjuntos||{})){try{const bl=await (await fetch(u)).blob();await Adj.idbPut(id,bl)}catch(_){}}
  if(window.NUBE&&NUBE.user){toast('Subiendo la copia a la nube…');await NUBE.subirLocal(true)}
  toast('Copia restaurada');setTimeout(()=>location.reload(),900)}catch(err){toast('Ese archivo no es una copia de esta app')}};fr.readAsText(e.target.files[0]);e.target.value=''});

/* ---------- Arranque ---------- */
(async function boot(){st.reg=ejemploReg(st.fecha);abrirSplash();renderAll();if(window.NUBE){await NUBE.ready();if(NUBE.user&&NUBE.user.nombre)st.autor=NUBE.user.nombre;{const ok=cabsVis().map(c=>c.id);if(ok.length&&!ok.includes(st.cab))st.cab=ok[0];if(st.finca&&!fincaAct())st.finca=null}renderSplash()}await Store.init();await Adj.init();
  try{const c=await Store.getConfig();if(c&&c.v===DEFAULT_CONFIG.v&&Array.isArray(c.bidones)){c.productos={...(c.productos||{}),...PRODUCTOS};c.alertas={...DEFAULT_CONFIG.alertas,...(c.alertas||{})};if(!c.ubic||c.ubic.lat==null||c.ubic.lon==null)c.ubic={...DEFAULT_CONFIG.ubic};c.stockMin=c.stockMin||{};c.saco=c.saco||{};c.riego=c.riego||{...DEFAULT_CONFIG.riego};if(c.medidaV!==2){c.medida='cm';c.medidaV=2}if(!Array.isArray(c.fincas))c.fincas=clone(DEFAULT_CONFIG.fincas);c.bidones.forEach(b=>{b.nombre=String(b.nombre).replace(/Bid[oó]n/gi,'Depósito')});st.cfg=c;st.savedCfg=clone(c)}}catch(e){}
  st.ready=true;if(!st.dirtyReg)await loadFecha(st.fecha);else renderAll();loadHist();loadOps();loadMsgs()})();
/* Con datos compartidos: al volver a la app, recarga lo que hayan guardado otros */
setInterval(()=>{if(!st.ready||document.hidden||st.fecha!==hoy())return;if(['rellenar','cuentas'].includes(st.tab))softUpdate();avisosLlenado()},300000);
let ultRec=Date.now();document.addEventListener('visibilitychange',()=>{if(document.hidden||Store.mode!=='fb'||!st.ready||Date.now()-ultRec<30000)return;ultRec=Date.now();
  if(!st.dirtyReg)loadFecha(st.fecha);st.hist=null;loadHist();loadOps();loadMsgs();
  if(!st.dirtyCfg)Store.getConfig().then(c=>{if(c&&Array.isArray(c.bidones)&&!st.dirtyCfg&&JSON.stringify(c)!==JSON.stringify(st.savedCfg)){c.productos={...(c.productos||{}),...PRODUCTOS};c.stockMin=c.stockMin||{};c.saco=c.saco||{};st.cfg=c;st.savedCfg=clone(c);renderMain()}}).catch(()=>{})});

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
