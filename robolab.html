<!doctype html><html lang="es"><head><meta charset=utf8><meta name="robots" content="noindex"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RoboLab XXI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: la mesa 3D ocupa toda la pantalla; encima flotan la ficha (arriba izq.), el monitor (derecha) y la barra + bandeja de piezas (abajo) */
:root{
  --bg:#dde4ea; --bg2:#c4cfd8;
  --panel:rgba(248,250,251,.9); --panel-solid:#f6f8fa; --line:#ccd5dd;
  --fg:#16202a; --muted:#5a6876; --chip:#e8edf1; --chip-hover:#dce4ea;
  --accent:#d9692a; --accent-soft:rgba(217,105,42,.14); --accent-fg:#ffffff;
  --ok:#1d8f4e; --warn:#b07800; --err:#cf3434;
  --shadow:0 10px 30px rgba(30,45,60,.16), 0 2px 6px rgba(30,45,60,.08);
  --f-display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a222a; --bg2:#0f1419; --panel:rgba(24,31,39,.9); --panel-solid:#1a222b; --line:#2e3a46;
  --fg:#e6ecf1; --muted:#95a3b0; --chip:#25303b; --chip-hover:#2e3b48;
  --accent:#f0874a; --accent-soft:rgba(240,135,74,.18); --accent-fg:#1a1009;
  --ok:#44c27a; --warn:#e2b23c; --err:#f06464; --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a222a; --bg2:#0f1419; --panel:rgba(24,31,39,.9); --panel-solid:#1a222b; --line:#2e3a46;
  --fg:#e6ecf1; --muted:#95a3b0; --chip:#25303b; --chip-hover:#2e3b48;
  --accent:#f0874a; --accent-soft:rgba(240,135,74,.18); --accent-fg:#1a1009;
  --ok:#44c27a; --warn:#e2b23c; --err:#f06464; --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 15%, var(--bg), var(--bg2)); color:var(--fg); font-family:var(--f-body); overflow:hidden; -webkit-tap-highlight-color:transparent}
#scene{position:fixed; inset:0; touch-action:none; outline:none}
#scene canvas{display:block}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,.tray-item:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.panel{background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow)}

/* cabecera */
#brand{position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); left:max(12px, env(safe-area-inset-left,0px)); display:flex; align-items:center; gap:10px; z-index:5; pointer-events:none}
#brand .logo{width:34px; height:34px; border-radius:9px; background:var(--fg); display:grid; place-items:center}
#brand .logo svg{width:22px; height:22px}
#brand b{font-family:var(--f-display); font-weight:700; font-size:19px; letter-spacing:.02em}
#brand b span{color:var(--accent)}
#brand small{display:block; font-size:11px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
#topright{position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); right:max(12px, env(safe-area-inset-right,0px)); display:flex; gap:8px; z-index:6; align-items:center}
.ghost{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:13px; font-weight:500; box-shadow:var(--shadow); backdrop-filter:blur(10px)}
.ghost:hover{background:var(--chip-hover)}
#saved{font-size:12px; color:var(--muted); font-family:var(--f-mono)}

/* ficha */
#card{position:fixed; top:calc(62px + env(safe-area-inset-top,0px)); left:max(12px, env(safe-area-inset-left,0px)); width:290px; max-height:calc(100% - 290px); overflow:auto; padding:16px; z-index:4}
#card .eyebrow,.aplan .eyebrow{font-family:var(--f-mono); font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; display:flex; justify-content:space-between}
#card h2{font-family:var(--f-display); font-size:30px; line-height:1.05; margin:6px 0 4px; font-weight:700; text-wrap:balance}
#card .sub{color:var(--muted); font-size:13px; margin:0 0 12px}
#card p{font-size:13px; line-height:1.5; margin:10px 0 0}
.specs{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.spec{background:var(--chip); border-radius:8px; padding:7px 9px}
.spec span{display:block; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
.spec b{font-family:var(--f-mono); font-size:13px; font-weight:600; font-variant-numeric:tabular-nums}
.pinlist{display:flex; flex-wrap:wrap; gap:4px; margin-top:10px}
.pinlist button{font-family:var(--f-mono); font-size:11px; border:1px solid transparent; background:var(--chip); border-radius:6px; padding:3px 6px; display:flex; gap:5px; align-items:center}
.pinlist button:hover{background:var(--chip-hover)}
.pinlist button.on{border-color:var(--accent)}
.dot{width:7px; height:7px; border-radius:50%; flex:none}
.legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; font-size:11px; color:var(--muted)}
.legend span{display:flex; align-items:center; gap:5px}
.steps{list-style:none; padding:0; margin:12px 0 0; display:grid; gap:10px; counter-reset:s}
.steps li{display:grid; grid-template-columns:24px 1fr; gap:8px; font-size:13px; line-height:1.45; counter-increment:s}
.steps li::before{content:counter(s); width:22px; height:22px; border-radius:6px; background:var(--accent-soft); color:var(--accent); font-family:var(--f-mono); font-weight:600; display:grid; place-items:center; font-size:12px}
#cardToggle{display:none}

/* barra de herramientas */
#bottom{position:fixed; left:0; right:0; bottom:0; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); padding-left:max(12px, env(safe-area-inset-left,0px)); padding-right:max(12px, env(safe-area-inset-right,0px)); display:flex; flex-direction:column; align-items:center; gap:8px; z-index:5; pointer-events:none}
#bottom > *{pointer-events:auto}
#tools{display:flex; align-items:center; gap:4px; padding:5px; border-radius:999px; max-width:100%; overflow-x:auto; scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tb{border:0; background:transparent; border-radius:999px; padding:7px 12px; font-size:13px; font-weight:500; white-space:nowrap; display:flex; align-items:center; gap:6px}
.tb:hover{background:var(--chip)}
.tb.on{background:var(--fg); color:var(--bg)}
.tb:disabled{opacity:.4; cursor:default}
.tb svg{width:16px; height:16px; flex:none}
.sep{width:1px; height:20px; background:var(--line); flex:none; margin:0 2px}
#play{background:var(--accent); color:var(--accent-fg); font-weight:600}
#play:hover{filter:brightness(1.06); background:var(--accent)}
#colors{display:flex; gap:3px; align-items:center; padding:0 4px}
.sw{width:18px; height:18px; border-radius:50%; border:2px solid var(--panel-solid); box-shadow:0 0 0 1px var(--line); padding:0; flex:none}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.sw.auto{background:conic-gradient(#d63b36 0 25%, #26282c 0 50%, #f2c230 0 75%, #2f9e57 0)}

/* guía */
#guide{width:min(1180px,100%); padding:9px 12px 10px; border-radius:14px; display:flex; flex-direction:column; gap:6px}
.ghead{display:flex; align-items:center; gap:8px}
#gTitle{flex:1; min-width:0; font-size:13.5px; color:var(--muted)}
#gTitle b{color:var(--fg); font-weight:600}
.gbtn{border:1px solid var(--line); background:var(--panel-solid); border-radius:8px; font-size:12px; padding:4px 10px; font-weight:500; white-space:nowrap}
.gbtn.primary{background:var(--accent); color:var(--accent-fg); border-color:transparent; font-weight:600}
#gNote{margin:0; font-size:12.5px; color:var(--muted); line-height:1.4}
#gSteps{display:flex; gap:6px; overflow-x:auto; scrollbar-width:thin; padding-bottom:2px}
#gSteps:empty{display:none}
.gstep{flex:none; display:grid; grid-template-columns:auto auto auto auto; grid-template-rows:auto auto; column-gap:6px; align-items:center; text-align:left; border:1px solid var(--line); background:var(--panel-solid); border-radius:10px; padding:6px 10px}
.gstep:hover{border-color:var(--accent)}
.gstep i{grid-row:1/3; font-style:normal; width:22px; height:22px; border-radius:6px; display:grid; place-items:center; font-family:var(--f-mono); font-size:12px; font-weight:600; background:var(--accent-soft); color:var(--accent)}
.gstep .gp,.gstep .gt{font-family:var(--f-mono); font-weight:600; font-size:13px}
.gstep .gt{color:var(--accent)}
.gstep .ar{color:var(--muted)}
.gstep small{grid-column:2/5; font-size:10.5px; color:var(--muted)}
.gstep.done{opacity:.75} .gstep.done i{background:color-mix(in srgb, var(--ok) 18%, transparent); color:var(--ok)} .gstep.done .gt{color:var(--ok)}
.gstep.opt{border-style:dashed}
#guide.min #gSteps,#guide.min #gNote,#guide.min #gAll{display:none}
#tray.min #items{display:none}
#tray.min #tabrow{margin-bottom:0}

/* bandeja */
#tray{width:min(1180px,100%); padding:8px 10px 10px; border-radius:16px}
#tabrow{display:flex; gap:8px; align-items:center; margin-bottom:6px}
#tabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0}
#tabs::-webkit-scrollbar{display:none}
#search{flex:none; width:170px; border:1px solid var(--line); background:var(--panel-solid); color:var(--fg); border-radius:8px; padding:5px 9px; font:inherit; font-size:12.5px}
#search:focus{outline:2px solid var(--accent); outline-offset:0}
.count{font-family:var(--f-mono); font-size:10px; opacity:.6; margin-left:3px}
#tabs button{white-space:nowrap; flex:none; border:0; background:transparent; font-size:12px; font-weight:600; padding:4px 10px; border-radius:7px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
#tabs button.on{background:var(--chip); color:var(--fg)}
#tabs .hint{margin-left:auto; font-size:12px; color:var(--muted); align-self:center}
#items{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:thin}
.tray-item{flex:none; width:112px; border:1px solid var(--line); background:var(--panel-solid); border-radius:11px; padding:6px 6px 7px; text-align:center; display:flex; flex-direction:column; gap:3px; align-items:center}
.tray-item:hover{border-color:var(--accent); transform:translateY(-2px)}
.tray-item{transition:transform .15s, border-color .15s}
.tray-item img{width:100px; height:62px; object-fit:contain}
.tray-item b{font-size:12px; font-weight:600; line-height:1.2}
.tray-item small{font-size:10.5px; color:var(--muted); font-family:var(--f-mono)}
.tray-item.example{width:180px; text-align:left; align-items:stretch; padding:10px}
.tray-item.example small{font-family:var(--f-body); font-size:11.5px; line-height:1.35}

/* monitor */
#monitor{position:fixed; top:calc(62px + env(safe-area-inset-top,0px)); right:max(12px, env(safe-area-inset-right,0px)); width:340px; max-height:calc(100% - 300px); display:flex; flex-direction:column; z-index:4; overflow:hidden}
#monitor header{display:flex; align-items:center; gap:6px; padding:10px 10px 8px 14px; border-bottom:1px solid var(--line)}
#monitor header h3{font-family:var(--f-display); font-size:16px; margin:0; flex:1}
#monitor .mtabs{display:flex; gap:2px; background:var(--chip); padding:2px; border-radius:8px}
#monitor .mtabs button{border:0; background:transparent; font-size:12px; padding:4px 9px; border-radius:6px; font-weight:500}
#monitor .mtabs button.on{background:var(--panel-solid); box-shadow:0 1px 2px rgba(0,0,0,.12)}
#mclose{border:0; background:transparent; font-size:18px; width:28px; height:28px; border-radius:7px; color:var(--muted)}
#mbody{overflow:auto; padding:10px 12px 12px; min-height:0}
.status{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-bottom:8px}
.status .pulse{width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 0 var(--ok); animation:pulse 1.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}}
.item{display:grid; grid-template-columns:4px 1fr; gap:10px; padding:9px 0; border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .bar{border-radius:4px; background:var(--muted)}
.item.ok .bar{background:var(--ok)} .item.warn .bar{background:var(--warn)} .item.err .bar{background:var(--err)} .item.idle .bar,.item.note .bar{background:var(--line)}
.item b{font-size:13px; display:block}
.item span{font-size:12.5px; color:var(--muted); line-height:1.45; display:block; margin-top:2px}
.item .read{font-family:var(--f-mono); color:var(--fg); font-size:12.5px; font-variant-numeric:tabular-nums}
pre.code{font-family:var(--f-mono); font-size:11.5px; line-height:1.5; background:var(--chip); border-radius:10px; padding:10px 12px; overflow-x:auto; margin:6px 0 12px; white-space:pre}
.codehead{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:600}
.codehead button{border:1px solid var(--line); background:var(--panel-solid); border-radius:7px; font-size:12px; padding:3px 9px}

/* tooltip y avisos */
#tip{position:fixed; z-index:8; pointer-events:none; background:var(--fg); color:var(--bg); font-size:12px; padding:5px 8px; border-radius:7px; transform:translate(-50%, calc(-100% - 14px)); white-space:nowrap; font-family:var(--f-mono)}
#tip i{font-style:normal; opacity:.7; font-family:var(--f-body)}
#toast{position:fixed; left:50%; top:calc(16px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:9; background:var(--fg); color:var(--bg); padding:8px 14px; border-radius:10px; font-size:13px; box-shadow:var(--shadow); max-width:calc(100% - 32px); text-align:center}
#confirm{position:fixed; inset:0; z-index:20; display:grid; place-items:center; background:rgba(10,15,20,.35); padding:16px}
#confirm .panel{padding:18px; max-width:320px; background:var(--panel-solid)}
#confirm h4{margin:0 0 6px; font-family:var(--f-display); font-size:18px}
#confirm p{margin:0 0 14px; font-size:13.5px; color:var(--muted)}
#confirm .row{display:flex; gap:8px; justify-content:flex-end}
#confirm .danger{background:var(--err); color:#fff; border-color:transparent}
#loading{position:fixed; inset:0; display:grid; place-items:center; z-index:30; font-family:var(--f-display); font-size:18px; color:var(--muted); background:var(--bg)}

/* asistente */
#btnAsk{background:var(--accent); color:var(--accent-fg); border-color:transparent; font-weight:600}
#asst{position:fixed; inset:0; z-index:15; background:rgba(10,15,20,.38); display:grid; place-items:center; padding:16px}
#asst .sheet{width:min(560px,100%); max-height:calc(100% - 24px); overflow:auto; padding:18px 18px 16px; background:var(--panel-solid)}
#asst header{display:flex; align-items:center; gap:8px}
#asst h3{font-family:var(--f-display); font-size:22px; margin:0; flex:1}
#aClose{border:0; background:var(--chip); width:32px; height:32px; border-radius:8px; font-size:18px}
#asst .lead{margin:6px 0 12px; color:var(--muted); font-size:13.5px; line-height:1.45}
#aForm{display:flex; gap:8px}
#aIn{flex:1; min-width:0; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:10px; padding:11px 12px; font:inherit; font-size:15px}
#aIn:focus{outline:2px solid var(--accent); outline-offset:0}
.gbtn.big{font-size:14px; padding:10px 16px; border-radius:10px}
#aSrc{margin:6px 0 0; font-size:11.5px; color:var(--muted)}
#aIdeas{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px}
#aIdeas button{border:1px solid var(--line); background:var(--chip); border-radius:999px; padding:5px 11px; font-size:12.5px}
#aIdeas button:hover{border-color:var(--accent)}
#aOut:empty{display:none}
#aOut{margin-top:12px; border-top:1px solid var(--line); padding-top:12px}
#aStatus{display:flex; align-items:center; gap:10px; font-size:14px}
#aStatus b{flex:1; font-weight:500}
.spin{width:16px; height:16px; border-radius:50%; border:2px solid var(--accent-soft); border-top-color:var(--accent); animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.aerr{color:var(--muted); font-size:13px; background:var(--chip); border-radius:8px; padding:8px 10px; margin:0 0 8px}
.aplan h4{font-family:var(--f-display); font-size:21px; margin:4px 0 6px}
.aplan h5{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 6px}
.aplan p{font-size:14px; line-height:1.5; margin:0 0 6px}
ul.mat,ul.tips{margin:0; padding-left:18px; font-size:13.5px; line-height:1.6}
ul.mat li.ext{color:var(--muted)}
ul.mat.cols{columns:2; column-gap:20px}
.arow{margin-top:14px}
.small{font-size:12.5px; color:var(--muted); line-height:1.45}
/* montaje */
#build{display:none; width:min(760px,100%); padding:12px 14px 12px; border-radius:16px; flex-direction:column; gap:8px; max-height:46vh}
body.building #build{display:flex}
body.building #guide, body.building #tools, body.building #tray, body.building #card, body.building #monitor, body.building #btnClear, body.building #btnMonitor, body.building #btnBig{display:none!important}
body.clean #guide, body.clean #tools, body.clean #tray, body.clean #card, body.clean #monitor{display:none!important}
.bhead{display:flex; align-items:center; gap:10px}
#bStep{font-family:var(--f-mono); font-size:12px; color:var(--muted)}
#bTitle{flex:1; margin:0; font-family:var(--f-display); font-size:19px; display:flex; align-items:center; gap:8px}
.bar2{height:4px; border-radius:4px; background:var(--chip); overflow:hidden}
#bProg{height:100%; background:var(--accent); transition:width .3s}
#bBody{overflow:auto; min-height:0}
#bBody p{margin:0 0 6px; font-size:14px; line-height:1.45}
.cdot{width:14px; height:14px; border-radius:50%; display:inline-block; box-shadow:0 0 0 1px var(--line)}
.conn{display:flex; align-items:center; gap:10px; margin:2px 0 8px}
.conn .end{background:var(--chip); border-radius:10px; padding:6px 12px; display:flex; flex-direction:column; min-width:0}
.conn .end small{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.conn .end b{font-family:var(--f-mono); font-size:20px}
.conn .line{flex:1; height:5px; border-radius:5px; background:var(--c); min-width:24px; box-shadow:0 0 0 1px var(--line)}
.warnline{font-size:12.5px!important; background:color-mix(in srgb, var(--warn) 14%, transparent); border-radius:8px; padding:6px 9px}
.olist{margin:0 0 6px; padding-left:18px}
#build pre.code{max-height:160px; overflow:auto}
.brow{display:flex; gap:8px; justify-content:flex-end}
.brow #bExit{margin-right:auto}
.pintag{position:fixed; z-index:6; pointer-events:none; transform:translate(-50%, calc(-100% - 16px)); background:var(--accent); color:var(--accent-fg); font-family:var(--f-mono); font-weight:600; font-size:14px; padding:3px 8px 4px; border-radius:7px; text-align:center; line-height:1.1; box-shadow:var(--shadow)}
.pintag small{display:block; font-family:var(--f-body); font-weight:500; font-size:10px; opacity:.85}
#tagB{background:#2f8ae0; color:#fff}

@media (max-width:760px){
  #topright .ghost{padding:7px 10px; font-size:12.5px}
  #btnClear,#btnMonitor{display:none}
  #brand > div{display:none}
  #asst{place-items:end center; padding:0}
  #asst .sheet{border-radius:18px 18px 0 0; max-height:88%; padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  #build{max-height:52vh; padding:10px 12px}
  #bTitle{font-size:17px}
  .conn .end b{font-size:17px}
  ul.mat.cols{columns:1}
  #brand small{display:none}
  #card{width:auto; right:max(12px, env(safe-area-inset-right,0px)); top:calc(58px + env(safe-area-inset-top,0px)); padding:10px 12px; max-height:45%}
  #card h2{font-size:21px; margin:2px 0}
  #card .eyebrow{padding-right:52px}
  #card.collapsed .more{display:none}
  #cardToggle{display:block; position:absolute; top:8px; right:8px; border:0; background:var(--chip); border-radius:7px; font-size:12px; padding:3px 8px}

function parsePins(str){return str.trim().split(/\s+/).map(t=>{const i=t.lastIndexOf(':'); return [t.slice(0,i),t.slice(i+1)]})}
function mod(o){
  const specs=o.rows2||[['x',0,o.pz??(o.d/2-2.5),o.pins,o.ldir]];
  const roles=[], rows=[];
  for(const [axis,cx,cz,str,ldir] of specs){
    const pr=parsePins(str); roles.push(...pr); const n=pr.length, off=-(n-1)*P/2;
    const ld=ldir===undefined?(axis==='x'?[0,cz>0?-1:1]:[cx>0?-1:1,0]):ldir;
    rows.push(axis==='x'?rx(cx+off,cz,pr.map(r=>r[0]),o.style||'male',ld):rz(cx,cz+off,pr.map(r=>r[0]),o.style||'male',ld));
  }
  return def({kind:'comp',gen:true,color:'#1d58b8',...o,roles,rows,build(c){buildDecor(c,o.decor||[]); o.extra?.(c)}});
}
function buildDecor(c,list){

    if(t==='b'){const [w,h,d,x,z,y=0,col=0x151515,opt,r]=a; m=c.B(w,h,d,mc(col,opt),x,z,y); ref=r}
    else if(t==='c'){const [r,h,x,z,y=0,col=0x151515,opt,rf]=a; m=c.C(r,h,mc(col,opt),x,z,y,32); ref=rf}
    else if(t==='cx'||t==='cz'){const [r,len,x,z,y=0,col=0x151515,opt]=a; m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,28),mc(col,opt)); if(t==='cx') m.rotation.z=Math.PI/2; else m.rotation.x=Math.PI/2; m.position.set(x,c.top+y+r,z); c.g.add(m)}
    else if(t==='dome'){const [r,x,z,y=0,col=0xf2f2ee,opt]=a; m=new THREE.Mesh(new THREE.SphereGeometry(r,32,16,0,Math.PI*2,0,Math.PI/2),mc(col,opt)); m.position.set(x,c.top+y,z); c.g.add(m)}
    else if(t==='led'){const [x,z,col=0xff3030]=a; const mat=std(col,.3,0,{emissive:col,emissiveIntensity:0}); m=c.B(1.6,.7,.9,mat,x,z); (c.part.refs.leds??=[]).push(mat)}
    else if(t==='scr'){const [w,d,x,z,y,kind]=a; const cv=document.createElement('canvas'); cv.width=256; cv.height=Math.max(32,Math.round(256*d/w)); const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace;
      const s=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshBasicMaterial({map:tex,toneMapped:false})); s.rotation.x=-Math.PI/2; s.position.set(x,c.top+y+.02,z); c.g.add(s); c.part.refs.scr={cv,tex,kind}; drawScreen(c.part,false,0)}
    else if(t==='px'||t==='ring'){const [n,p1,p2,y=0]=a; const mats=[]; for(let i=0;i<n;i++){const mat=std(0x2a2a2a,.4,0,{emissive:0x000000}); let x,z; if(t==='px'){x=p1+i*p2; z=-3} else {const ang=i/n*Math.PI*2; x=Math.cos(ang)*p1; z=Math.sin(ang)*p1+p2}
        c.B(5,1.6,5,MAT.white,x,z,y); c.B(3.2,.3,3.2,mat,x,z,y+1.6); mats.push(mat)} c.part.refs.px=mats}
    else if(t==='spin'){const [r,x,z,y,axis='y',col=0xf0efe8]=a; const g=new THREE.Group(); g.position.set(x,c.top+y,z); c.g.add(g);
      const disc=new THREE.Mesh(new THREE.CylinderGeometry(r,r,2.4,32),mc(col)); if(axis==='x') disc.rotation.z=Math.PI/2; disc.castShadow=true; g.add(disc);
      const mk=new THREE.Mesh(new THREE.BoxGeometry(axis==='x'?2.6:r*1.6,axis==='x'?r*1.6:2.6,1.2),mc(0xd9692a)); g.add(mk); c.part.refs.spin=g; c.part.refs.spinAxis=axis}
    else if(t==='fan'){const [r,x,z,y]=a; const g=new THREE.Group(); g.position.set(x,c.top+y,z); c.g.add(g); g.add(new THREE.Mesh(new THREE.CylinderGeometry(r*.32,r*.32,3,24),mc(0x222222)));
      for(let i=0;i<7;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(r*.7,.6,r*.32),mc(0x2b2b2b)); b.position.set(Math.cos(i/7*Math.PI*2)*r*.6,0,Math.sin(i/7*Math.PI*2)*r*.6); b.rotation.y=-i/7*Math.PI*2; b.rotation.x=.4; g.add(b)} c.part.refs.spin=g; c.part.refs.spinAxis='y'}

  }

function drawScreen(part,on,t){
  const s=part.refs.scr; if(!s) return; const g=s.cv.getContext('2d'), W=s.cv.width, H=s.cv.height;
  g.fillStyle='#050608'; g.fillRect(0,0,W,H);

  if(s.kind==='seg'&&on){ g.fillStyle='#ff3b30'; g.font=`700 ${H*.85}px "Chakra Petch", sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(String(Math.floor(t)%10000).padStart(4,'0'),W/2,H*.55); g.textAlign='left'}
  if(s.kind==='mat'){ const heart=[0x00,0x66,0xff,0xff,0xff,0x7e,0x3c,0x18]; const c=W/8; const shift=Math.floor(t*3)%16;
    for(let r=0;r<8;r++) for(let k=0;k<8;k++){ const bit=on&&((heart[r]>>(7-((k+shift)%8)))&1); g.fillStyle=bit?'#ff3a2a':'#2a0d0b'; g.beginPath(); g.arc(k*c+c/2,r*(H/8)+H/16,c*.36,0,7); g.fill() } }
  if(s.kind==='tft'&&on){ const gr=g.createLinearGradient(0,0,W,H); gr.addColorStop(0,'#1d4ed8'); gr.addColorStop(1,'#d9692a'); g.fillStyle=gr; g.fillRect(0,0,W,H);
    g.fillStyle='#fff'; g.font=`700 ${W*.14}px "Chakra Petch", sans-serif`; g.fillText('Hola!',W*.1,H*.25); g.font=`600 ${W*.07}px "IBM Plex Mono", monospace`; g.fillText('RoboLab XXI',W*.1,H*.4);
    g.fillStyle='#ffd23f'; g.beginPath(); g.arc(W*.5+Math.sin(t*2)*W*.3,H*.7,W*.08,0,7); g.fill() }
  s.tex.needsUpdate=true;
}

  const skin=mc(0xd8c49a); cyl(1.25,6.4,skin,0); cyl(1.45,1.3,skin,-3); cyl(1.45,1.3,skin,3);
  [-2.2,-1,.2].forEach((x,i)=>cyl(i?1.32:1.47,.55,mc(bands[i]),x)); cyl(1.47,.55,mc(0xc9a13a,'m'),2.4);

function cablePairs(c,cols,thick=.55){
  const pins=c.part.pins, n=pins.length/2;
  for(let i=0;i<n;i++){const a=pins[i].local, b=pins[i+n].local; const dz=Math.sign(b.z-a.z);
    const p0=new THREE.Vector3(a.x,4.2,a.z+dz*1.4), p3=new THREE.Vector3(b.x,4.2,b.z-dz*1.4), L=p0.distanceTo(p3);
    const cv=new THREE.CubicBezierCurve3(p0,p0.clone().add(new THREE.Vector3(0,L*.12,dz*L*.3)),p3.clone().add(new THREE.Vector3(0,L*.12,-dz*L*.3)),p3);
    const t=new THREE.Mesh(new THREE.TubeGeometry(cv,24,thick,8),mc(cols[i%cols.length])); t.castShadow=true; c.g.add(t)}
}

const texCache={};
function pcbTexture(d){
  if(texCache[d.id]) return texCache[d.id];
  const S=12, W=Math.round(d.w*S), H=Math.round(d.d*S);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d');
  const px=(x,z)=>[(x+d.w/2)*S,(z+d.d/2)*S];
  g.fillStyle=d.color; g.fillRect(0,0,W,H);
  // pistas de cobre bajo la máscara
  const R=rng(hashStr(d.id)); if(d.bb) g.globalAlpha=0; g.strokeStyle=shade(d.color,d.kind==='comp'&&d.color==='#f1efe8'?-.06:.13); g.lineWidth=.32*S; g.lineCap='round'; g.lineJoin='round';
  const n=Math.round(d.w*d.d/90);
  for(let i=0;i<n;i++){let x=R()*W,y=R()*H; g.beginPath(); g.moveTo(x,y); for(let k=0;k<3;k++){const len=(3+R()*12)*S, a=Math.floor(R()*8)*Math.PI/4; x+=Math.cos(a)*len; y+=Math.sin(a)*len; g.lineTo(x,y)} g.stroke();
    g.fillStyle=shade(d.color,.2); g.beginPath(); g.arc(x,y,.45*S,0,7); g.fill()}
  g.globalAlpha=1; const silk=d.silkColor||'#f3f5f2';
  if(d.bb){g.fillStyle='#e3e0d6'; g.fillRect(0,0,W,H); g.strokeStyle='#d63b36'; g.lineWidth=.3*S; g.beginPath(); g.moveTo(3*S,(d.d/2-26)*S); g.lineTo(W-3*S,(d.d/2-26)*S); g.moveTo(3*S,(d.d/2+26)*S); g.lineTo(W-3*S,(d.d/2+26)*S); g.stroke(); g.strokeStyle='#2f6fd6'; g.beginPath(); g.moveTo(3*S,(d.d/2-19.6)*S); g.lineTo(W-3*S,(d.d/2-19.6)*S); g.moveTo(3*S,(d.d/2+19.6)*S); g.lineTo(W-3*S,(d.d/2+19.6)*S); g.stroke()}
  else { g.strokeStyle=silk; g.globalAlpha=.55; g.lineWidth=.22*S; g.strokeRect(1*S,1*S,W-2*S,H-2*S); g.globalAlpha=1; }
  // agujeros de montaje
  for(const [x,z] of d.holes||[]){const [a,b]=px(x,z); g.fillStyle='#d8b75c'; g.beginPath(); g.arc(a,b,3*S,0,7); g.fill(); g.fillStyle='#2a2a2a'; g.beginPath(); g.arc(a,b,1.4*S,0,7); g.fill()}
  // pads y rótulos
  const T=(txt,x,z,size,o={})=>{const [a,b]=px(x,z); g.save(); g.translate(a,b); if(o.rot) g.rotate(o.rot); g.fillStyle=o.color||silk; g.font=`${o.weight||600} ${size*S}px ${o.weight===700?'"Chakra Petch"':'"IBM Plex Mono"'}, monospace`; g.textAlign=o.align||'center'; g.textBaseline='middle'; g.fillText(txt,0,0); g.restore()};
  for(const row of d.rows){
    for(const p of row.pins){
      if(row.style==='hole'){const [a,b]=px(p.x,p.z); g.fillStyle='#3a3a3a'; g.fillRect(a-.55*S,b-.55*S,1.1*S,1.1*S)}
      if(row.style==='pad'){const [a,b]=px(p.x,p.z); g.fillStyle='#d9b45a'; g.beginPath(); g.arc(a,b,.95*S,0,7); g.fill(); g.fillStyle='#151515'; g.beginPath(); g.arc(a,b,.45*S,0,7); g.fill()}
      if(row.ldir){const off=row.style==='pad'?1.4:1.75; const [dx,dz]=row.ldir; const rot=Math.atan2(dz,dx);
        T(p.label,p.x+dx*off,p.z+dz*off,d.labelSize||1.05,{rot:Math.abs(dz)>0?rot:(dx<0?0:0),align:dx<0?'right':'left'});}
    }
  }
  d.silk?.(T);
  const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=8;
  texCache[d.id]=tex; return tex;
}

function buildPart(type,id){
  const d=DEFS[type]; const root=new THREE.Group(); const body=new THREE.Group(); root.add(body);
  const top=d.raise+(d.noPcb?0:d.thick);
  const part={id:id??nextId++,type,def:d,root,body,pins:[],refs:{},rot:0,sim:{}};
  if(!d.noPcb){
    const pcb=new THREE.Mesh(new THREE.BoxGeometry(d.w,d.thick,d.d),std(shade(d.color,-.15),.6)); pcb.position.y=d.raise+d.thick/2; pcb.castShadow=pcb.receiveShadow=true; body.add(pcb);
    const pl=new THREE.Mesh(new THREE.PlaneGeometry(d.w,d.d),new THREE.MeshStandardMaterial({map:pcbTexture(d),roughness:.5,metalness:.08})); pl.rotation.x=-Math.PI/2; pl.position.y=top+.015; pl.receiveShadow=true; body.add(pl);
  }
  const legs=[],holes=[],mpins=[];
  for(const row of d.rows){
    const n=row.pins.length, len=n*P, mid=(row.pins[0][row.axis]+row.pins[n-1][row.axis])/2, fixed=row.axis==='x'?row.pins[0].z:row.pins[0].x;
    const blk=(h,y)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(row.axis==='x'?len:P,h,row.axis==='x'?P:len),MAT.header); m.position.set(row.axis==='x'?mid:fixed,y,row.axis==='x'?fixed:mid); m.castShadow=m.receiveShadow=true; body.add(m)};
    let yc=top;
    if(row.style==='pad'){ if(d.raise>0){blk(2.5,d.raise-1.25); row.pins.forEach(p=>legs.push([p.x,d.raise/2-1,p.z,d.raise+2]));} yc=top+.02; }
    if(row.style==='female'){ blk(8.5,top+4.25); row.pins.forEach(p=>holes.push([p.x,top+8.5+.01,p.z])); yc=top+8.5; }
    if(row.style==='male'){ blk(2.5,top+1.25); row.pins.forEach(p=>mpins.push([p.x,top+2.5+3-.5,p.z])); yc=top+8; }
    if(row.style==='hole') yc=top+.02;
    for(const p of row.pins){ const i=part.pins.length, role=d.roles?.[i]?.[1];
      let type=d.kind==='board'?pinType(p.label):d.bb?'bb':'comp';
      if(role) type=('v5'.includes(role))?'p5':role==='3'?'p3':('g0'.includes(role))?'gnd':'comp';
      else if(d.kind==='comp'&&!d.bb){ if(/^(GND|−)$/.test(p.label)&&p.label!=='−'||p.label==='GND') type='gnd'; else if(/^(VCC|5V|\+5V|3\.3V|VIN)$/.test(p.label)) type='p5'; }
      part.pins.push({label:p.label,type,desc:role?ROLE_DESC[role]:null,local:new THREE.Vector3(p.x,yc,p.z),idx:i,style:row.style}); }
  }
  if(legs.length) body.add(inst(instGeo.leg,MAT.gold,legs));
  if(holes.length) body.add(inst(instGeo.hole,MAT.hole,holes));
  if(mpins.length) body.add(inst(instGeo.mpin,MAT.gold,mpins));
  const c={g:body,top,def:d,part,
    B(w,h,dd,mat,x,z,y=0,ry=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,dd),mat); m.position.set(x,top+y+h/2,z); m.rotation.y=ry; m.castShadow=m.receiveShadow=true; body.add(m); return m},
    C(r,h,mat,x,z,y=0,seg=24){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),mat); m.position.set(x,top+y+h/2,z); m.castShadow=m.receiveShadow=true; body.add(m); return m},
    male(list){for(const [x,z] of list){this.B(P,2.5,P,MAT.header,x,z); this.B(.64,6,.64,MAT.gold,x,z,2.5)}},
    led(x,z,mat){this.B(1.6,.7,.9,mat,x,z)}};
  d.build?.(c);
  // halo de selección
  const halo=new THREE.Mesh(new THREE.PlaneGeometry(d.w+8,d.d+8),new THREE.MeshBasicMaterial({color:0xd9692a,transparent:true,opacity:.16,depthWrite:false}));
  halo.rotation.x=-Math.PI/2; halo.position.y=.3; halo.visible=false; root.add(halo); part.halo=halo;
  root.traverse(o=>{if(o.isMesh) o.userData.part=part});
  return part;
}

const thumbs={};
let TH=null;
function thumbFor(id){
  if(thumbs[id]) return thumbs[id];
  try{
    if(!TH){ const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true}); r.setSize(200,124); r.setPixelRatio(1);
      r.toneMapping=THREE.ACESFilmicToneMapping; const pm=new THREE.PMREMGenerator(r);
      const s=new THREE.Scene(); s.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
      s.add(new THREE.HemisphereLight(0xffffff,0x889,.6)); const dl=new THREE.DirectionalLight(0xffffff,1.4); dl.position.set(1,3,2); s.add(dl);
      TH={r,s,cam:new THREE.PerspectiveCamera(30,200/124,.1,2000)} }
    const {r,s,cam}=TH;
    for(const d of [DEFS[id]]){
      const p=buildPart(d.id,-1); s.add(p.root);
      const box=new THREE.Box3(); p.body.traverse(o=>{if(o.isMesh&&!o.isInstancedMesh) box.expandByObject(o)}); const sz=box.getSize(new THREE.Vector3()), ctr=box.getCenter(new THREE.Vector3());
      const dist=Math.max(sz.x/1.55,sz.z*1.15,sz.y*1.3)/Math.tan(15*Math.PI/180)*.78;
      cam.position.copy(ctr).add(new THREE.Vector3(0,.95,.75).normalize().multiplyScalar(dist)); cam.lookAt(ctr);
      r.render(s,cam); thumbs[d.id]=r.domElement.toDataURL('image/png'); s.remove(p.root);
    }
  }catch(e){console.warn('miniaturas',e); thumbs[id]='none'}
  return thumbs[id];
}
let thumbJob=0;
function fillThumbs(){ const job=++thumbJob; const imgs=[...document.querySelectorAll('#items img[data-id]')];
  const step=()=>{ if(job!==thumbJob) return; const t0=performance.now(); while(imgs.length&&performance.now()-t0<30){const im=imgs.shift(); const u=thumbFor(im.dataset.id); if(u&&u!=='none') im.src=u; im.removeAttribute('data-id')} if(imgs.length) setTimeout(step,16) }; step() }

let mode='move', selected=null, selWire=null, pending=null, wireColor='auto', hoverPin=null;
function footprint(p){const r=p.rot%2; return {w:(r?p.def.d:p.def.w)+10,d:(r?p.def.w:p.def.d)+10}}
function findSpot(type){
  const d=DEFS[type];
  for(let ring=0;ring<30;ring++){
    const cand=ring===0?[[0,0]]:[]; for(let a=0;a<ring*8;a++){const t=a/(ring*8)*Math.PI*2; cand.push([Math.cos(t)*ring*22,Math.sin(t)*ring*16])}
    for(const [x,z] of cand){
      if(Math.abs(x)+d.w/2>MAT_W/2-6||Math.abs(z)+d.d/2>MAT_D/2-6) continue;
      const ok=parts.every(p=>{const f=footprint(p); return Math.abs(p.root.position.x-x)>(f.w+d.w)/2||Math.abs(p.root.position.z-z)>(f.d+d.d)/2});
      if(ok) return [x,z];
    }
  }
  return [0,0];
}
function addPart(type,x,z,rot=0,id){
  const p=buildPart(type,id); if(id&&id>=nextId) nextId=id+1;
  p.root.position.set(x,0,z); p.rot=rot; p.root.rotation.y=-rot*Math.PI/2; scene.add(p.root); parts.push(p); return p;
}
function addPartUser(type){
  const [x,z]=findSpot(type); const p=addPart(type,x,z); select(p);
  p.root.position.y=40; p.drop=1; changed();
  setTimeout(()=>{ const v=p.root.position.clone().setY(0).project(camera), f=freeRect(), x=(v.x+1)/2*f.W, y=(1-v.y)/2*f.H; if(x<f.l+30||x>f.r-30||y<f.t+30||y>f.b-30) frameAll(topView) },450);
  toast(parts.length===2&&mode==='move'?'Ahora pulsa «Cablear» y toca dos pines para unirlos':`${p.def.name} en la mesa`);
}
function removePart(p){
  for(const w of wires.filter(w=>w.a.part===p||w.b.part===p)) removeWire(w,true);
  scene.remove(p.root); parts.splice(parts.indexOf(p),1); if(selected===p) select(null); changed();
}
function pinWorld(pin,part,out=new THREE.Vector3()){part.root.updateMatrixWorld(); return out.copy(pin.local).applyMatrix4(part.root.matrixWorld)}

/* ---------- cables ---------- */
const WIRE_COLORS={rojo:'#d63b36',negro:'#26282c',amarillo:'#f2c230',verde:'#2f9e57',azul:'#2f6fd6',naranja:'#ee7d26',blanco:'#eceae4',morado:'#8b56d1'};
const SIGNAL_CYCLE=['amarillo','verde','azul','naranja','morado','blanco'];
const wireMats={}; const wmat=c=>wireMats[c]??=std(WIRE_COLORS[c],.42,0);
const housingGeo=new THREE.BoxGeometry(2.3,7,2.3);
function wireCurve(a,b){
  const p0=a.clone().addScaledVector(UP,7), p3=b.clone().addScaledVector(UP,7);
  const dist=p0.distanceTo(p3), h=6+dist*.32;
  const dir=p3.clone().sub(p0).setY(0).normalize().multiplyScalar(dist*.12);
  return new THREE.CubicBezierCurve3(p0,p0.clone().addScaledVector(UP,h).add(dir),p3.clone().addScaledVector(UP,h).sub(dir),p3);
}
function buildWireMesh(w){
  if(w.group){scene.remove(w.group); w.group.traverse(o=>o.geometry&&o.geometry!==housingGeo&&o.geometry.dispose())}
  const a=pinWorld(w.a.pin,w.a.part), b=pinWorld(w.b.pin,w.b.part);
  const g=new THREE.Group(); const m=w.sel?selMat(w.color):wmat(w.color);
  const tube=new THREE.Mesh(new THREE.TubeGeometry(wireCurve(a,b),56,.78,8),m); tube.castShadow=true; tube.userData.wire=w; g.add(tube);
  for(const p of [a,b]){const h=new THREE.Mesh(housingGeo,MAT.black); h.position.copy(p).addScaledVector(UP,3.5); h.castShadow=true; h.userData.wire=w; g.add(h)}
  w.group=g; w.tube=tube; g.visible=!w.hidden; scene.add(g);
}
const selMats={}; const selMat=c=>selMats[c]??=std(WIRE_COLORS[c],.3,0,{emissive:0xd9692a,emissiveIntensity:.55});
let cycle=0;
function addWire(pa,pb,color,silent){
  if(pa.part===pb.part&&pa.pin===pb.pin) return;
  if(wires.some(w=>(w.a.pin===pa.pin&&w.b.pin===pb.pin)||(w.a.pin===pb.pin&&w.b.pin===pa.pin))){if(!silent) toast('Esos dos pines ya están unidos'); return}
  if(!color){ if(wireColor!=='auto') color=wireColor; else { const t=[pa.pin.type,pb.pin.type]; color=t.includes('gnd')?'negro':(t.includes('p5')||t.includes('p3'))?'rojo':SIGNAL_CYCLE[cycle++%SIGNAL_CYCLE.length]; } }
  const w={a:pa,b:pb,color}; wires.push(w); buildWireMesh(w);
  if(!silent){changed(); toast(`Cable: ${pa.part.def.name} ${pa.pin.label} → ${pb.part.def.name} ${pb.pin.label}`)}
  return w;
}
function removeWire(w,silent){scene.remove(w.group); wires.splice(wires.indexOf(w),1); if(selWire===w) selWire=null; if(!silent) changed()}
function refreshWires(part){for(const w of wires) if(!part||w.a.part===part||w.b.part===part) buildWireMesh(w)}

const ray=new THREE.Raycaster(); const ndc=new THREE.Vector2(); const plane=new THREE.Plane(UP,0); const tmp=new THREE.Vector3();
function setNdc(e){const r=renderer.domElement.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(ndc,camera); return r}
function pinAt(e,thr){
  const r=renderer.domElement.getBoundingClientRect(); let best=null,bd=thr*thr;
  for(const part of parts){ part.root.updateMatrixWorld();
    for(const pin of part.pins){ tmp.copy(pin.local).applyMatrix4(part.root.matrixWorld).project(camera);
      if(tmp.z>1) continue; const sx=(tmp.x+1)/2*r.width+r.left, sy=(1-tmp.y)/2*r.height+r.top; const dd=(sx-e.clientX)**2+(sy-e.clientY)**2;
      if(dd<bd){bd=dd;best={part,pin}} } }
  return best;
}
function partAt(){const meshes=[];for(const p of parts) p.root.traverse(o=>{if(o.isMesh&&o!==p.halo) meshes.push(o)}); const h=ray.intersectObjects(meshes,false)[0]; return h?h.object.userData.part:null}
function wireAt(){const t=wires.map(w=>w.tube); const h=ray.intersectObjects(t,false)[0]; return h?h.object.userData.wire:null}
let drag=null, down=null, holdBtn=null;
const touchThr=e=>e.pointerType==='touch'?24:13;

renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.button!==0&&e.pointerType==='mouse') return;
  setNdc(e); down={x:e.clientX,y:e.clientY,t:performance.now()};
  // botón pulsado durante la prueba
  if(sim.running){const p=partAt(); if(p&&p.def.button){ if(p.def.toggle){p.pressed=!p.pressed; if(p.refs.lever) p.refs.lever.position.x=p.pressed?1.5:-1.5; down.consumed=true; evaluate(); return} holdBtn=p; p.pressed=true; controls.enabled=false; evaluate(); return}}
  if(mode==='wire'){
    const hit=pinAt(e,touchThr(e));
    if(hit){
      controls.enabled=false;
      if(pending&&pending.pin!==hit.pin){addWire(pending,hit); setPending(null); down.consumed=true; return}
      setPending(hit); drag={wireFrom:hit}; return;
    }
    return;
  }
  const p=partAt();
  if(p){ controls.enabled=false; select(p); ray.ray.intersectPlane(plane,tmp); drag={part:p,off:tmp.clone().sub(p.root.position).setY(0),moved:false}; renderer.domElement.setPointerCapture(e.pointerId); }
});
renderer.domElement.addEventListener('pointermove',e=>{
  setNdc(e);

      p.root.position.y=4; drag.moved=true; refreshWires(p);} hideTip(); return; }
  const thr=touchThr(e);

  setHover(hit,e);
  if(mode==='wire'&&(pending||drag?.wireFrom)){ const from=drag?.wireFrom||pending; const a=pinWorld(from.pin,from.part);
    let b; if(hit) b=pinWorld(hit.pin,hit.part); else { const pl=new THREE.Plane(UP,-a.y); b=new THREE.Vector3(); if(!ray.ray.intersectPlane(pl,b)) b.copy(a); }

});
window.addEventListener('pointerup',e=>{
  if(holdBtn){holdBtn.pressed=false; holdBtn=null; controls.enabled=true; evaluate(); return}
  const moved=down?Math.hypot(e.clientX-down.x,e.clientY-down.y):0;
  if(drag?.part){ drag.part.root.position.y=0; if(drag.moved){refreshWires(drag.part); changed()} drag=null; controls.enabled=true; return }
  if(drag?.wireFrom){ const tgt=pinAt(e,touchThr(e)); if(tgt&&tgt.pin!==drag.wireFrom.pin&&moved>6){addWire(drag.wireFrom,tgt); setPending(null)} drag=null; controls.enabled=true; return }
  controls.enabled=true;
  if(!down||down.consumed||moved>6||e.target!==renderer.domElement){down=null; return}
  down=null; setNdc(e);
  const w=wireAt();
  if(w){selectWire(w); return}

});
renderer.domElement.addEventListener('pointerleave',()=>{hideTip(); hoverRing.visible=false});

function setPending(h){pending=h; startRing.visible=!!h; preview.visible=!!h; if(h){startRing.position.copy(pinWorld(h.pin,h.part)); const a=startRing.position.clone(); updatePreview(a,a); toast(`Pin ${h.pin.label} elegido: toca otro pin para unirlo`)} }

}

window.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')) return;
  if(e.key==='Delete'||e.key==='Backspace'){deleteSel(); e.preventDefault()}
  else if(e.key==='r'||e.key==='R') rotateSel();
  else if(e.key==='w'||e.key==='W') setMode('wire');

      <h2>Monta tu circuito</h2><button id="cardToggle">Ver</button>
      <div class="more"><ol class="steps">
        <li><span>Toca una placa o un componente en la bandeja de abajo para ponerlo en la mesa.</span></li>
        <li><span>Pulsa <b>Cablear</b> y toca un pin y después otro. Si pasas por encima de un pin verás su nombre.</span></li>
        <li><span>Pulsa <b>Probar</b>: el monitor te dice qué funciona, qué falta y te da el código.</span></li>
      </ol>
      <div class="legend">${['io','p5','p3','gnd'].map(t=>`<span><i class="dot" style="background:${PIN_COLORS[t]}"></i>${PIN_NAMES[t].replace('Alimentación ','')}</span>`).join('')}</div>
      <p style="color:var(--muted)">Gira la vista arrastrando sobre la mesa y acerca con la rueda o con dos dedos.</p></div>`;

    el.innerHTML=`<div class="eyebrow"><span>${d.kind==='board'?'Placa':'Componente'} · ${esc(d.short)}</span><span>${conn.size}/${p.pins.length} pines</span></div>

      <p>${esc(d.info.text)}</p>
      ${d.bb?`<p style="color:var(--muted)">Tiene ${p.pins.length} agujeros. Pasa por encima para ver el nombre de cada uno.</p>`:''}<div class="pinlist">${d.bb?'':p.pins.map(pin=>`<button data-i="${pin.idx}" class="${conn.has(pin)?'on':''}" title="${PIN_NAMES[pin.type]}"><i class="dot" style="background:${PIN_COLORS[pin.type]}"></i>${esc(pin.label)}</button>`).join('')}</div></div>`;
    el.querySelectorAll('.pinlist button').forEach(b=>b.onclick=()=>{const pin=p.pins[+b.dataset.i]; findRing.position.copy(pinWorld(pin,p)); findRing.visible=true; findUntil=performance.now()+2600; toast(`${pin.label}: ${PIN_NAMES[pin.type]}`)});

function load(data){
  clearAll(); const byId={};
  for(const p of data.parts||[]) if(DEFS[p.type]) byId[p.id]=addPart(p.type,p.x,p.z,p.rot||0,p.id);
  for(const p of parts) p.root.rotation.y=-p.rot*Math.PI/2;
  for(const w of data.wires||[]){const A=byId[w.a[0]],B=byId[w.b[0]]; if(A&&B&&A.pins[w.a[1]]&&B.pins[w.b[1]]) addWire({part:A,pin:A.pins[w.a[1]]},{part:B,pin:B.pins[w.b[1]]},w.c,true)}
  renderCard();

function loadExample(ex){

/* ---------- simulación ---------- */
const sim={running:false,t0:0,res:null,audio:null,lastBeep:0};
function uf(){const par=new Map(); const f=k=>{while(par.has(k)&&par.get(k)!==k){const n=par.get(k); par.set(k,par.get(n)??n); k=n} return k}; return {find:f,union(a,b){const x=f(a),y=f(b); if(x!==y) par.set(x,y); if(!par.has(y)) par.set(y,y)}}}
const K=(part,i)=>part.id+':'+i;
function buildNets(joinRes){
  const u=uf(); for(const w of wires) u.union(K(w.a.part,w.a.pin.idx),K(w.b.part,w.b.pin.idx));
  for(const p of parts){ if(p.def.resistor&&joinRes) u.union(K(p,0),K(p,1)); if(p.def.button&&p.pressed) u.union(K(p,0),K(p,1));
    if(p.def.bridgeKey){const first={}; p.pins.forEach(pin=>{const k=p.def.bridgeKey(pin.label); if(k in first) u.union(K(p,first[k]),K(p,pin.idx)); else first[k]=pin.idx})} }
  const info=new Map();
  const get=r=>{if(!info.has(r)) info.set(r,{io:[],gnd:false,p5:false,p3:false,pins:[]}); return info.get(r)};
  for(const p of parts) if(p.def.kind==='board') p.pins.forEach(pin=>{const n=get(u.find(K(p,pin.idx))); n.pins.push({part:p,pin}); if(pin.type==='io') n.io.push({part:p,pin}); if(pin.type==='gnd') n.gnd=true; if(pin.type==='p5') n.p5=true; if(pin.type==='p3') n.p3=true});
  for(const p of parts) if(p.def.roles) p.def.roles.forEach(([,role],i)=>{ if(!'530o'.includes(role)) return; const n=get(u.find(K(p,i))); if(role==='5') n.p5=true; if(role==='3') n.p3=true; if(role==='0') n.gnd=true; if(role==='o') n.drv=true; });
  return {of(part,i){return info.get(u.find(K(part,i)))||{io:[],gnd:false,p5:false,p3:false,pins:[]}}, info};
}
function evaluate(){
  const N1=buildNets(true), N0=buildNets(false); const items=[]; const active=new Map();
  // problemas globales
  for(const n of N0.info.values()){
    if(n.gnd&&(n.p5||n.p3)) items.push({level:'err',title:'¡Cortocircuito!',text:'Hay un cable que une la alimentación (5 V o 3,3 V) directamente con GND. En la vida real la placa se apagaría o se dañaría. Quita ese cable.'});
    else if(n.p5&&n.p3) items.push({level:'err',title:'5 V unido con 3,3 V',text:'Dos alimentaciones distintas están unidas. Quita ese cable.'});
    if(n.io.length&&(n.gnd||n.p5||n.p3)) items.push({level:'warn',title:`${n.io.map(x=>x.pin.label).join(', ')} unido directo a ${n.gnd?'GND':'alimentación'}`,text:'Si el programa pone ese pin como salida, haría un cortocircuito. Normalmente aquí va un componente en medio.'});
  }
  const drive=n=>n.io.length>0||n.p5||n.p3;
  const pwr=n=>n.p5||n.p3;
  const pinNames=n=>n.io.map(x=>x.pin.label).join('/');
  const boardOf=n=>n.io[0]?.part||n.pins[0]?.part;
  for(const p of parts){ if(p.def.kind!=='comp') continue; const nm=p.def.name; const S=i=>N1.of(p,i);
    const missing=[]; let res=null;
    const d=p.def; const kind=d.led||d.buzz?'led':d.resistor?'res':d.button?'boton':d.servo?'servo':d.motor?'motor':d.passive?'passive':d.source?'source':d.bb||d.conn?'bb':d.gen?'gen':p.type;
    switch(kind){
      case 'bb': continue;
      case 'passive': { if(wires.some(w=>w.a.part===p||w.b.part===p)) res={level:'note',title:nm+': conectado',text:d.hint||''}; else continue; break }
      case 'source': { if(!wires.some(w=>w.a.part===p||w.b.part===p)) continue; res={level:'note',title:nm,text:'Da energía al circuito.'}; break }
      case 'motor': { const A=S(0),B=S(1); const src=n=>n.drv||pwr(n)||n.io.length>0, sink=n=>n.gnd||n.drv;
        let hi=null; if(src(A)&&sink(B)) hi=A; else if(src(B)&&sink(A)) hi=B;
        if(!hi){missing.push('une un borne a la salida de un driver (L298N, relé, MOSFET) o a la alimentación, y el otro a GND o al driver'); break}
        const weak=hi.io.length>0&&!hi.drv&&!pwr(hi); active.set(p,{weak});
        res={level:weak?'warn':'ok',title:nm+(d.valve?' abierta':' girando'),text:weak?'Un pin de la placa no tiene fuerza para mover un motor: en la vida real no giraría o dañaría la placa. Usa un driver L298N, un MOSFET o un relé.':'Recibe energía a través del driver o la fuente.'}; break }
      case 'gen': { const map={}; let board=null, warn='', err='';
        d.roles.forEach(([lab,role],i)=>{ const n=S(i);
          if(role==='v'){ if(!pwr(n)) missing.push(lab+' a 5 V o 3,3 V'); else if(d.v33&&n.p5&&!n.p3) warn='Este módulo trabaja a 3,3 V: a 5 V se puede estropear. Usa el pin 3V3.' }
          else if(role==='g'){ if(!n.gnd) missing.push(lab+' a GND') }
          else if(role==='s'||role==='a'||role==='x'){ if(!n.io.length){ if(role!=='x') missing.push(lab+(role==='a'?' a un pin analógico':' a un pin de señal')); return }
            let pk=n.io[0]; if(role==='a'){const an=n.io.find(x=>x.part.def.analog.test(x.pin.label)); if(an) pk=an; else err=n.io[0].part.def.fam==='pi'?'La Raspberry Pi no tiene entradas analógicas. Usa un conversor ADC (MCP3008) o una placa Arduino.':`${n.io[0].pin.label} no lee valores analógicos: conecta ${lab} a un pin como A0.`}
            map[lab]=pk; board??=pk.part }
        });
        if(missing.length) break;
        if(err){res={level:'err',title:nm,text:err}; break}
        active.set(p,{board,map,gen:true});
        res={level:warn?'warn':'ok',title:nm+' funcionando',text:warn||('Conectado a '+(Object.entries(map).map(([k,v])=>k+' → '+v.pin.label).join(', ')||'la alimentación')+'.'),live:d.read?'gen':null}; break }
      case 'led': {
        const A=S(0),C=S(1);
        if(A.gnd&&drive(C)){res={level:'err',title:nm+' al revés',text:'La pata + debe ir al pin de señal y la − a GND. Dale la vuelta a los cables.'};break}
        if(!drive(A)) missing.push('une la pata + a un pin de señal (por ejemplo D13)');
        if(!C.gnd) missing.push('une la pata − a GND');
        if(missing.length) break;
        const blink=A.io.length>0; active.set(p,{mode:blink?'blink':'on',board:boardOf(A),pin:A.io[0]?.pin});
        const noRes=!d.buzz&&drive(N0.of(p,0))&&N0.of(p,1).gnd;
        res={level:noRes?'warn':'ok',title:nm+(d.buzz?(blink?' pita':' suena fijo'):(blink?' parpadea':' encendido')),
          text:noRes?'Funciona, pero no hay resistencia: en la vida real el LED se quemaría. Pon una de 220 Ω entre el pin y la pata +.':(blink?`Controlado por ${pinNames(A)} de ${boardOf(A).def.name}.`:'Está unido directo a la alimentación, así que siempre está activo.')};
        break; }
      case 'res': { const A=N0.of(p,0),B=N0.of(p,1); const used=wires.some(w=>w.a.part===p||w.b.part===p); if(!used) break;
        res={level:'note',title:nm,text:A.pins.length||B.pins.length?'Conectada. Va en serie con el LED para protegerlo.':'Conectada entre componentes.'}; break; }
      case 'boton': { const A=S(0),B=S(1); const sig=A.io.length?A:B.io.length?B:null, other=sig===A?B:A;
        if(!sig) missing.push('une una pata a un pin de señal'); if(!other.gnd&&!pwr(other)) missing.push('une la otra pata a GND');
        if(missing.length) break; active.set(p,{board:boardOf(sig),pin:sig.io[0].pin,pull:other.gnd?'up':'down'});
        res={level:'ok',title:'Pulsador '+(p.pressed?'PULSADO':'listo'),text:`En ${pinNames(sig)} se lee `,read:p.pressed?(other.gnd?'LOW (pulsado)':'HIGH (pulsado)'):(other.gnd?'HIGH (suelto)':'LOW (suelto)'),tail:sim.running?' Mantén el botón pulsado en la mesa para probarlo.':''}; break; }
      case 'servo': { const G=S(0),V=S(1),Sg=S(2);
        if(!G.gnd) missing.push('cable marrón (GND) a GND'); if(!pwr(V)) missing.push('cable rojo (VCC) a 5 V o VIN'); if(!Sg.io.length) missing.push('cable naranja (SEÑAL) a un pin de señal');
        if(missing.length) break; active.set(p,{board:boardOf(Sg),pin:Sg.io[0].pin});
        res={level:V.p5?'ok':'warn',title:'Servo girando',text:V.p5?`Señal en ${pinNames(Sg)}. Va de 0° a 180°.`:'Funciona, pero a 3,3 V va flojo. Mejor alimentarlo con 5 V o VIN.',live:'servo'}; break; }
      case 'hcsr04': { const V=S(0),T=S(1),E=S(2),G=S(3);
        if(!pwr(V)) missing.push('VCC a 5 V'); if(!G.gnd) missing.push('GND a GND'); if(!T.io.length) missing.push('TRIG a un pin de señal'); if(!E.io.length) missing.push('ECHO a otro pin de señal');
        if(missing.length) break; const b=boardOf(E); active.set(p,{board:b,trig:T.io[0].pin,echo:E.io[0].pin});
        const warn=!V.p5?'Este sensor necesita 5 V para funcionar bien.':(b.def.logic<5?'El ECHO devuelve 5 V y esta placa trabaja a 3,3 V: pon un divisor de tensión (dos resistencias).':'');
        res={level:warn?'warn':'ok',title:'Midiendo distancia',text:warn||`TRIG en ${pinNames(T)}, ECHO en ${pinNames(E)}.`,live:'dist',part:p}; break; }
      case 'dht11': { const V=S(0),D=S(1),G=S(2);
        if(!pwr(V)) missing.push('VCC a 3,3 V o 5 V'); if(!G.gnd) missing.push('GND a GND'); if(!D.io.length) missing.push('DATA a un pin de señal');
        if(missing.length) break; active.set(p,{board:boardOf(D),pin:D.io[0].pin}); res={level:'ok',title:'Leyendo temperatura y humedad',text:`Datos por ${pinNames(D)}.`,live:'dht',part:p}; break; }
      case 'pot': { const G=S(0),O=S(1),V=S(2);
        if(!G.gnd&&!V.gnd) missing.push('un extremo a GND'); if(!pwr(V)&&!pwr(G)) missing.push('el otro extremo a 3,3 V o 5 V'); if(!O.io.length) missing.push('el centro (OUT) a un pin analógico');
        if(missing.length) break; const b=boardOf(O); const an=O.io.find(x=>x.part.def.analog.test(x.pin.label));
        if(!an){res={level:'err',title:'Potenciómetro en un pin no analógico',text:b.def.fam==='pi'?'La Raspberry Pi no tiene entradas analógicas. Usa un conversor ADC (por ejemplo MCP3008) o una placa Arduino.':`${pinNames(O)} no lee valores analógicos. Usa un pin como ${b.def.fam==='esp32'?'D34':b.def.fam==='stm32'?'A0':'A0'}.`};break}
        active.set(p,{board:an.part,pin:an.pin,max:/esp32|stm32/.test(an.part.def.fam)?4095:1023}); res={level:'ok',title:'Potenciómetro',text:`Leído por ${an.pin.label}. Valor:`,live:'pot',part:p}; break; }
      case 'oled': { const G=S(0),V=S(1),C=S(2),D=S(3);
        if(!G.gnd) missing.push('GND a GND'); if(!pwr(V)) missing.push('VCC a 3,3 V o 5 V'); if(!C.io.length) missing.push('SCL a un pin de señal'); if(!D.io.length) missing.push('SDA a un pin de señal');
        if(missing.length) break; const b=boardOf(D); active.set(p,{board:b,scl:C.io[0].pin,sda:D.io[0].pin});
        const def=/^(SDA|SCL|A4|A5|GPIO2|GPIO3|D21|D22|D1|D2|B6|B7|D20)$/; const std=def.test(C.io[0].pin.label)&&def.test(D.io[0].pin.label);
        res={level:std?'ok':'warn',title:'Pantalla OLED encendida',text:std?`I2C en ${pinNames(D)} (SDA) y ${pinNames(C)} (SCL).`:'Funcionará indicando los pines en el código, pero los pines I2C normales de esta placa son otros (SDA/SCL).'}; break; }
    }
    if(!res&&missing.length) res={level:'idle',title:nm+': falta conectar',text:'Para que funcione: '+missing.join(', ')+'.'};
    if(!res&&kind!=='res') res={level:'idle',title:nm,text:'Sin conectar todavía.'};
    if(res){res.part=p; items.push(res)}
  }
  if(!parts.some(p=>p.def.kind==='board')) items.unshift({level:'idle',title:'Falta una placa',text:'Pon una placa (Arduino, ESP32, Raspberry Pi…) para controlar los componentes.'});
  if(!items.length) items.push({level:'idle',title:'La mesa está vacía',text:'Añade una placa y algún componente desde la bandeja.'});
  sim.res={items,active};
  renderMonitor();
}

function stopSim(){ sim.running=false; $('#play').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg><span>Probar</span>'; resetVisuals(); if(!$('#monitor').hidden) renderMonitor() }

function liveText(it,t){
  if(it.live==='dist') return `${(38+28*Math.sin(t*.7)+6*Math.sin(t*2.3)).toFixed(1)} cm`;
  if(it.live==='dht') return `${(22.4+.6*Math.sin(t*.2)).toFixed(1)} °C · ${(46+3*Math.sin(t*.13)).toFixed(0)} %`;
  if(it.live==='pot'){const a=sim.res.active.get(it.part); return String(Math.round((Math.sin(t*.6)*.5+.5)*(a?.max||1023)))}
  if(it.live==='servo') return '';
  if(it.live==='gen') return it.part.def.read(t);
  return '';
}
function renderMonitor(){
  $('#mtCheck').classList.toggle('on',mtab==='check'); $('#mtCode').classList.toggle('on',mtab==='code');
  const b=$('#mbody'); if(!sim.res) evaluateQuiet();
  if(mtab==='code'){ b.innerHTML=renderCode(); b.querySelectorAll('[data-copy]').forEach(btn=>btn.onclick=()=>{const pre=btn.closest('div').nextElementSibling; navigator.clipboard?.writeText(pre.textContent).then(()=>toast('Código copiado'),()=>{selectText(pre); toast('Selecciona y copia el texto')})}); return }
  const it=sim.res.items; const ok=it.filter(x=>x.level==='ok'||x.level==='warn').length, bad=it.filter(x=>x.level==='err').length, pend=it.filter(x=>x.level==='idle').length;

    it.map((x,i)=>`<div class="item ${x.level}"><i class="bar"></i><div><b>${esc(x.title)}</b><span>${esc(x.text)}${x.read?` <span class="read" style="display:inline">${esc(x.read)}</span>`:''}${x.tail?esc(x.tail):''}${x.live&&x.live!=='servo'?` <span class="read" data-live="${i}" style="display:inline">${sim.running?liveText(x,(performance.now()-sim.t0)/1000):'—'}</span>`:''}</span></div></div>`).join('');
}

/* ---------- generador de código ---------- */
function pinRef(fam,l){
  if(fam==='avr') return /^D(\d+)$/.test(l)?l.slice(1):l;
  if(fam==='esp32'){const m={RX2:'16',TX2:'17',RX0:'3',TX0:'1',VP:'36',VN:'39'}; return m[l]||(/^(D|IO)(\d+)$/.test(l)?l.replace(/^(D|IO)/,''):l)}
  if(fam==='esp8266'){return {RX:'3',TX:'1'}[l]||l}
  if(fam==='stm32') return /^[ABC]\d+$/.test(l)?'P'+l:l;
  if(fam==='pi') return l.replace('GPIO','');
  if(fam==='rp2040') return l.replace('GP','');
  if(fam==='attiny') return l.replace('P','');
  return l;
}
function renderCode(){
  const act=sim.res.active; const byBoard=new Map();
  for(const [p,a] of act){ if(!a.board) continue; if(!byBoard.has(a.board)) byBoard.set(a.board,[]); byBoard.get(a.board).push([p,a]) }
  if(!byBoard.size) return `<div class="item idle"><i class="bar"></i><div><b>Aún no hay nada que programar</b><span>Cuando un componente esté bien conectado a una placa, aquí aparecerá el código de partida para copiarlo al IDE de Arduino (o a Python en la Raspberry Pi).</span></div></div>`;
  let html='';
  for(const [board,list] of byBoard){
    const fam=board.def.fam; const code=fam==='pi'?codePi(list):codeArduino(fam,list);
    html+=`<div class="codehead"><span>${esc(board.def.name)} · ${fam==='pi'?'Python':'Arduino (C++)'}</span><button data-copy>Copiar</button></div><pre class="code">${esc(code)}</pre>`;
  }
  return html;
}
function kindOf(p){const d=p.def; return d.led||d.buzz?'led':d.resistor?'res':d.button?'boton':d.servo?'servo':d.motor?'motor':d.passive?'passive':d.source?'source':d.bb||d.conn?'bb':d.gen?'gen':p.type}

        const N=(cnt['g_'+p.type]=(cnt['g_'+p.type]||0)+1);
        const fill=line=>{let ok=true; const out=line.replace(/\{(\w+)\}/g,(m,k)=>{ if(k==='N') return N; const pk=a.map[k]; if(!pk){ok=false; return m} return R(pk.pin)}); return ok?out:null};
        const add=(arr,str)=>{ if(!str) return; for(const l of str.split('|')){const f=fill(l); if(f!==null) arr.push(f)} };

        if(JSON.stringify(tpl).includes('Serial')) serial=true; break }
      case 'led': if(p.def.buzz){const n=nm('ZUMBADOR'); glob.push(`const int ${n} = ${R(a.pin)};`); setup.push(`pinMode(${n}, OUTPUT);`); on.push(`digitalWrite(${n}, HIGH);   // suena`); off.push(`digitalWrite(${n}, LOW);`); break}
      {const n=nm('LED').toUpperCase(); glob.push(`const int ${n} = ${R(a.pin)};   // ${p.def.name}`); setup.push(`pinMode(${n}, OUTPUT);`); on.push(`digitalWrite(${n}, HIGH);`); off.push(`digitalWrite(${n}, LOW);`); break}
      case 'zumbador': {const n=nm('ZUMBADOR'); glob.push(`const int ${n} = ${R(a.pin)};`); setup.push(`pinMode(${n}, OUTPUT);`); on.push(`digitalWrite(${n}, HIGH);   // pita`); off.push(`digitalWrite(${n}, LOW);`); break}

        setup.push('pantalla.begin(SSD1306_SWITCHCAPVCC, 0x3C);','pantalla.clearDisplay();','pantalla.setTextSize(2);','pantalla.setTextColor(SSD1306_WHITE);','pantalla.setCursor(0, 0);','pantalla.println("Hola!");','pantalla.display();'); break}
    }
  }
  if(serial) setup.unshift('Serial.begin(115200);');
  if(on.length){loop.push(...on,'delay(500);',...off,'delay(500);')} else if(loop.length) loop.push('delay(200);');
  const ind=a=>a.map(l=>'  '+l).join('\n');
  return `// Código de partida generado por RoboLab XXI\n${[...inc].join('\n')}${inc.size?'\n\n':''}${glob.length?glob.join('\n')+'\n\n':''}void setup() {\n${ind(setup)}\n}\n\nvoid loop() {\n${ind(loop)}\n}\n`;

function codePi(list){
  const imp=new Set(['from time import sleep']), glob=[], loop=[], on=[], off=[]; const cnt={}; const nm=b=>{cnt[b]=(cnt[b]||0)+1; return b+cnt[b]};
  for(const [p,a] of list){ const g=pin=>pinRef('pi',pin.label);
    switch(kindOf(p)){
      case 'gen': { const tpl=p.def.py; if(!tpl){glob.push(`# ${p.def.name}: en Raspberry Pi necesita su librería de Python (pines: ${Object.entries(a.map).map(([k,v])=>k+'=GPIO'+g(v.pin)).join(', ')})`); break}
        const N=(cnt['g_'+p.type]=(cnt['g_'+p.type]||0)+1);
        const fill=line=>{let ok=true; const out=line.replace(/\{(\w+)\}/g,(m,k)=>{ if(k==='N') return N; const pk=a.map[k]; if(!pk){ok=false; return m} return g(pk.pin)}); return ok?out:null};
        const add=(arr,str)=>{ if(!str) return; for(const l of str.split('|')){const f=fill(l); if(f!==null) arr.push(f)} };
        (tpl.imp||'').split('|').filter(Boolean).forEach(x=>imp.add(x)); add(glob,tpl.glob); add(loop,tpl.loop); break }
      case 'led': if(p.def.buzz){imp.add('from gpiozero import Buzzer'); const n=nm('zumbador'); glob.push(`${n} = Buzzer(${g(a.pin)})`); on.push(`${n}.on()`); off.push(`${n}.off()`); break}
      {imp.add('from gpiozero import LED'); const n=nm('led'); glob.push(`${n} = LED(${g(a.pin)})`); on.push(`${n}.on()`); off.push(`${n}.off()`); break}
      case 'zumbador': {imp.add('from gpiozero import Buzzer'); const n=nm('zumbador'); glob.push(`${n} = Buzzer(${g(a.pin)})`); on.push(`${n}.on()`); off.push(`${n}.off()`); break}
      case 'servo': {imp.add('from gpiozero import AngularServo'); const n=nm('servo'); glob.push(`${n} = AngularServo(${g(a.pin)}, min_angle=0, max_angle=180)`); loop.push(`for angulo in range(0, 181, 30):`,`    ${n}.angle = angulo`,`    sleep(0.2)`); break}
      case 'hcsr04': {imp.add('from gpiozero import DistanceSensor'); const n=nm('sensor'); glob.push(`${n} = DistanceSensor(echo=${g(a.echo)}, trigger=${g(a.trig)})`); loop.push(`print("Distancia:", round(${n}.distance * 100, 1), "cm")`); break}
      case 'dht11': {imp.add('import board, adafruit_dht'); const n=nm('dht'); glob.push(`${n} = adafruit_dht.DHT11(board.D${g(a.pin)})`); loop.push(`print("Temp:", ${n}.temperature, "C  Humedad:", ${n}.humidity, "%")`); break}
      case 'boton': {imp.add('from gpiozero import Button'); const n=nm('boton'); glob.push(`${n} = Button(${g(a.pin)})`); loop.push(`if ${n}.is_pressed:`,`    print("Boton pulsado")`); break}
      case 'oled': {imp.add('from luma.core.interface.serial import i2c'); imp.add('from luma.oled.device import ssd1306'); imp.add('from luma.core.render import canvas'); glob.push('pantalla = ssd1306(i2c(port=1, address=0x3C))','with canvas(pantalla) as dibujo:','    dibujo.text((0, 0), "Hola!", fill="white")'); break}
    }
  }
  if(on.length) loop.push(...on,'sleep(0.5)',...off,'sleep(0.5)'); else loop.push('sleep(1)');
  return `# Código de partida generado por RoboLab XXI\n${[...imp].join('\n')}\n\n${glob.join('\n')}\n\nwhile True:\n${loop.map(l=>'    '+l).join('\n')}\n`;
}

/* ---------- animación de la simulación ---------- */
function resetVisuals(){
  for(const p of parts){ const r=p.refs;
    if(r.led){r.led.m.emissiveIntensity=.05; r.led.sp.material.opacity=0}
    if(r.horn) r.horn.rotation.y=0; if(r.buzz) r.buzz.scale.set(1,1,1);
    if(r.screen) drawOled(p,false,0); if(p.def.gen||p.def.motor) offGen(p); p.sim.gen=false; }
}
let lastLive=0;
function simFrame(now){
  const t=(now-sim.t0)/1000; const act=sim.res?.active||new Map();
  for(const p of parts){ const a=act.get(p), r=p.refs;
    if(r.cap) r.cap.position.y=(p.pressed?-1.1:0)+(p.def.raise+p.def.thick)+3.4+1;
    if(!a){ if(r.led){r.led.m.emissiveIntensity=.05; r.led.sp.material.opacity=0} if(r.screen&&p.sim.on){drawOled(p,false,0);p.sim.on=false} if(p.sim.gen){offGen(p); p.sim.gen=false} continue }
    if(p.def.gen||p.def.motor){ animGen(p,a,t,now); continue }
    const lit=a.mode==='on'||(Math.floor(t*2)%2===0);
    if(r.led){r.led.m.emissiveIntensity=lit?2.2:.05; r.led.sp.material.opacity=lit?.85:0}
    if(r.buzz){const s=lit?1+.04*Math.sin(now*.09):1; r.buzz.scale.set(s,1,s); if(lit&&!p.sim.wasOn&&sim.audio&&now-sim.lastBeep>300){beep(); sim.lastBeep=now} p.sim.wasOn=lit}
    if(r.horn){const tri=(t*0.8)%2; r.horn.rotation.y=-(tri<1?tri:2-tri)*Math.PI}
    if(r.knob){r.knob.rotation.y=-(Math.sin(t*.6)*.5+.5)*Math.PI*1.65+Math.PI*.8}
    if(r.tx){for(const m of r.tx) m.material=(Math.floor(t*6)%2)?MAT.mesh:MAT.steel}
    if(r.screen&&(now-(p.sim.lastDraw||0)>120)){drawOled(p,true,t); p.sim.lastDraw=now; p.sim.on=true}
  }
  if(now-lastLive>250&&!$('#monitor').hidden&&mtab==='check'){ lastLive=now; document.querySelectorAll('[data-live]').forEach(el=>{const it=sim.res.items[+el.dataset.live]; if(it) el.textContent=liveText(it,t)}) }
}
function offGen(p){const r=p.refs; for(const m of r.leds||[]) m.emissiveIntensity=0; if(r.px) for(const m of r.px){m.color.set(0x2a2a2a); m.emissive.set(0x000000)} if(r.scr) drawScreen(p,false,0); if(r.led){r.led.m.emissiveIntensity=.05; r.led.sp.material.opacity=0}}
const _col=new THREE.Color();
function animGen(p,a,t,now){
  const r=p.refs, d=p.def; p.sim.gen=true; const blink=Math.floor(t*2)%2===0;
  for(const m of r.leds||[]) m.emissiveIntensity=d.anim==='blink'?(blink?2:0):1.6;
  if(r.spin){const sp=(d.spinSpeed||7)*(a.weak?.25:1); if(r.spinAxis==='x') r.spin.rotation.x=t*sp; else r.spin.rotation.y=-t*sp}
  if(r.px){r.px.forEach((m,i)=>{_col.setHSL((t*.15+i/r.px.length)%1,1,.55); m.color.copy(_col); m.emissive.copy(_col).multiplyScalar(1.4)})}
  if(r.scr&&now-(p.sim.lastDraw||0)>150){drawScreen(p,true,t); p.sim.lastDraw=now}
  if(d.anim==='rgb'&&r.led){_col.setHSL((t*.2)%1,1,.55); r.led.m.color.copy(_col); r.led.m.emissive.copy(_col); r.led.m.emissiveIntensity=2; r.led.sp.material.color.copy(_col); r.led.sp.material.opacity=.85}
}
function beep(){ try{const ac=sim.audio; if(ac.state==='suspended') ac.resume(); const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=2300; o.type='square'; g.gain.setValueAtTime(.04,ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.16); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+.17)}catch(e){} }


/* ---------- encuadre: centra las piezas en la zona libre de la pantalla ---------- */
function freeRect(){
  const W=innerWidth,H=innerHeight; let l=0,r=W,t=56,b=H;
  const bot=$('#bottom').getBoundingClientRect(); b=Math.min(b,bot.top+8);
  if(W>760){ const c=$('#card').getBoundingClientRect(); if(c.width) l=c.right+8; const m=$('#monitor'); if(!m.hidden){const mr=m.getBoundingClientRect(); r=mr.left-8} }
  else { const c=$('#card').getBoundingClientRect(); if(c.height) t=c.bottom+4; const m=$('#monitor'); if(!m.hidden){const mr=m.getBoundingClientRect(); b=Math.min(b,mr.top)} }
  if(r-l<200){l=0;r=W} if(b-t<150){t=0;b=H}
  return {l,r,t,b,W,H};
}
let viewOff={x:0,y:0}, lastOff=0;
function updateViewOffset(force){
  const f=freeRect(); const dx=(f.l+f.r)/2-f.W/2, dy=(f.t+f.b)/2-f.H/2;
  if(!force&&Math.abs(dx-viewOff.x)<1&&Math.abs(dy-viewOff.y)<1) return;
  viewOff={x:dx,y:dy}; camera.setViewOffset(f.W,f.H,-dx,-dy,f.W,f.H); camera.updateProjectionMatrix();
}
function frameAll(top){
  updateViewOffset(true);
  const box=new THREE.Box3(); for(const p of parts){const h=Math.max(p.def.w,p.def.d)/2, q=p.root.position; box.expandByPoint(new THREE.Vector3(q.x-h,0,q.z-h)); box.expandByPoint(new THREE.Vector3(q.x+h,22,q.z+h))}
  if(box.isEmpty()) box.set(new THREE.Vector3(-60,0,-40),new THREE.Vector3(60,20,40));
  const c=box.getCenter(new THREE.Vector3()); c.y=0; const sz=box.getSize(new THREE.Vector3());
  const f=freeRect(); const fw=(f.r-f.l)/f.W, fh=(f.b-f.t)/f.H;
  const vf=camera.fov*Math.PI/360, hf=Math.atan(Math.tan(vf)*camera.aspect);
  const distH=(sz.x/2+12)/Math.tan(hf)/fw, distV=(Math.max(sz.z,sz.y*1.4)/2+14)/Math.tan(vf)/fh;
  const dist=THREE.MathUtils.clamp(Math.max(distH,distV)*(top?1:1.05),80,900);
  const dir=top?new THREE.Vector3(0,1,.004):new THREE.Vector3(0,.72,.69); dir.normalize();
  flyTo(c,c.clone().addScaledVector(dir,dist));
}

const LEG={led:{'+':'s','−':'g'},boton:{'1':'s','2':'g'},servo:{GND:'g',VCC:'v','SEÑAL':'s'},hcsr04:{VCC:'v',TRIG:'s',ECHO:'s',GND:'g'},dht11:{VCC:'v',DATA:'s',GND:'g'},pot:{GND:'g',OUT:'a',VCC:'v'},oled:{GND:'g',VCC:'v',SCL:'s',SDA:'s'}};

const SPI={avr:{SCK:'D13',MOSI:'D11',MISO:'D12',SS:'D10'},mega:{SCK:'D52',MOSI:'D51',MISO:'D50',SS:'D53'},esp32:{SCK:'D18',MOSI:'D23',MISO:'D19',SS:'D5'},esp8266:{SCK:'D5',MOSI:'D7',MISO:'D6',SS:'D8'},pi:{SCK:'GPIO11',MOSI:'GPIO10',MISO:'GPIO9',SS:'GPIO8'}};
function spiRole(p,lab){ const has=l=>p.pins.some(q=>q.label===l);

function nearestBoard(p){

function guideFor(p){

    const outs=dr.outs; const p2=outs.find(x=>/OUT−/.test(x.label));

      const t=i===0?outs[0]:(p2&&p2!==outs[0]?p2:outs[1]); if(t) taken.add(t);
      res.steps.push({pin,target:t,tpart:dr.q,done,what:'Salida del driver'}) });
    res.note=`Los dos bornes del motor van a las salidas del ${dr.q.def.name}. Si gira al revés, cambia los dos cables entre sí.`; return res;
  }
  for(const pin of p.pins){
    const role=roleOf(p,pin); if(!role||'npk'.includes(role)) continue;
    const n=N.of(p,pin.idx); let done=false, target=null, what='';
    if(role==='g'||role==='0'){ done=n.gnd; what='Tierra (GND)'; if(!done) target=pick(x=>x.type==='gnd',true) }
    else if(role==='v'){ done=pwr(n); what=d.v33?'3,3 V':'Alimentación'; if(!done) target=wantV() }
    else if(role==='a'){ done=n.io.some(x=>x.part.def.analog.test(x.pin.label)); what='Pin analógico'; if(!done) target=pick(x=>x.type==='io'&&board.def.analog.test(x.label)) }
    else if(role==='s'||role==='x'){
      done=n.io.length>0; what=role==='x'?'Opcional':'Pin de señal';
      if(!done){ const i2=I2C[bf]; const lab=pin.label;
        const sm=spiRole(p,lab), sb=sm&&(board.type==='mega'?SPI.mega:SPI[bf]);
        if(sb&&sb[sm]) target=pick(x=>x.label===sb[sm]);
        if(!target&&i2&&!sm&&(lab==='SDA'||lab==='SCL')) target=pick(x=>x.label===(lab==='SDA'?i2[0]:i2[1]),true)||pick(x=>x.label===lab,true);
        if(!target){ const pref=PREF[bf]||[]; for(const l of pref){ target=pick(x=>x.label===l); if(target) break }
          if(!target) target=pick(x=>x.type==='io'&&!AVOID.test(x.label)&&!board.def.analog.test(x.label)) || pick(x=>x.type==='io'&&!AVOID.test(x.label)); }
        if(role==='x'&&!target) continue; }
    } else continue;
    res.steps.push({pin,target,tpart:board,done,what,optional:role==='x'});
  }
  if(d.led) res.note='Consejo: pon una resistencia de 220 Ω entre el pin de la placa y la pata + para que el LED no se queme.';
  else if(d.v33) res.note='Este módulo funciona a 3,3 V: no lo conectes a 5 V.';
  else if(res.steps.length&&res.steps.every(s=>s.done)) res.note='¡Todo conectado! Pulsa Probar para verlo funcionar.';
  return res;
}

const normTxt=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function localPlan(text){
  const t=text.toLowerCase(), n=normTxt(text);
  let board='uno'; for(const [r,id] of BOARD_WORDS) if(r.test(t)||r.test(n)){board=id;break}
  const r=RECIPES.find(r=>r.k.test(t)||r.k.test(n));
  if(r) return {title:r.t,text:r.e,board,parts:[...r.p],extra:r.x,tips:r.c,src:'receta'};
  const ps=[]; for(const [re,id] of ALIAS) if(re.test(t)||re.test(n)) ps.push(id);
  if(!ps.length) return null;
  return {title:'Tu proyecto',text:'He elegido las piezas que nombras. Te digo dónde va cada cable.',board,parts:ps,extra:[],tips:[],src:'palabras'};
}
// asegura que el plan es montable: placa válida, LED con resistencia, motor con driver y pilas
function fixPlan(pl){
  if(!DEFS[pl.board]||DEFS[pl.board].kind!=='board') pl.board='uno';
  let list=pl.parts.filter(id=>DEFS[id]&&DEFS[id].kind==='comp'&&!DEFS[id].bb&&!DEFS[id].conn).slice(0,10);
  const leds=list.filter(id=>DEFS[id].led).length, ress=list.filter(id=>DEFS[id].resistor).length;
  for(let i=ress;i<leds;i++) list.push('res220');
  const motors=list.filter(id=>DEFS[id].motor).length;
  if(motors&&!list.some(id=>id==='l298n'||id==='mosfet')) list.unshift(motors>1?'l298n':'mosfet');
  if(motors&&!list.some(id=>DEFS[id].source)) list.push('pilas4aa');
  pl.parts=list; return pl;
}

async function claudePlan(text,signal){

${catalogText()}

Reglas:
- Una sola placa. Normalmente "uno". Usa "esp32" si necesita WiFi o internet. Usa "pi4" solo si lo pide.
- Entre 1 y 8 piezas (sin contar la placa). Repite el id si necesitas dos iguales.
- Cada LED lleva una resistencia res220.
- Los motores (motor_dc, bomba, ventilador, vibrador) necesitan driver (l298n para dos motores, mosfet para uno) y pilas (pilas4aa).

Responde SOLO con JSON con esta forma:
{"titulo":"nombre corto del proyecto","explicacion":"2 o 3 frases: cómo funciona","placa":"id","piezas":["id","id"],"extra":["…"],"consejos":["consejo práctico para montarlo de verdad"]}`;

}
