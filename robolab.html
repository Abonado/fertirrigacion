    <ul class="mat">${planMaterials(pl).map(s=>`<li>${esc(s)}</li>`).join('')}<li>Cables dupont (te digo cuántos al montarlo)</li><li>Cable USB para la placa</li>${pl.extra.map(s=>`<li class="ext">${esc(s)}</li>`).join('')}</ul>
    ${pl.tips.length?`<h5>Consejos</h5><ul class="tips">${pl.tips.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}
    <div class="arow"><button type="button" class="gbtn primary big" id="aBuild">Montarlo paso a paso</button></div>
    <p class="small">Se pondrán las piezas en la mesa (lo que haya ahora se guarda y puedes recuperarlo).</p>
  </div>`;
  $('#aBuild').onclick=()=>{ closeAsk(); buildProject(plan) };
}

/* coloca las piezas y hace los cables en un orden que se pueda seguir en la vida real */
let prevTable=null;
function autoWire(made){
  const order=[], late=[]; const W=(pa,pb,c,last)=>{ if(!pa.pin||!pb.pin) return; const w=addWire(pa,pb,c,true); if(w) (last?late:order).push(w) };
  const P=(p,l)=>({part:p,pin:p.pins.find(q=>q.label===l)});
  const board=made.find(p=>p.def.kind==='board'); if(!board) return order;
  const drv=made.filter(p=>p.type==='l298n'||p.type==='mosfet'), srcs=made.filter(p=>p.def.source), res=made.filter(p=>p.def.resistor);
  const rank=p=>p.def.kind==='board'||p.def.source||p.def.resistor||p.def.bb||p.def.conn||p.def.passive?-1:(drv.includes(p)||p.type==='tft'||p.pins.some(q=>q.label==='MOSI'))?0:p.def.motor?2:1;
  for(const p of made.filter(p=>rank(p)>=0).sort((a,b)=>rank(a)-rank(b))){
    // las pilas del driver primero (así el +12V no se une al 5V de la placa); en los pasos salen al final
    if(drv.includes(p)){ const s=srcs.shift(); if(s){ if(p.type==='l298n'){ W(P(s,'+'),P(p,'+12V'),'rojo',1); W(P(s,'−'),P(p,'GND'),'negro',1) } else { W(P(s,'+'),P(p,'V+'),'rojo',1); W(P(s,'−'),P(p,'V−'),'negro',1) } } }
    const g=guideFor(p);
    for(const s of g.steps){
      if(s.done||!s.target) continue;
      if(s.optional&&!(p.type==='l298n'&&/^IN/.test(s.pin.label)&&made.filter(q=>q.def.motor).length>1)) continue;
      if(p.def.led&&s.pin.label==='+'&&res.length){ const r=res.shift(); W({part:s.tpart,pin:s.target},P(r,r.pins[0].label)); W(P(r,r.pins[1].label),{part:p,pin:s.pin}); continue }
      W({part:p,pin:s.pin},{part:s.tpart,pin:s.target});
    }
  }
  return order.concat(late);
}
function buildProject(pl){
  try{ prevTable=serialize() }catch(e){ prevTable=null }
  stopSim(); clearAll();
  const board=addPart(pl.board,0,0); const bw=board.def.w;
  board.root.position.x=-Math.min(60,bw*.45);
  const made=[board]; for(const id of pl.parts){ const [x,z]=findSpot(id); made.push(addPart(id,x,z)) }
  // pone la placa a la izquierda y las demás piezas alrededor
  const ws=autoWire(made);
  made.forEach(p=>{p.root.position.y=25+Math.random()*25; p.drop=1});
  changed(); startBuild(pl,ws);
}

/* ---------- modo montaje: un paso cada vez ---------- */
let build=null;
const ROLE_TXT={g:'GND es el negativo (la tierra). Todos los GND del circuito van unidos.',v:'Este cable le da corriente a la pieza.',5:'Este cable lleva la corriente de las pilas.',3:'Este cable le da corriente a la pieza (3,3 V).',s:'Por este cable la placa manda o recibe la señal.',x:'Por este cable la placa manda o recibe la señal.',a:'Pin analógico: la placa lee un valor que va de 0 a 1023.',m:'Así le llega la fuerza al motor desde el driver.',o:'Salida que mueve el motor.'};
function wireInfo(w){
  // ordena: primero la pieza, luego la placa
  let A=w.a,B=w.b; if(A.part.def.kind==='board'&&B.part.def.kind!=='board'){[A,B]=[B,A]}
  const ra=roleOf(A.part,A.pin), rb=roleOf(B.part,B.pin);
  let hint=ROLE_TXT[ra]||ROLE_TXT[rb]||'';
  if(A.part.def.resistor||B.part.def.resistor) hint='La resistencia protege el LED. Da igual en qué sentido la pongas.';
  if((A.part.def.led&&A.pin.label==='+')||(B.part.def.led&&B.pin.label==='+')) hint='La pata larga del LED es el +.';
  if((A.part.def.led&&A.pin.label==='−')||(B.part.def.led&&B.pin.label==='−')) hint='La pata corta del LED es el −, y va a GND.';
  if(A.part.def.source||B.part.def.source) hint='Las pilas van al final. Pon el cable pero mete las pilas cuando hayas subido el programa.';
  const idx=build.wires.indexOf(w); const shared=[A,B].find(e=>e.part.def.kind==='board'&&build.wires.slice(0,idx).some(o=>o.a.pin===e.pin||o.b.pin===e.pin));
  return {A,B,hint,shared};
}
function startBuild(pl,ws){
  build={pl,wires:ws,i:0}; document.body.classList.add('building'); select(null); selectWire(null); setPending(null); setMode('move');
  const dupont=ws.length, multi=new Map(); ws.forEach(w=>[w.a,w.b].forEach(e=>{ if(e.part.def.kind==='board') multi.set(e.pin,(multi.get(e.pin)||0)+1) }));
  build.needBB=[...multi.values()].some(v=>v>1); build.dupont=dupont;
  build.steps=[{k:'parts'},...ws.map(w=>({k:'wire',w})),{k:'code'},{k:'end'}];
  showStep(0);
  setTimeout(()=>frameAll(false),120);
}
function exitBuild(){
  if(!build) return; for(const w of build.wires){ w.hidden=false; w.sel=false; if(wires.includes(w)) buildWireMesh(w) }
  build=null; document.body.classList.remove('building'); $('#tagA').hidden=$('#tagB').hidden=true; findRing.visible=findRing2.visible=false;
  renderGuide(); setTimeout(()=>{updateViewOffset(true); frameAll(false)},60);
}
function colorDot(c){return `<i class="cdot" style="background:${WIRE_COLORS[c]}"></i>`}
function showStep(i){
  const B=build; B.i=Math.max(0,Math.min(B.steps.length-1,i)); const st=B.steps[B.i], n=B.steps.length;
  const wi=st.k==='wire'?B.wires.indexOf(st.w):(st.k==='parts'?-1:B.wires.length);
  B.wires.forEach((w,j)=>{ const hid=j>wi, sel=j===wi; if(w.hidden!==hid||!!w.sel!==sel){ w.hidden=hid; w.sel=sel; buildWireMesh(w) } });
  $('#bProg').style.width=((B.i+1)/n*100)+'%';
  $('#bStep').textContent=`Paso ${B.i+1} de ${n}`;
  $('#bPrev').disabled=B.i===0;
  $('#bNext').textContent=B.i===n-1?'Terminar':'Siguiente';
  const body=$('#bBody'); $('#tagA').hidden=$('#tagB').hidden=true; findRing.visible=findRing2.visible=false; B.cur=null;
  if(st.k==='parts'){
    const mats=planMaterials(B.pl);
    $('#bTitle').textContent='Prepara las piezas';
    body.innerHTML=`<p>${esc(B.pl.title)}. Ten a mano esto antes de empezar:</p><ul class="mat cols">${mats.map(s=>`<li>${esc(s)}</li>`).join('')}<li>${B.dupont} cables dupont</li>${B.needBB?'<li>Protoboard pequeña</li>':''}<li>Cable USB</li>${B.pl.extra.map(s=>`<li class="ext">${esc(s)}</li>`).join('')}</ul><p class="small">Trabaja con la placa desconectada del USB y de las pilas. En la pantalla verás cada cable en su sitio.</p>`;
    frameAll(false);
  } else if(st.k==='wire'){
    const w=st.w, f=wireInfo(w); B.cur=f;
    $('#bTitle').innerHTML=`${colorDot(w.color)} Cable ${esc(w.color)}`;
    body.innerHTML=`<div class="conn"><div class="end"><small>${esc(f.A.part.def.name)}</small><b>${esc(f.A.pin.label)}</b></div><div class="line" style="--c:${WIRE_COLORS[w.color]}"></div><div class="end"><small>${esc(f.B.part.def.name)}</small><b>${esc(f.B.pin.label)}</b></div></div>
      <p>Une el pin <b>${esc(f.A.pin.label)}</b> de «${esc(f.A.part.def.name)}» con el pin <b>${esc(f.B.pin.label)}</b> de «${esc(f.B.part.def.name)}».</p>
      ${f.hint?`<p class="small">${esc(f.hint)}</p>`:''}
      ${f.shared?`<p class="warnline">El pin ${esc(f.shared.pin.label)} ya tiene un cable. En la vida real pon los dos en la misma fila de la protoboard (o usa un cable en Y) y de ahí un solo cable a la placa.</p>`:''}`;
    $('#tagA').innerHTML=`<small>${esc(f.A.part.def.name)}</small>${esc(f.A.pin.label)}`; $('#tagB').innerHTML=`<small>${esc(f.B.part.def.name)}</small>${esc(f.B.pin.label)}`;
    $('#tagA').hidden=$('#tagB').hidden=false;
    const a=pinWorld(f.A.pin,f.A.part), b=pinWorld(f.B.pin,f.B.part); const c=a.clone().add(b).multiplyScalar(.5); c.y=0;
    updateViewOffset(true);
    const fr=freeRect(), fw=(fr.r-fr.l)/fr.W, fh=(fr.b-fr.t)/fr.H, vf=camera.fov*Math.PI/360, hf=Math.atan(Math.tan(vf)*camera.aspect);
    const dx=Math.abs(a.x-b.x)/2+28, dz=Math.abs(a.z-b.z)/2+26;
    const dist=THREE.MathUtils.clamp(Math.max(dx/Math.tan(hf)/fw, dz/Math.tan(vf)/fh*1.15),85,700); const dir=new THREE.Vector3(0,.82,.57).normalize();
    flyTo(c,c.clone().addScaledVector(dir,dist));
  } else if(st.k==='code'){
    const codes=codeTexts();
    $('#bTitle').textContent='Sube el programa';
    body.innerHTML=codes.length?`<ol class="small olist"><li>Conecta la placa al ordenador con el cable USB.</li><li>${codes[0].pi?'En la Raspberry Pi, abre Thonny, pega el código y pulsa Run.':'Abre Arduino IDE, elige tu placa en Herramientas, pega el código y pulsa <b>Subir</b> (→).'}</li></ol>${codes.map(c=>`<div class="codehead"><span>${esc(c.name)}</span><button type="button" class="gbtn" data-copy>Copiar</button></div><pre class="code">${esc(c.code)}</pre>`).join('')}`:'<p>Este circuito no necesita programa.</p>';
    body.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{ const t=b.parentElement.nextElementSibling.textContent; (navigator.clipboard?.writeText(t)||Promise.reject()).then(()=>toast('Código copiado'),()=>{ const r=document.createRange(); r.selectNodeContents(b.parentElement.nextElementSibling); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Código seleccionado: cópialo') }) });
    frameAll(false);
  } else {
    $('#bTitle').textContent='¡Listo!';
    body.innerHTML=`<p>Ya está todo conectado. ${B.pl.parts.some(id=>DEFS[id].source)?'Ahora conecta las pilas. ':''}Pulsa <b>Terminar</b> para probarlo aquí en la pantalla y ver si algo falla.</p>${B.pl.tips.length?`<ul class="tips">${B.pl.tips.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}${prevTable?'<button type="button" class="gbtn" id="bRestore">Volver a mi mesa anterior</button>':''}`;
    const rb=$('#bRestore'); if(rb) rb.onclick=()=>{ const d=prevTable; exitBuild(); try{ load(JSON.parse(d)); changed(); toast('Mesa anterior recuperada') }catch(e){} prevTable=null };
    frameAll(false);
  }
}
function codeTexts(){
  evaluate(); const byBoard=new Map(); for(const [p,a] of sim.res.active){ if(!a.board) continue; if(!byBoard.has(a.board)) byBoard.set(a.board,[]); byBoard.get(a.board).push([p,a]) }
  return [...byBoard].map(([b,list])=>{ const pi=b.def.fam==='pi'; return {pi,name:`${b.def.name} · ${pi?'Python':'Arduino (C++)'}`,code:pi?codePi(list):codeArduino(b.def.fam,list)} });
}
$('#bPrev').onclick=()=>showStep(build.i-1);
$('#bNext').onclick=()=>{ if(build.i>=build.steps.length-1){ exitBuild(); if(!sim.running) startSim(); } else showStep(build.i+1) };
$('#bExit').onclick=()=>exitBuild();
function updateTags(){
  if(!build||!build.cur) return; const f=build.cur, r=renderer.domElement.getBoundingClientRect();
  for(const [el,e] of [[$('#tagA'),f.A],[$('#tagB'),f.B]]){ const v=pinWorld(e.pin,e.part).project(camera); el.style.left=((v.x+1)/2*r.width+r.left)+'px'; el.style.top=((1-v.y)/2*r.height+r.top)+'px' }
  const now=performance.now(); findRing.position.copy(pinWorld(f.A.pin,f.A.part)); findRing2.position.copy(pinWorld(f.B.pin,f.B.part)); findRing.visible=findRing2.visible=true; findUntil=now+500;
}

/* ---------- mesa grande: esconde los paneles ---------- */
$('#btnBig').onclick=()=>{ const on=document.body.classList.toggle('clean'); $('#btnBig').textContent=on?'Ver paneles':'Mesa grande'; setTimeout(()=>{updateViewOffset(true); frameAll(topView)},60) };

/* ---------- bucle ---------- */
function frame(now){
  if(window.__pausa){ setTimeout(()=>requestAnimationFrame(frame),500); return }
  requestAnimationFrame(frame);
  if(fly){const k=Math.min(1,(now-fly.t0)/700), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; controls.target.lerpVectors(fly.ft,fly.tt,e); camera.position.lerpVectors(fly.fp,fly.tp,e); if(k>=1) fly=null}
  for(const p of parts){
    if(p.drop){p.root.position.y*=.82; if(p.root.position.y<.05){p.root.position.y=0; p.drop=0} refreshWires(p)}
    if(p.targetRot!==undefined){const d=p.targetRot-p.root.rotation.y; if(Math.abs(d)<.002){p.root.rotation.y=p.targetRot; p.targetRot=undefined; refreshWires(p)} else {p.root.rotation.y+=d*.25; refreshWires(p)}}
  }
  if(pending){startRing.position.copy(pinWorld(pending.pin,pending.part)); startRing.scale.setScalar(1.3+.2*Math.sin(now*.008))}
  if(findRing.visible){ if(now>findUntil){findRing.visible=false; findRing2.visible=false} else {const k=1.4+.6*Math.abs(Math.sin(now*.006)); findRing.scale.setScalar(k); findRing2.scale.setScalar(k)} }
  if(now-lastOff>250){lastOff=now; updateViewOffset()}
  if(sim.running) simFrame(now);
  if(build) updateTags();
  controls.update(); renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; renderer.setSize(innerWidth,innerHeight); updateViewOffset(true)});
const mq=matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener?.('change',drawMat);
new MutationObserver(drawMat).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- arranque ---------- */
async function boot(){
  try{ await Promise.race([Promise.all([document.fonts.load('600 12px "IBM Plex Mono"'),document.fonts.load('700 12px "Chakra Petch"')]),new Promise(r=>setTimeout(r,1800))]) }catch(e){}
  drawMat(); renderTabs(); renderTray(); syncTools();
  let data=null; try{data=JSON.parse(store.get('robolab-xxi')||'null')}catch(e){}
  if(data&&data.parts?.length){ load(data); $('#saved').textContent='Recuperado ✓' } else { loadExample(EXAMPLES[0]) }
  if(innerWidth<760||innerHeight<720){ $('#tray').classList.add('min'); $('#trayToggle').textContent='Piezas ▴' }
  renderCard(); renderGuide(); $('#loading').remove(); requestAnimationFrame(frame); setTimeout(()=>frameAll(false),60);
}
boot();
