<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Lector del clima y del riego</title>
<style>
body{font:13px/1.4 system-ui,'Segoe UI',sans-serif;width:380px;margin:0;padding:12px 14px;color:#15222c;background:#f7f5ef}
h1{font-size:15px;margin:0 0 2px;text-transform:uppercase;letter-spacing:.5px}.sub{color:#5f6b72;margin-bottom:10px}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#5f6b72;margin:8px 0 3px}
input,select{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid #cfd6d1;border-radius:7px;font:inherit;background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{flex:1;padding:8px 10px;border-radius:8px;border:1px solid #cfd6d1;background:#fff;font:inherit;font-weight:700;cursor:pointer;text-transform:uppercase;font-size:11.5px}
button.pri{background:#1a7f4b;color:#fff;border-color:#1a7f4b}button.sm{flex:none;padding:4px 8px;font-size:10.5px}.box{margin-top:10px;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid #e1e5e1}
.ok{color:#1a7f4b}.mal{color:#b00020}table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}th,td{padding:3px 4px;border-bottom:1px solid #eee;text-align:left}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}small{color:#5f6b72}.pag{border:1px solid #e1e5e1;border-radius:8px;padding:6px 8px;margin-top:6px;background:#fff}.pag .t{display:flex;gap:6px;align-items:center}.pag select{width:auto;flex:1}
.url{display:block;word-break:break-all;font-size:11px;color:#5f6b72;margin-top:3px}
</style></head><body>
<h1>Lector del clima y del riego</h1><div class="sub">Lee cada rato las páginas que le digas y las manda a la app</div>
<div class="box" id="estado">…</div>
<label>Páginas que lee</label><div id="paginas"><small>Ninguna todavía</small></div>
<div class="row"><button id="probar">Añadir la pestaña de delante</button></div>
<label for="puente">Dirección del servidor puente</label><input id="puente" placeholder="https://puente-sensores….workers.dev">
<label for="token">Clave (PUENTE_TOKEN)</label><input id="token" type="password">
<label for="cada">Leer cada (minutos)</label><select id="cada"><option>5</option><option>10</option><option>15</option><option>30</option><option>60</option></select>
<div class="row"><button class="pri" id="guardar">Guardar</button><button id="ahora">Leer y mandar ya</button></div>
<div class="box" id="res" hidden></div>
<script src="popup.js"></script></body></html>
